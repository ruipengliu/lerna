syntax = "proto3";
package harness.v1;
option go_package = "lerna/gen/harness/v1;harnessv1";
import "proto/harness/v1/common.proto";
import "proto/harness/v1/authorization.proto";

// Durable task admission. No credential, internal change_id or writable state.
message TaskConstraints { uint32 max_steps = 1; int64 deadline_unix = 2; uint32 model_requests = 3; uint64 model_tokens = 4; }
message DurableSubmission {
 string operation_id = 1;
 string goal = 2;
 repeated string input_refs = 3;
 TaskConstraints constraints = 4;
}
message TaskSnapshot {
 TaskRef ref = 1;
 string goal = 2;
 repeated string input_refs = 3;
 TaskConstraints constraints = 4;
 string state = 5;
 uint64 version = 6;
 string owner = 7;
 uint64 owner_epoch = 8;
 uint32 attempts = 9;
 string result = 10;
 string stop_reason = 11;
 TaskControl control = 12;
 repeated string waiting_reasons = 13;
 uint32 model_used_requests = 14;
 uint32 model_reserved_requests = 15;
 uint64 model_used_tokens = 16;
 uint64 model_reserved_tokens = 17;
 string goal_ref=18; string guidance_ref=19; repeated TaskInputFact input_facts=20;
}
message TaskControl { string intent = 1; string progress = 2; string operation_id = 3; int64 accepted_at = 4; }
message ControlRequest { string operation_id = 1; TaskRef ref = 2; uint64 expected_version = 3; string intent = 4; string reason = 5; }
message ControlReceipt { string operation_id = 1; TaskRef ref = 2; string intent = 3; string outcome = 4; uint64 version = 5; }
message TaskRequest {
 string message_id = 1;
 string namespace = 2;
 oneof body { DurableSubmission submit = 10; TaskRef get = 11; string lookup_operation = 12; ControlRequest control = 13; string lookup_control = 14; TaskUpdate update=15; TaskInput input=16; TaskLimitsAdjustment adjust=17; string lookup_input=18; TaskRef interactions=19; }
}
message TaskResponse {
 string message_id = 1;
 string reply_to = 2;
 string namespace = 3;
 string evidence = 4;
 oneof body { TaskSnapshot task = 10; AuthorizationFailure failure = 11; ControlReceipt control = 12; TaskInputReceipt input_receipt=13; TaskInteractions interactions=14; }
}
// Local binary binding only. Methods do not expose RunStore.
service DurableTaskService {
 rpc Submit(TaskRequest) returns (TaskResponse);
 rpc Get(TaskRequest) returns (TaskResponse);
 rpc LookupOperation(TaskRequest) returns (TaskResponse);
 rpc RequestControl(TaskRequest) returns (TaskResponse);
 rpc LookupControl(TaskRequest) returns (TaskResponse);
 rpc SubmitUpdate(TaskRequest) returns (TaskResponse);
 rpc ProvideInput(TaskRequest) returns (TaskResponse);
 rpc AdjustLimits(TaskRequest) returns (TaskResponse);
 rpc LookupInput(TaskRequest) returns (TaskResponse);
 rpc GetInteractions(TaskRequest) returns (TaskResponse);
}

message TaskUpdate { string operation_id=1; TaskRef ref=2; uint64 expected_version=3; string intent=4; repeated string input_refs=5; string goal_ref=6; string guidance_ref=7; }
message TaskInput { string operation_id=1; TaskRef ref=2; uint64 expected_version=3; string interaction_id=4; string answer_ref=5; }
message LimitValue { bool present=1; uint64 value=2; }
message TaskLimitPatch { LimitValue steps=1; LimitValue requests=2; LimitValue tokens=3; LimitValue deadline=4; }
message TaskLimitsAdjustment { string operation_id=1; TaskRef ref=2; uint64 expected_version=3; TaskLimitPatch patch=4; }
message TaskInputReceipt { string operation_id=1; TaskRef ref=2; string kind=3; string interaction_id=4; uint64 version=5; }
message AnswerConstraint { string kind=1; uint32 max_bytes=2; repeated string choices=3; }
message TaskInteraction { string id=1; string question_ref=2; AnswerConstraint constraint=3; string dependency=4; string dependency_ref=5; string responder=6; int64 expires_unix=7; string state=8; string answer_ref=9; string answer_operation=10; }
message TaskInputFact { string operation_id=1; string subject=2; string kind=3; string reference=4; string interaction_id=5; string question_ref=6; }
message TaskInteractions { TaskRef ref=1; uint64 version=2; repeated TaskInteraction interactions=3; repeated TaskInputFact inputs=4; }
