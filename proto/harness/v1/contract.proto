syntax = "proto3";

package harness.v1;
option go_package = "lerna/gen/harness/v1;harnessv1";

import "proto/harness/v1/execution.proto";
import "proto/harness/v1/websocket.proto";
import public "proto/harness/v1/common.proto";

// Shared sample and bounded WebSocket profile envelope.
message Envelope {
  uint32 protocol_major = 1;
  string message_id = 2;
  optional string reply_to = 3;
  string namespace = 4;
  string operation_id = 5;
  uint32 stream_id = 6;
  uint64 seq = 7;
  string delivery_class = 8;
  oneof body {
    WSHello hello = 20;
    WSWelcome welcome = 21;
    CapabilityRequest query = 22;
    CapabilityResponse answer = 23;
    WSSubscription subscription = 24;
    CapabilityResponse progress = 25;
    WSControl control = 26;
    WSChunk chunk = 27;
    DynamicPayload extension = 28;
    WSReliable reliable = 29;
    WSCursor cursor = 30;
    SubmitRequest request = 10;
    SubmitResponse response = 11;
  }
}

message DynamicPayload {
  string type_name = 1;
  string schema_id = 2;
  string schema_version = 3;
  string schema_digest = 4;
  bytes json = 5;
}

message SubmitRequest {
  optional string goal = 1;
  DynamicPayload input = 2;
}


message SubmitResponse {
  Evidence evidence = 1;
  oneof result {
    TaskRef task = 2;
    Failure failure = 3;
  }
}

enum Evidence {
  EVIDENCE_UNSPECIFIED = 0;
  // No durable acceptance, task execution or external effect is asserted.
  EVIDENCE_CONTRACT_FIXTURE = 1;
}

message Failure {
  ErrorCode code = 1;
  string description = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_MISSING_CAPABILITY = 3;
  ERROR_CODE_IDENTITY_CONFLICT = 4;
}

// The service descriptor is an asset only; no gRPC server is generated here.
service TaskService {
  rpc Submit(Envelope) returns (Envelope);
}
