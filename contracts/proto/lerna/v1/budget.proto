syntax = "proto3";

package lerna.v1;

option go_package = "github.com/ruipengliu/lerna/contracts/gen/go/lerna/v1;lernav1";

// 预算范围：用户或当前任务。
enum BudgetScope {
  BUDGET_SCOPE_UNSPECIFIED = 0;
  BUDGET_SCOPE_USER = 1;
  BUDGET_SCOPE_TASK = 2;
}

// 预算（核心契约 2.3、预算 2.1）：额度、预留和实耗分开记录。M1 只有一个维度。
message Budget {
  string user_id = 1;
  string budget_id = 2;
  BudgetScope scope = 3;
  string task_id = 4;
  string unit = 5;
  // L：已授予的额度。
  int64 limit = 6;
  int64 limit_version = 7;
  // U：已消耗的额度（按计费来源的最大可信金额累加）。
  int64 used = 8;
  // H：尚未确定或尚未结清的预留。
  int64 held = 9;
  // A：可用于新准入的额度 max(0, L − U − H)。
  int64 available = 10;
  // 超支缺口 max(0, U + H − L)。
  int64 deficit = 11;
  // 未知费用的来源数：费用不明时记为未知，不按零继续。
  int32 unknown_sources = 12;
  bool closed = 13;
}

// 预算依据（核心契约 2.3）：准入时保存。
message BudgetBasis {
  repeated string budget_ids = 1;
  string unit = 2;
  // 本次调用的费用上界；上界未知的调用不准入。
  int64 ceiling = 3;
  string reservation_id = 4;
  // 预留的总额：上界 × (发送额度 + 核对额度)。
  int64 reserved = 5;
  string rate_basis_ref = 6;
}

// 设定额度（预算 3：调整额度）。
message SetBudgetCommand {
  BudgetScope scope = 1;
  string task_id = 2;
  int64 limit = 3;
  // 预期的额度版本；0 表示新建。
  int64 expected_limit_version = 4;
}

message SetBudgetResult {
  string budget_id = 1;
  int64 limit_version = 2;
}

// 用量计量方式（核心契约 2.3）。
enum Measurement {
  MEASUREMENT_UNSPECIFIED = 0;
  MEASUREMENT_CUMULATIVE = 1;
  MEASUREMENT_INCREMENT = 2;
  MEASUREMENT_CORRECTION = 3;
  MEASUREMENT_REFUND = 4;
}

// 用量回报（核心契约 2.3）：按计费来源去重，不得只按动作去重。
message UsageReport {
  string report_id = 1;
  string user_id = 2;
  string operation_id = 3;
  string attempt_id = 4;
  int32 send_seq = 5;
  // 规范的来源身份：供应商计费命名空间 + 原生计费实例 + 费用项目。
  string billing_source = 6;
  int64 source_revision = 7;
  Measurement measurement = 8;
  string unit = 9;
  int64 amount = 10;
  bool final = 11;
  // 费用不明：记为未知，而不是零。
  bool unknown = 12;
  string price_version = 13;
  repeated string evidence_refs = 14;
  string task_id = 15;
  string reservation_id = 16;
  // 内部来源标识：出口之前由执行管理按发送固定；供应商身份返回后登记为别名。
  string source_id = 17;
  // 供应商侧的原生计费实例（别名），例如请求标识。
  string native_id = 18;
  // 账单携带的调用方外部键，用于把迟到账单关联回原尝试。
  string external_key = 19;
}

// 动作收尾后关闭预留（预算 2.4）：出口没有发生、以后也不会发生的部分释放；
// 已进入"可能已发出"、费用未知的发送继续占用。
message CloseReservationCommand {
  string user_id = 1;
  string task_id = 2;
  string operation_id = 3;
  // 全部可能已发出的发送对应的内部来源。
  repeated string dispatched_sources = 4;
  string reason = 5;
}

// 计费来源的视图。
message BillingSourceView {
  string source_id = 1;
  string operation_id = 2;
  string task_id = 3;
  string native_id = 4;
  // FINAL、PROVISIONAL、UNKNOWN。
  string status = 5;
  int64 amount = 6;
  int64 held = 7;
}

message BudgetView {
  repeated Budget budgets = 1;
  // 未知或未结清的计费来源。
  repeated string unresolved_sources = 2;
  repeated BillingSourceView sources = 3;
  // 无法关联到任何来源、等待核对的账单。
  repeated string unmatched_bills = 4;
}
