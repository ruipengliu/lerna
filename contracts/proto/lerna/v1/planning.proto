syntax = "proto3";
package lerna.v1;

import "lerna/v1/identity.proto";
import "lerna/v1/submission.proto";

option go_package = "github.com/ruipengliu/lerna/contracts/gen/go/lerna/v1;lernav1";
message CommandHeader {
  CommandIdentity identity = 1;
  uint32 contract_version = 2;
  string schema_id = 3;
  uint32 fingerprint_version = 4;
  repeated string must_understand = 5;
}
message TargetRecordAssertion {
  Ref capability_ref = 1;
  Ref parameters_ref = 2;
}
message CompletionEvidence {
  string condition_id = 1;
  GlobalName operation_id = 2;
  Ref confirmation_ref = 3;
}
message Requirement {
  string condition_id = 1;
  Ref description_ref = 2;
  bool necessary = 3;
  string verification_rule = 4;
  uint32 rule_version = 5;
  TargetRecordAssertion target_record = 6;
}
message Requirements {
  Ref ref = 1;
  GlobalName task_id = 2;
  uint64 requirements_version = 3;
  uint64 bound_input_version = 4;
  string source = 5;
  repeated Requirement conditions = 6;
  CommandIdentity accepted_by = 7;
  Ref source_input_ref = 8;
}
message ContextSnapshot {
  Ref ref = 1;
  Ref task_ref = 2;
  uint64 requirements_version = 3;
  uint64 input_version = 4;
  uint64 control_generation = 5;
  uint64 planning_generation = 6;
  Ref request_ref = 7;
  int64 expires_at_unix_ms = 8;
  repeated Ref content_refs = 9;
  repeated Ref capability_refs = 10;
  repeated Ref progress_refs = 11;
  Ref requirements_ref = 12;
  repeated Ref input_refs = 13;
  repeated SnapshotProgress progress_facts = 14;
  repeated SnapshotInput unprocessed_inputs = 15;
  uint64 bound_input_version = 16;
  RequirementsStatus requirements_status = 17;
  repeated string allowed_purposes = 18;
  uint32 max_model_positions = 19;
  uint32 max_model_sends = 20;
  repeated SnapshotConfirmation confirmations = 21;
  repeated Ref progress_watermarks = 22;
}
message AncestorControl {
  Ref task_ref = 1;
  uint64 control_generation = 2;
}
message MemoryDependency {
  Ref memory_ref = 1;
  string usage = 2;
}
message ActionStep {
  string step_id = 1;
  Ref capability_ref = 2;
  Ref parameters_ref = 3;
  repeated Ref dependencies = 4;
  repeated MemoryDependency memory_dependencies = 5;
  repeated Ref content_refs = 6;
  string work_category = 7;
  bytes arguments_json = 8;
  string schema_digest = 9;
  repeated string expected_evidence = 10;
}
message Proposal {
  Ref ref = 1;
  GlobalName task_id = 2;
  Ref context_snapshot_ref = 3;
  Ref request_ref = 4;
  uint64 requirements_version = 5;
  uint64 input_version = 6;
  uint64 control_generation = 7;
  uint64 planning_generation = 8;
  Ref reasoner_ref = 9;
  string kind = 10;
  ActionStep step = 11;
  repeated CompletionEvidence completion_evidence = 12;
  QuestionProposal question = 13;
  RequirementsProposal requirements_change = 14;
  repeated ConditionVerdict verdicts = 15;
  repeated Ref basis_refs = 16;
  repeated string gaps = 17;
  string result_draft = 18;
  string prompt_version = 19;
  Ref body_content_ref = 20;
}
message PlanningState {
  GlobalName task_id = 1;
  Requirements requirements = 2;
  ContextSnapshot snapshot = 3;
  Proposal proposal = 4;
  repeated Ref admission_refs = 5;
  bool proposal_consumed = 6;
  uint64 verification_freeze = 7;
  repeated Ref rejected_verification_operations = 8;
  repeated uint64 superseded_verification_generations = 9;
  uint64 verification_round = 10;
  Ref verification_ref = 11;
}
message AcceptRequirementsCommand {
  CommandHeader header = 1;
  Ref task_ref = 2;
  uint64 input_version = 3;
  repeated Requirement conditions = 4;
  string source = 5;
}
message RequestProposalCommand {
  CommandHeader header = 1;
  GlobalName task_id = 2;
}
message ReceiveProposalCommand {
  CommandHeader header = 1;
  Proposal proposal = 2;
}

message SnapshotProgress {
  Ref admission_ref = 1;
  Ref operation_ref = 2;
  Ref capability_ref = 3;
  Ref parameters_ref = 4;
  Ref effect_ref = 5;
  string effect_outcome = 6;
  string late_effect = 7;
  bool evidence_conflict = 8;
  string dispatch = 9;
  string lifecycle = 10;
  repeated Ref evidence_refs = 11;
  bool execution_report_pending = 12;
}
message SnapshotInput {
  Ref input_ref = 1;
  Ref content_ref = 2;
  uint64 input_version = 3;
  string processing_status = 4;
  bool changes_basis = 5;
}

message QuestionProposal {
  string question = 1;
  repeated string options = 2;
  repeated string condition_ids = 3;
  bool changes_basis = 4;
  bool involves_confirmation = 5;
}

message RequirementsProposal {
  uint64 original_version = 1;
  repeated Requirement conditions = 2;
  string reason = 3;
  string impact = 4;
}
message ConditionVerdict {
  string condition_id = 1;
  string conclusion = 2;
  repeated Ref evidence_refs = 3;
  Ref confirmation_ref = 4;
  repeated string gaps = 5;
  GlobalName operation_id = 6;
}
message PublishProposalQuestionCommand {
  CommandHeader header = 1;
  Ref proposal_ref = 2;
  GlobalName session_id = 3;
}

message SnapshotConfirmation {
  Ref ref = 1;
  string matter_type = 2;
  string state = 3;
  string condition_id = 4;
  Ref requirements_ref = 5;
  repeated Ref evidence_refs = 6;
  uint64 input_version = 7;
  uint64 control_generation = 8;
  int64 expires_at_unix_ms = 9;
  Ref proposal_ref = 10;
}
message ReasonerDescription {
  uint32 contract_version = 1;
  string implementation_version = 2;
  repeated string supported_kinds = 3;
  uint32 max_call_positions = 4;
  uint32 max_physical_sends = 5;
  uint32 max_plan_length = 6;
}
