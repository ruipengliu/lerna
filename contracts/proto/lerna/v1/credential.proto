syntax = "proto3";
package lerna.v1;

import "lerna/v1/identity.proto";
import "lerna/v1/planning.proto";
import "lerna/v1/submission.proto";

option go_package = "github.com/ruipengliu/lerna/contracts/gen/go/lerna/v1;lernav1";
message ExitCredentialBinding {
  string user_id = 1;
  GlobalName task_id = 2;
  GlobalName operation_id = 3;
  GlobalName attempt_id = 4;
  uint32 send_seq = 5;
  Ref admission_ref = 6;
  Ref grant_use_ref = 7;
  GlobalName subject_id = 8;
  string caller_issuer_id = 9;
  string audience = 10;
  string executor_endpoint_id = 11;
  string executor_instance = 12;
  string descriptor_digest = 13;
  string use_right = 14;
  string processing_purpose = 15;
  uint64 requirements_version = 16;
  uint64 input_version = 17;
  uint64 control_generation = 18;
  Ref budget_reservation_ref = 19;
}
message ExitCredential {
  Ref ref = 1;
  ExitCredentialBinding binding = 2;
  int64 issued_at_unix_ms = 3;
  int64 expires_at_unix_ms = 4;
  uint64 revocation_epoch = 5;
  string state = 6;
  string consumed_send_identity = 7;
}
message IssueExitCredentialCommand {
  CommandHeader header = 1;
  Ref admission_ref = 2;
  ExitCredentialBinding binding = 3;
  int64 expires_at_unix_ms = 4;
}
message ExitCredentialUse {
  Ref ref = 1;
  Ref credential_ref = 2;
  string consumed_send_identity = 3;
  int64 consumed_at_unix_ms = 4;
}
message CloseGrantExitCommand {
  CommandHeader header = 1;
  Ref credential_ref = 2;
  ExitCredentialBinding binding = 3;
  Ref revocation_ref = 4;
}
