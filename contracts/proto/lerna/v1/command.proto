syntax = "proto3";

package lerna.v1;

import "google/protobuf/timestamp.proto";
import "lerna/v1/identity.proto";

option go_package = "github.com/ruipengliu/lerna/contracts/gen/go/lerna/v1;lernav1";

// 错误码（核心契约 3.2）。名称去掉 ERROR_CODE_ 前缀后与核心契约一致。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_INPUT = 1;
  ERROR_CODE_UNSUPPORTED_CONTRACT = 2;
  ERROR_CODE_UNSUPPORTED_FEATURE = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_GRANT_REVOKED = 5;
  ERROR_CODE_CONTENT_UNUSABLE = 6;
  ERROR_CODE_BUDGET_EXCEEDED = 7;
  ERROR_CODE_CONFIRMATION_INVALID = 8;
  ERROR_CODE_STALE_REQUIREMENT = 9;
  ERROR_CODE_STALE_INPUT = 10;
  ERROR_CODE_STALE_GENERATION = 11;
  ERROR_CODE_REVISION_CONFLICT = 12;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 13;
  ERROR_CODE_AUTHORITY_UNREACHABLE = 14;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 15;
  ERROR_CODE_RATE_LIMITED = 16;
  ERROR_CODE_DEADLINE_EXCEEDED = 17;
  ERROR_CODE_TRANSPORT_LOST = 18;
  ERROR_CODE_STALE_CLAIM = 19;
  ERROR_CODE_EVIDENCE_CONFLICT = 20;
  ERROR_CODE_INVARIANT_VIOLATION = 21;
  ERROR_CODE_DATA_LOSS = 22;
}

// 错误分类（核心契约 3.2）。
enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  // 暂时性。
  ERROR_CATEGORY_TRANSIENT = 1;
  // 对当前请求不可恢复。
  ERROR_CATEGORY_PERMANENT = 2;
  // 无法确定是否被接纳或是否生效。
  ERROR_CATEGORY_INDETERMINATE = 3;
}

// 命令的接纳状态：错误必须说清原命令是否已被接纳。
enum CommandAcceptance {
  COMMAND_ACCEPTANCE_UNSPECIFIED = 0;
  // 确定没有接纳（含持久的业务拒绝）。
  COMMAND_ACCEPTANCE_NOT_ACCEPTED = 1;
  // 无法确定，必须用原命令身份查询。
  COMMAND_ACCEPTANCE_UNKNOWN = 2;
  // 原命令已接纳，本次错误针对后续推进。
  COMMAND_ACCEPTANCE_ACCEPTED = 3;
}

// 调用方的恢复动作。
enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED = 0;
  // 修正输入或升级；不执行。
  RECOVERY_ACTION_FIX_INPUT = 1;
  // 取得新的合法依据后提交新命令。
  RECOVERY_ACTION_NEW_COMMAND = 2;
  // 等用户或事实变化。
  RECOVERY_ACTION_WAIT = 3;
  // 用原命令身份查询，必要时原标识原内容重投。
  RECOVERY_ACTION_QUERY_ORIGINAL = 4;
  // 读取当前状态，重新形成意图。
  RECOVERY_ACTION_REREAD = 5;
  // 停止自动推进，由事实负责方核对。
  RECOVERY_ACTION_STOP = 6;
}

// 结构化错误（核心契约 3.1）。
message Error {
  ErrorCode code = 1;
  ErrorCategory category = 2;
  CommandAcceptance command_acceptance = 3;
  RecoveryAction recovery_action = 4;
  repeated Ref related_refs = 5;
  string responsible_domain_id = 6;
  // 建议的最短等待（毫秒）；0 表示没有建议。
  int64 retry_after_ms = 7;
  // 受限的诊断说明，不含正文、秘密或凭据。
  string diagnostic = 8;
}

// 命令信封（核心契约 3.1）。
message CommandEnvelope {
  CommandIdentity identity = 1;
  string command_kind = 2;
  Ref subject = 3;
  string contract_version = 4;
  string schema_id = 5;
  repeated string must_understand = 6;
  string expected_revision = 7;
  // 命令正文：按 command_kind 解释的 Protobuf 编码。
  bytes payload = 8;
  string fingerprint_version = 9;
  bytes fingerprint = 10;
  google.protobuf.Timestamp accept_until = 11;
  // M1 本地绑定不使用；跨进程时承载调用主体的凭据。
  string credential = 12;
}

// 命令阶段（核心契约 2.5）。
enum CommandPhase {
  COMMAND_PHASE_UNSPECIFIED = 0;
  // 已受理：只表示已承担给出决定的责任，不是业务决定。
  COMMAND_PHASE_SUBMITTED = 1;
  COMMAND_PHASE_DECIDED = 2;
}

// 命令决定。
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPTED = 1;
  DECISION_REJECTED = 2;
}

// 回执：受理回执（phase = SUBMITTED）或决定回执（phase = DECIDED）。
message Receipt {
  CommandIdentity identity = 1;
  string command_kind = 2;
  string fingerprint_version = 3;
  bytes fingerprint = 4;
  CommandPhase phase = 5;
  Decision decision = 6;
  // 决定为 REJECTED 时的稳定错误。
  Error rejection = 7;
  repeated Ref result_refs = 8;
  string responsible_domain_id = 9;
  // 负责域内的持久提交位置。
  int64 commit_position = 10;
  google.protobuf.Timestamp decided_at = 11;
  // 按命令类型解释的结果正文（Protobuf 编码）。
  bytes result = 12;
}

// 回执查询的五种结果（核心契约 3.1）。NOT_FOUND 和 UNAVAILABLE 不得解释为"未执行"。
enum ReceiptQueryOutcome {
  RECEIPT_QUERY_OUTCOME_UNSPECIFIED = 0;
  RECEIPT_QUERY_OUTCOME_NOT_FOUND = 1;
  RECEIPT_QUERY_OUTCOME_SUBMITTED = 2;
  RECEIPT_QUERY_OUTCOME_DECIDED = 3;
  RECEIPT_QUERY_OUTCOME_RETIRED = 4;
  RECEIPT_QUERY_OUTCOME_UNAVAILABLE = 5;
}

message ReceiptQueryResponse {
  string responsible_domain_id = 1;
  // 查询读到的修订（提交位置水位）。
  int64 read_position = 2;
  ReceiptQueryOutcome outcome = 3;
  Receipt receipt = 4;
}
