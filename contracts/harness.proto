syntax = "proto3";

package harness.rpc.v1;
option go_package = "github.com/ruipengliu/lerna/internal/wire/rpc/v1;rpcv1";

// Draft harness-grpc-draft-1. See grpc.md for validation and durable semantics.
// JSON bytes retain the existing domain schema and JCS digest rules.
service HarnessService {
  rpc Call(CallRequest) returns (CallResponse);
  // Internal gateway <-> responsible service channel. Devices use WSS.
  rpc EndpointChannel(stream ChannelFrame) returns (stream ChannelFrame);
}

message CallRequest {
  string logical_service_id = 1;
  oneof request {
    bytes command_json = 2;
    bytes query_json = 3;
    bytes receipt_lookup_json = 4;
    bytes upload_reserve_json = 5;
    bytes upload_lookup_json = 6;
    bytes mirror_reserve_json = 7;
    bytes mirror_lookup_json = 8;
    bytes mirror_control_json = 9;
  }
}

message CallResponse {
  oneof result {
    bytes receipt_json = 1;
    bytes query_result_json = 2;
    bytes error_json = 3;
    bytes upload_json = 4;
    bytes mirror_json = 5;
  }
}

message ChannelFrame {
  // Exactly one transport.schema.json Frame, including connection_id.
  bytes frame_json = 1;
  // Must equal harness-binding-id; harness-binding-revision orders registrations.
  // A retry of the same candidate retains both metadata values.
  string binding_id = 2;
}
