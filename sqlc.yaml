version: "2"
sql:
  - engine: postgresql
    schema: migrations/postgres
    queries: internal/storage/postgres/queries
    gen:
      go:
        package: querygen
        out: internal/storage/postgres/querygen
        sql_package: database/sql
        emit_exported_queries: true
  - engine: sqlite
    schema: migrations/sqlite
    queries: internal/storage/sqlite/queries
    gen:
      go:
        package: querygen
        out: internal/storage/sqlite/querygen
        emit_exported_queries: true

