<svg id="02-deployment-comparison" viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-deployment-comparison-title 02-deployment-comparison-desc">
<title id="02-deployment-comparison-title">同一任务，两种运行位置</title>
<desc id="02-deployment-comparison-desc">左侧在一台开发机内运行参考组装和两个有状态模拟设备；右侧仅示意一种云端与手机、电脑的放置。两种形态保持相同授权和结果规则，具体平台支持需分别验证。</desc>
