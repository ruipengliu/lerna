<path class="connector" data-from="ui" data-to="app" data-kind="call" data-route="480,420 800,420" d="M 480,420 L 800,420" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#08-action-recovery-arrow)"/>
