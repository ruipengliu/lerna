<?xml version="1.0" encoding="UTF-8"?>
<svg id="08-action-recovery" viewBox="0 0 960 1064" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-action-recovery-title 08-action-recovery-desc">
<title id="08-action-recovery-title">表单已生效，回执丢失后怎样恢复</title>
<desc id="08-action-recovery-desc">UI 保存 N 的固定路由和待转交记录，再将 N 交给已登记的应用模块。应用模块原子保存订阅开启和 N 的结果，业务回执在返回途中丢失，UI 保留结果待核对状态。重连重新鉴权后按原 N 查询，应用返回原业务结果，UI 补齐投影和发布记录。业务变更不会重新创建；已关闭的表单不因旧消息重开，结果可供查询或呈现在有效界面。本例假定用户有权限，应用支持原操作去重与查询；应用模块和 UI 各自提交。</desc>
<defs><marker id="08-action-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="08-action-recovery-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="1064" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">表单已生效，回执丢失后怎样恢复</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">独立应用表单：操作 N 开启项目通知订阅；无 task_ref，不创建 Harness 任务</text><line x1="160" y1="192" x2="160" y2="992" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="480" y1="192" x2="480" y2="992" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
