<path class="connector" data-from="ui" data-to="app" data-kind="call" data-route="480,760 800,760" d="M 480,760 L 800,760" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#08-action-recovery-arrow)"/>
<path class="connector" data-from="app" data-to="ui" data-kind="return" data-route="800,812 480,812" d="M 800,812 L 480,812" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#08-action-recovery-arrow)"/>
<path class="connector" data-from="ui" data-to="renderer" data-kind="return" data-route="480,976 160,976" d="M 480,976 L 160,976" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#08-action-recovery-arrow)"/>
