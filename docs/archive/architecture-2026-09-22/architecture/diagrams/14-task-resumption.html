<title id="14-task-resumption-title">保留已确认进度，继续原摘要任务</title>
<desc id="14-task-resumption-desc">E1、E2 和摘要 D 的已确认进度保留，S 与 R 已准入，电脑的原作业 J 正在运行。云侧新 Worker 合法领取同一任务 T，通过电脑执行模块核对原 S；电脑沿 J 查询，仍在运行或效果未知时保存有界核对安排，确认保存成功后持久交回结果。云侧在当前条件允许时继续原 R，读回核验后向手机交付位置与来源并取得呈现反馈。图示选择 J 最终保存成功的工作流程，节点名称不是新增任务状态；确认失败、核对权限及控制变化按正文处理。</desc>

<p>E1、E2 和摘要 D 的已确认进度保留，S 与 R 已准入，电脑的原作业 J 正在运行。云侧新 Worker 合法领取同一任务 T，通过电脑执行模块核对原 S；电脑沿 J 查询，仍在运行或效果未知时保存有界核对安排，确认保存成功后持久交回结果。云侧在当前条件允许时继续原 R，读回核验后向手机交付位置与来源并取得呈现反馈。图示选择 J 最终保存成功的工作流程，节点名称不是新增任务状态；确认失败、核对权限及控制变化按正文处理。</p><p><a href="../main/04-engineering/03-reliability-and-recovery.md">返回故障恢复与运行保障</a></p>
