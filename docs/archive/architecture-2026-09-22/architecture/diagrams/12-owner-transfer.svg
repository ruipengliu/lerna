<?xml version="1.0" encoding="UTF-8"?>
<svg id="12-owner-transfer" viewBox="0 0 960 1264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="12-owner-transfer-title 12-owner-transfer-desc">
<title id="12-owner-transfer-title">旧 Owner 先封存，新 Owner 才能激活</title>
<desc id="12-owner-transfer-desc">任务 T 在云侧停止新调度，电脑持久准备一致检查点但不运行；云侧原子封存旧世代并记录发往唯一目标的激活消息，确认提交后才发送凭据；电脑核验后持久激活新世代，本图选择激活回执丢失的窗口，云仍保持封存，查询原移交并取得同一结果后更新路由。</desc>
<defs><marker id="12-owner-transfer-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="12-owner-transfer-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="1264" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">旧 Owner 先封存，新 Owner 才能激活</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">选择激活回执丢失的分支；准备、封存与激活分别在两端本地提交</text><line x1="256" y1="192" x2="256" y2="1200" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="704" y1="192" x2="704" y2="1200" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<path class="connector" data-from="source" data-to="target" data-kind="call" data-route="256,384 704,384" d="M 256,384 L 704,384" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#12-owner-transfer-arrow)"/>
<path class="connector" data-from="target" data-to="source" data-kind="return" data-route="704,568 256,568" d="M 704,568 L 256,568" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#12-owner-transfer-arrow)"/>
<path class="connector" data-from="source" data-to="target" data-kind="call" data-route="256,784 704,784" d="M 256,784 L 704,784" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#12-owner-transfer-arrow)"/>
<path class="connector" data-from="source" data-to="target" data-kind="call" data-route="256,988 704,988" d="M 256,988 L 704,988" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#12-owner-transfer-arrow)"/>
<path class="connector" data-from="target" data-to="source" data-kind="return" data-route="704,1044 256,1044" d="M 704,1044 L 256,1044" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#12-owner-transfer-arrow)"/>
<g class="edge-label"><rect x="412.0" y="354" width="136" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="480" y="368" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">准备 T 的一致检查点</text></g>
<g class="edge-label"><rect x="436.0" y="538" width="88" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="480" y="552" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">检查点已准备</text></g>
<g class="edge-label"><rect x="430.0" y="754" width="100" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="480" y="768" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">发送原激活凭据</text></g>
<g class="edge-label"><rect x="430.0" y="958" width="100" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="480" y="972" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">查询原移交状态</text></g>
<g class="edge-label"><rect x="418.0" y="1014" width="124" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="480" y="1028" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">已激活，返回原世代</text></g>
<g class="node" data-key="source" data-box="136,112,240,80"><rect x="136" y="112" width="240" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="256.0" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">云侧原 Owner</text><text x="256.0" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">T 的旧拥有者世代</text></g>
<g class="node" data-key="target" data-box="584,112,240,80"><rect x="584" y="112" width="240" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="704.0" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">电脑目标 Owner</text><text x="704.0" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">T 的待激活新世代</text></g>
<g class="node" data-key="prepare-source" data-box="96,232,320,104"><rect x="96" y="232" width="320" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="112" y="260" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">停止调度并固定检查点</text><text x="112" y="284" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">T 保持原身份，进入准备</text><text x="112" y="304" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">冻结新调度与执行资格</text></g>
<g class="node" data-key="prepare-target" data-box="544,416,320,112"><rect x="544" y="416" width="320" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="560" y="444" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">目标持久准备</text><text x="560" y="468" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">状态、操作、预算与控制</text><text x="560" y="488" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保存检查点，尚无执行资格</text></g>
<g class="node" data-key="seal" data-box="96,600,320,132"><rect x="96" y="600" width="320" height="132" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="112" y="628" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">原子封存旧世代</text><text x="112" y="652" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">SEALED、唯一目标与新世代</text><text x="112" y="672" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保存绑定检查点的激活 Outbox</text><text x="112" y="692" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">确认提交后，旧世代保持停用</text></g>
<g class="node" data-key="activate" data-box="544,816,320,116"><rect x="544" y="816" width="320" height="116" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="560" y="844" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">核验并持久激活</text><text x="560" y="868" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">匹配检查点、授权与新世代</text><text x="560" y="888" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">确认提交后才可调度</text></g>
<g class="node" data-key="uncertain" data-box="96,832,320,100"><rect x="96" y="832" width="320" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="112" y="860" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">激活回执未收到</text><text x="112" y="884" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">源端仍为 SEALED</text><text x="112" y="904" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">不因超时恢复调度</text></g>
<g class="node" data-key="route" data-box="96,1080,320,112"><rect x="96" y="1080" width="320" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="112" y="1108" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">保存新路由</text><text x="112" y="1132" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">迟到事实转交电脑核对</text><text x="112" y="1152" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">T 及已有操作身份保持不变</text></g><line x1="40" y1="1212" x2="920" y2="1212" stroke="#cbd5e1"/><text x="40" y="1240" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">实线为请求，虚线为回执；图中未画出的激活回执已经丢失，不改变任一端的持久状态。</text>
</svg>
