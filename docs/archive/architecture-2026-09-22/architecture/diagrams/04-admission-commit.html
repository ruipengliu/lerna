<title id="04-admission-commit-title">先提交运行记录，再调度外部工作</title>
<desc id="04-admission-commit-desc">模型在事务外生成完整提案，来源、授权和能力参数等准备检查在事务外完成。RunStore 在单任务事务内核对资格、版本、控制与预算，共同保存任务变化和待处理工作；WorkStore 与它属于同一运行持久化单元。只有提交得到耐久确认，原工作才可调度。提交未知先按原 change_id 核对；明确拒绝按原因处置。执行端随后独立准入、登记并调用工具。</desc>

<p>模型在事务外生成完整提案，来源、授权和能力参数等准备检查在事务外完成。RunStore 在单任务事务内核对资格、版本、控制与预算，共同保存任务变化和待处理工作；WorkStore 与它属于同一运行持久化单元。只有提交得到耐久确认，原工作才可调度。提交未知先按原 change_id 核对；明确拒绝按原因处置。执行端随后独立准入、登记并调用工具。</p><p><a href="../main/02-subsystems/01-runtime-kernel.md">返回任务运行内核</a></p>
