<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="768" viewBox="0 0 1120 768" role="img" aria-labelledby="08-surface-recovery-title 08-surface-recovery-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="08-surface-recovery-title">重连后，分别找回显示和未决操作</title><desc id="08-surface-recovery-desc">重连先重新认证并检查读取和披露权限，取得当前快照和有效等待项，沿原路由核对未决操作，再接续增量并持续核对版本。基版本、游标或状态世代失效以及版本核对发现缺失时重新取快照。</desc>
<defs>
        <marker id="08-surface-recovery-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="08-surface-recovery-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="08-surface-recovery-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="08-surface-recovery-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="768" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">重连后，分别找回显示和未决操作</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">先建立当前读取资格，再恢复显示与原操作，随后接续增量。</text><line x1="40" y1="716" x2="1080" y2="716" stroke="#dae3ed"/><text x="40" y="744" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">流程表示重连的处理顺序；具体业务结果仍由所属模块确认，旧消息不能重开窗口或消费新问题。</text><path d="M560,208 L560,264" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-surface-recovery-arrow)"/><path d="M560,352 L560,412" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-surface-recovery-arrow)"/><path d="M560,500 L560,560" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-surface-recovery-arrow)"/><path d="M360,608 L205.0,608.0 Q196,608 196.0,599.0 L196.0,317.0 Q196,308 205.0,308.0 L360,308" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-surface-recovery-arrow)"/><g data-node="重新认证并核对权限" data-bounds="360,120,400,88"><rect x="360" y="120" width="400" height="88" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="160.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">重新认证并核对权限</text><text x="560.0" y="187.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">端点、用户范围、读取与披露</text></g><g data-node="取得当前快照" data-bounds="360,264,400,88"><rect x="360" y="264" width="400" height="88" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="560.0" y="304.0" font-size="23" fill="#245c9c" text-anchor="middle" font-weight="600">取得当前快照</text><text x="560.0" y="331.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">恢复当前显示与有效等待项</text></g><g data-node="核对本端未决操作" data-bounds="360,412,400,88"><rect x="360" y="412" width="400" height="88" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="452.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">核对本端未决操作</text><text x="560.0" y="479.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">沿原路由查询，未知继续保留</text></g><g data-node="接续增量，持续核对版本" data-bounds="360,560,400,96"><rect x="360" y="560" width="400" height="96" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="604.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">接续增量，持续核对版本</text><text x="560.0" y="631.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">周期核对或可靠版本通告</text></g><text x="40" y="426" font-size="18" fill="#245c9c" text-anchor="start" font-weight="600">重取快照的条件</text><text x="40" y="460" font-size="17" fill="#53667e" text-anchor="start" font-weight="400">基版本不匹配</text><text x="40" y="488" font-size="17" fill="#53667e" text-anchor="start" font-weight="400">游标过期</text><text x="40" y="516" font-size="17" fill="#53667e" text-anchor="start" font-weight="400">状态世代变化</text><text x="40" y="544" font-size="17" fill="#53667e" text-anchor="start" font-weight="400">版本核对发现缺失</text><text x="808" y="288" font-size="20" fill="#245c9c" text-anchor="start" font-weight="600">恢复显示</text><text x="808" y="321" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">本地草稿不覆盖</text><text x="808" y="348" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">正式结果与有效问题</text><text x="808" y="436" font-size="20" fill="#245c9c" text-anchor="start" font-weight="600">恢复原操作</text><text x="808" y="469" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">保留原目标与含义</text><text x="808" y="496" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">不新建一次提交来补救</text><g data-label="true" data-bounds="225.5,269,105,29"><rect x="225.5" y="269" width="105" height="29" rx="3" fill="#fff"/><text x="278" y="290" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">需要重建时</text></g></svg>