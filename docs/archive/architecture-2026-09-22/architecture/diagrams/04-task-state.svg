<?xml version="1.0" encoding="UTF-8"?>
<svg id="04-task-state" viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-task-state-title 04-task-state-desc">
<title id="04-task-state-title">任务主状态与终态依据</title>
<desc id="04-task-state-desc">上方展示 QUEUED、RUNNING、WAITING 的常见推进路径。仅全部可调度工作受阻时进入等待；等待解除后也可以先回到队列。任一非终态均按证据核对终态条件，判定框本身不是任务状态。暂停或取消已受理不表示在途动作已经停止；关键效果未知时继续核对，终态不因重启重新打开。</desc>
<defs><marker id="04-task-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="760" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">任务主状态与终态依据</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">主状态描述任务进展；控制意图、落实进展与等待原因独立记录</text><g class="boundary" data-key="active"><rect x="40" y="112" width="880" height="264" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/><text x="56" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="600" fill="#4f5d75" text-anchor="start">非终态 · 常见推进路径</text></g>
<path class="connector" data-from="queued" data-to="running" data-route="288,224 368,224" d="M 288,224 L 368,224" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="running" data-to="waiting" data-route="592,224 672,224" d="M 592,224 L 672,224" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="waiting" data-to="running" data-route="760,268 760,312 512,312 512,268" d="M 760,268 L 760,304 Q 760,312 752,312 L 520,312 Q 512,312 512,304 L 512,268" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="active" data-to="terminal-check" data-route="480,376 480,420" d="M 480,376 L 480,420" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="terminal-check" data-to="completed" data-route="400,484 400,528 184,528 184,568" d="M 400,484 L 400,520 Q 400,528 392,528 L 192,528 Q 184,528 184,536 L 184,568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="terminal-check" data-to="failed" data-route="480,484 480,568" d="M 480,484 L 480,568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<path class="connector" data-from="terminal-check" data-to="cancelled" data-route="560,484 560,528 776,528 776,568" d="M 560,484 L 560,520 Q 560,528 568,528 L 768,528 Q 776,528 776,536 L 776,568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#04-task-state-arrow)"/>
<g class="edge-label"><rect x="302.0" y="194" width="52" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="328" y="208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">可执行</text></g>
<g class="edge-label"><rect x="606.0" y="194" width="52" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="632" y="208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">全受阻</text></g>
<g class="edge-label"><rect x="600.0" y="282" width="64" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="632" y="296" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">条件满足</text></g>
<g class="edge-label"><rect x="490.0" y="390" width="76" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="528" y="404" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">任一非终态</text></g>
<g class="edge-label"><rect x="256.0" y="498" width="64" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="288" y="512" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">目标满足</text></g>
<g class="edge-label"><rect x="488.0" y="534" width="64" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="520" y="548" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">确认失败</text></g>
<g class="edge-label"><rect x="636.0" y="498" width="64" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="668" y="512" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">取消落实</text></g>
<g class="node" data-key="queued" data-box="64,180,224,88"><rect x="64" y="180" width="224" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="176.0" y="208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">排队</text><text x="176.0" y="232" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">QUEUED</text></g>
<g class="node" data-key="running" data-box="368,180,224,88"><rect x="368" y="180" width="224" height="88" rx="8" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="480.0" y="208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">运行</text><text x="480.0" y="232" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">RUNNING</text></g>
<g class="node" data-key="waiting" data-box="672,180,224,88"><rect x="672" y="180" width="224" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="784.0" y="208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">等待</text><text x="784.0" y="232" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">WAITING</text></g>
<g class="node" data-key="terminal-check" data-box="352,420,256,64"><rect x="352" y="420" width="256" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="480.0" y="448" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">核对终态条件</text><text x="480.0" y="472" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">判断步骤，不增加主状态</text></g>
<g class="node" data-key="completed" data-box="64,568,240,120"><rect x="64" y="568" width="240" height="120" rx="8" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="184.0" y="596" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">COMPLETED</text><text x="184.0" y="620" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">目标及交付条件满足</text><text x="184.0" y="640" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">所辖工作已妥善处置</text></g>
<g class="node" data-key="failed" data-box="360,568,240,120"><rect x="360" y="568" width="240" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="480.0" y="596" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">FAILED</text><text x="480.0" y="620" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">已确认无法完成目标</text><text x="480.0" y="640" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">在途处置和效果核对完成</text></g>
<g class="node" data-key="cancelled" data-box="656,568,240,120"><rect x="656" y="568" width="240" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="776.0" y="596" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">CANCELLED</text><text x="776.0" y="620" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">应停止工作已停止或处置</text><text x="776.0" y="640" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">关键效果已核对</text></g>
<text x="64" y="352" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">等待原因可并存；只有相关条件满足且控制允许，才能恢复推进。</text><line x1="40" y1="708" x2="920" y2="708" stroke="#cbd5e1"/><text x="40" y="736" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">图示保留常见转移；等待解除也可先回队列。终态须有证据，重启不重开任务。</text>
</svg>
