<title id="09-credential-use-title">任务传递引用，执行端使用凭证</title>
<desc id="09-credential-use-desc">任务消息只携带受控凭证引用，受信 Driver 或受控出口向凭证代理申请使用能力，代理按目标服务、账号、用途和 Driver 身份核验后提供，执行端据此调用目标服务；原始秘密不返回模型或普通任务消息。</desc>
