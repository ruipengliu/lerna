<?xml version="1.0" encoding="UTF-8"?>
<svg id="05-memory-invalidation" viewBox="0 0 960 1168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-memory-invalidation-title 05-memory-invalidation-desc">
<title id="05-memory-invalidation-title">来源删除后，旧提案怎样退出</title>
<desc id="05-memory-invalidation-desc">用户在模型生成期间删除本轮使用的一条记忆。记忆权威提交删除修订并登记失效，删除决定的回执与清理进度分别报告。失效通知帮助尽早发现变化；旧提案返回后，内核与组装器仍复核原快照的依赖，发现所用记忆已删除便不接纳旧提案。随后从当前任务事实和仍有效来源重组不含被删记忆的新快照，重新决策、复核后再走准入。发送给外部模型的数据或已发生效果不能靠本地删除撤回。</desc>
<defs><marker id="05-memory-invalidation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="05-memory-invalidation-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
