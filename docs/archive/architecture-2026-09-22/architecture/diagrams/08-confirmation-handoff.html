<title id="08-confirmation-handoff-title">内容确认怎样交到所属任务</title>
<desc id="08-confirmation-handoff-desc">任务保存与待确认内容及适用版本绑定的等待项，再发布交互。Renderer 的呈现回报只说明已应用界面版本。用户正式提交回答后，UI 原子保存固定路由与待转交记录，再以同一回答操作调用 ProvideInput。任务原子检查并消费等待项，保存输入和后续工作；UI 取得结果后提交显示状态。确认已处理不代表后续动作完成，动作仍须按当前条件准入并执行。UIStateManager 与 SurfaceStore 合并为一列，每个记录框表示该模块自己的本地提交。</desc>

<p>任务保存与待确认内容及适用版本绑定的等待项，再发布交互。Renderer 的呈现回报只说明已应用界面版本。用户正式提交回答后，UI 原子保存固定路由与待转交记录，再以同一回答操作调用 ProvideInput。任务原子检查并消费等待项，保存输入和后续工作；UI 取得结果后提交显示状态。确认已处理不代表后续动作完成，动作仍须按当前条件准入并执行。UIStateManager 与 SurfaceStore 合并为一列，每个记录框表示该模块自己的本地提交。</p><p><a href="../main/02-subsystems/05-interaction.md">返回应用与交互</a></p>
