<title id="04-reliable-handoff-title">操作的可靠交接</title>
<desc id="04-reliable-handoff-desc">图示沿同一操作区分消息持久接收、业务接纳、外部效果与内核原子消费；每次提交只覆盖本模块记录，外部执行与异步查询合并展示，效果报告经持久交接后才推进后续工作。</desc>
