<title id="02-system-overview-title">内核协调任务，三系统提供能力</title>
<desc id="02-system-overview-desc">内核组织上下文、调用大脑并调度执行；大脑调用模型，执行系统访问两端工具，长期记忆按需参与。连线表达请求与反馈，不限定部署位置。</desc>
