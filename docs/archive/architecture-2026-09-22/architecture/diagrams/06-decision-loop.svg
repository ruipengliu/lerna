<svg id="06-decision-loop" viewBox="0 0 960 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-decision-loop-title 06-decision-loop-desc">
<title id="06-decision-loop-title">何时重新决策，何时继续原工作</title>
<desc id="06-decision-loop-desc">内核领取决策工作、预留预算并准备当前有效输入，大脑返回完整有限行动提案。内核复核并确认准入提交后，执行系统推进已准入操作，实际反馈再进入任务事实。需要综合结果、调整计划或处理变化时重新准备决策；无需新判断且仍有已准入工作可推进时，检查控制、权限、依赖和预算后继续原工作。条件不足则持久等待，不空转。图中省略结果、等待、拒绝和未知提交的处理分支，它们仍遵循正文及任务运行内核的规则。</desc>
<defs><marker id="06-decision-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="06-decision-loop-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="840" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">何时重新决策，何时继续原工作</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">只展开行动路径：已知工作按依赖推进，需要新判断时才重新决策</text><path class="connector" data-from="prepare" data-to="brain" data-kind="call" data-route="280,196 360,196" d="M 280,196 L 360,196" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#06-decision-loop-arrow)"/>
