<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="08-interaction-components-title 08-interaction-components-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="08-interaction-components-title">一次输入由谁处理，事实由谁保存</title><desc id="08-interaction-components-desc">呈现器提交正式动作与呈现回报，界面状态管理器保存转交责任并依据业务结果更新显示；SurfaceStore 和各业务模块存储分别持久保存各自事实。</desc>
<defs>
        <marker id="08-interaction-components-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="08-interaction-components-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="08-interaction-components-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="08-interaction-components-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="680" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">一次输入由谁处理，事实由谁保存</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">组件关系图：界面负责呈现与交接，目标业务模块决定动作是否生效。</text><line x1="40" y1="628" x2="1080" y2="628" stroke="#dae3ed"/><text x="40" y="656" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">实线为动作、回报或存储访问，虚线为结果或显示更新；逻辑分组不要求独立部署或共用事务。</text><path d="M320,216 L432,216" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-interaction-components-arrow)"/><path d="M432,272 L320,272" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#08-interaction-components-arrow)"/><path d="M732,216 L824,216" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-interaction-components-arrow)"/><path d="M824,272 L732,272" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#08-interaction-components-arrow)"/><path d="M582,312 L582,472" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-interaction-components-arrow)"/><path d="M952,312 L952,472" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#08-interaction-components-arrow)"/><g data-node="端侧呈现器" data-bounds="40,156,280,156"><rect x="40" y="156" width="280" height="156" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="180.0" y="203.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">端侧呈现器</text><text x="180.0" y="230.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">Renderer</text><text x="180.0" y="257.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">显示内容与采集输入</text><text x="180.0" y="284.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">草稿、导航与可访问性</text></g><g data-node="界面状态管理器" data-bounds="432,156,300,156"><rect x="432" y="156" width="300" height="156" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="582.0" y="203.0" font-size="23" fill="#245c9c" text-anchor="middle" font-weight="600">界面状态管理器</text><text x="582.0" y="230.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">UIStateManager</text><text x="582.0" y="257.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">校验登记事件，可靠转交</text><text x="582.0" y="284.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">依据业务结果更新显示</text></g><g data-node="业务处理模块" data-bounds="824,156,256,156"><rect x="824" y="156" width="256" height="156" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="952.0" y="203.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">业务处理模块</text><text x="952.0" y="230.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">任务／授权／应用</text><text x="952.0" y="257.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">核对权限与当前状态</text><text x="952.0" y="284.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">决定输入是否生效</text></g><g data-node="界面存储" data-bounds="432,472,300,116"><path d="M432,485 Q432,472 582.0,472 Q732,472 732,485 V575 Q732,588 582.0,588 Q432,588 432,575 Z" fill="#f5f8fb" stroke="#b8c8da" stroke-width="1.5"/><path d="M432,485 Q582.0,506 732,485" fill="none" stroke="#b8c8da" stroke-width="1.2"/><text x="582.0" y="518.5" font-size="23" fill="#233247" text-anchor="middle" font-weight="600">界面存储</text><text x="582.0" y="545.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">SurfaceStore</text><text x="582.0" y="572.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">路由、待办与显示副本</text></g><g data-node="各业务模块的存储" data-bounds="824,472,256,116"><path d="M824,485 Q824,472 952.0,472 Q1080,472 1080,485 V575 Q1080,588 952.0,588 Q824,588 824,575 Z" fill="#f5f8fb" stroke="#b8c8da" stroke-width="1.5"/><path d="M824,485 Q952.0,506 1080,485" fill="none" stroke="#b8c8da" stroke-width="1.2"/><text x="952.0" y="531.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">各业务模块的存储</text><text x="952.0" y="558.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">各自的业务事实与回执</text></g><text x="40" y="490" font-size="21" fill="#53667e" text-anchor="start" font-weight="400">显示可以暂时落后；</text><text x="40" y="524" font-size="21" fill="#53667e" text-anchor="start" font-weight="400">业务结果是更新依据。</text><g data-label="true" data-bounds="330.0,154,92,54"><rect x="330.0" y="154" width="92" height="54" rx="3" fill="#fff"/><text x="376" y="176" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">正式动作</text><text x="376" y="201" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">呈现回报</text></g><g data-label="true" data-bounds="330.0,232,92,29"><rect x="330.0" y="232" width="92" height="29" rx="3" fill="#fff"/><text x="376" y="254" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">显示更新</text></g><g data-label="true" data-bounds="750.0,176,56,29"><rect x="750.0" y="176" width="56" height="29" rx="3" fill="#fff"/><text x="778" y="198" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">转交</text></g><g data-label="true" data-bounds="750.0,232,56,29"><rect x="750.0" y="232" width="56" height="29" rx="3" fill="#fff"/><text x="778" y="254" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">结果</text></g><g data-label="true" data-bounds="602.0,368,92,29"><rect x="602.0" y="368" width="92" height="29" rx="3" fill="#fff"/><text x="648" y="390" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">持久保存</text></g><g data-label="true" data-bounds="972.0,368,92,29"><rect x="972.0" y="368" width="92" height="29" rx="3" fill="#fff"/><text x="1018" y="390" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">持久保存</text></g></svg>