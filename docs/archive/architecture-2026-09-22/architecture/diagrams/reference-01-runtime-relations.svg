<title id="reference-01-runtime-relations-title">任务、操作与核对记录</title>
<desc id="reference-01-runtime-relations-desc">任务可关联多个操作，独立操作可以没有任务；这里仅计主任务归属，父子与目标引用另计。执行类操作使用同一身份保存执行记录；每条消息最多携带一个主要变更身份，一个操作可关联多条消息。一次提交可涉及多个操作，一个操作也可经历多次提交。这里的关系不代表共同事务或执行先后。</desc>
