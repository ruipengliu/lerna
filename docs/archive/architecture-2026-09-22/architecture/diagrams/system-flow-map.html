="1.7" /><text x="1283.33" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Submit／更新／回应</text><rect x="1466.67" y="342" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">去重与版本检查</text><path d="M 1441.67,361 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="342" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">保存输入与工作</text><path d="M 1778.33,361 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="412" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">新建返回 task_ref；后续输入绑定原任务。当前访问校验后先查原操作，新更新才查版本。</text><rect x="1130" y="425" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="449" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX T：输入／等待项消费 + state_version + 工作 + 回执</text></g><path d="M 1130,467 H 2110" stroke="#cbd5e1"/><g id="B2" class="detail" data-box="1122,471,996,200"><text x="1130" y="500" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">B2</text><text x="1176" y="500" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">需要新判断，才进入一轮生成</text><rect x="1130" y="515" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="541" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">扫描候选工作</text><rect x="1466.67" y="515" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="541" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">复核并领取</text><path d="M 1441.67,534 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="515" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="541" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">预留生成预算</text><path d="M 1778.33,534 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="585" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Owner、领取代次、控制、依赖与预算当前有效，才取得本轮推进资格。</text><text x="1130" y="612" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">把此次提交后的版本交给 C；模型调用在事务外，未知消耗保留预留。</text><rect x="1130" y="625" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="649" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX T：领取 + 预算预留 + 新的任务版本基线</text></g><path d="M 1130,667 H 2110" stroke="#cbd5e1"/><g id="B3" class="detail" data-box="1122,671,996,227"><text x="1130" y="700" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">B3</text><text x="1176" y="700" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">提案准入与派发</text><rect x="1130" y="715" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="741" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">复核提案／来源</text><rect x="1466.67" y="715" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="741" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">原子准入</text><path d="M 1441.67,734 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="715" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="741" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">提交／耐久确认后派发</text><path d="M 1778.33,734 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="785" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">事务内再去重；校验版本、Owner／Worker 资格、控制、依赖与预算。</text><text x="1130" y="812" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">版本冲突／来源失效 → 回 B2；提交未知 → LookupCommit 原 change_id。</text><text x="1130" y="839" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">派发须满足存储声明的耐久条件；原回执存在不自动证明该条件已满足。</text><rect x="1130" y="852" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="876" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX T：状态 + 操作映射 + 工作 + 预算 + 回执／Outbox</text></g><path d="M 1130,894 H 2110" stroke="#cbd5e1"/><g id="B4" class="detail" data-box="1122,898,996,200"><text x="1130" y="927" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">B4</text><text x="1176" y="927" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">新事实推进原任务</text><rect x="1130" y="942" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="968" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">去重消费报告</text><rect x="1466.67" y="942" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="968" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">核验证据／结算</text><path d="M 1441.67,961 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="942" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="968" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">登记下一步工作</text><path d="M 1778.33,961 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="1012" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">资料齐备或计划变化 → B2；S 成功且效果确认、当前条件允许 → 原 R。</text><text x="1130" y="1039" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">R 读回内容与目标核验 → B2 综合结果；结果提案经 B3 才正式发布。</text><rect x="1130" y="1052" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="1076" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX T：事实 + 消费标记 + state_version + 依赖／后续责任</text></g><path d="M 1130,1094 H 2110" stroke="#cbd5e1"/><g id="B5" class="detail" data-box="1122,1098,996,200"><text x="1130" y="1127" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">B5</text><text x="1176" y="1127" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">等待、控制与收尾都有持久责任</text><rect x="1130" y="1142" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="1168" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">登记条件／问题 I</text><rect x="1466.67" y="1142" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="1168" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">条件满足再领取</text><path d="M 1441.67,1161 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="1142" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="1168" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">核对对应终态证据</text><path d="M 1778.33,1161 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="1212" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">暂停／取消先阻挡新工作；恢复只解除指定来源，仍须满足其他条件。</text><text x="1130" y="1239" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">在途处置交给 D；未知效果与占用有据处置，才按成功／失败／取消收尾。</text><rect x="1130" y="1252" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="1276" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX T：等待／控制／终态 + 对应传播或后续责任</text></g><text x="1130" y="1327" font-size="20" font-weight="500" fill="#2e5aa8" text-anchor="start">T = RunStore + WorkStore · 唯一任务状态权威；每次 TX 独立。</text></g></a><a href="system-flow-map.html#decision-system" data-node="decision-system" aria-label="定位 C · 上下文与决策"><g id="decision-system" class="node" data-number="C" data-box="1100,1650,1040,650"><title>C · 上下文与决策</title><rect x="1100" y="1650" width="1040" height="650" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.7" /><rect x="1100" y="1650" width="8" height="650" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1.7" /><text x="1130" y="1705" font-size="38" font-weight="700" fill="#2e5aa8" text-anchor="start">C</text><text x="1187" y="1705" font-size="38" font-weight="650" fill="#2d3142" text-anchor="start">上下文与决策</text><text x="1130" y="1743" font-size="22" font-weight="400" fill="#4f5d75" text-anchor="start">Core 协调 ContextAssembler → Brain</text><g id="C1" class="detail" data-box="1122,1758,996,156"><text x="1130" y="1787" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">C1</text><text x="1176" y="1787" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">ContextAssembler：本轮依据</text><rect x="1130" y="1802" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="1828" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">读取已提交事实</text><rect x="1466.67" y="1802" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1620" y="1828" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">检索获准内容／声明</text><path d="M 1441.67,1821 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="1802" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="1828" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">固定上下文 C</text><path d="M 1778.33,1821 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="1872" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">使用 E1／E2、获准 P@1、来源 revision 与覆盖缺口；未取得资料先提读取行动。</text><text x="1130" y="1899" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">复核用途、处理位置与容量；为输出、协议留空间，来源变化使依赖失效。</text></g><path d="M 1130,1910 H 2110" stroke="#cbd5e1"/><g id="C2" class="detail" data-box="1122,1914,996,200"><text x="1130" y="1943" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">C2</text><text x="1176" y="1943" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">Brain：只返回有限提案</text><rect x="1130" y="1958" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1283.33" y="1984" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Brain.Decide</text><rect x="1466.67" y="1958" width="306.667" height="38" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.7" stroke-dasharray="6,4"/><text x="1620" y="1984" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Model Adapter 调用</text><path d="M 1441.67,1977 H 1459.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="1803.33" y="1958" width="306.667" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="1956.67" y="1984" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">完整输出校验</text><path d="M 1778.33,1977 H 1796.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="1130" y="2028" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Generate 在事务外；发送前复核权限与位置，结构修复和补查均有次数／预算上限。</text><text x="1130" y="2055" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">行动／委派／等待／结果明确分型；流式片段不能直接执行，未知用量保留占用。</text><rect x="1130" y="2068" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="2092" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">边界：Model Adapter 是调用接口；Brain 不取得状态或执行权威</text></g><text x="1130" y="2143" font-size="20" font-weight="500" fill="#2e5aa8" text-anchor="start">检查点：来源修订／数据用途／模型位置；提案回 B 后仍须准入</text></g></a><a href="system-flow-map.html#execution-system" data-node="execution-system" aria-label="定位 D · 执行与效果核对"><g id="execution-system" class="node" data-number="D" data-box="2450,190,880,1330"><title>D · 执行与效果核对</title><rect x="2450" y="190" width="880" height="1330" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.7" /><rect x="2450" y="190" width="8" height="1330" rx="0" fill="#2e5aa8" stroke="none" stroke-width="1.7" /><text x="2480" y="245" font-size="38" font-weight="700" fill="#2e5aa8" text-anchor="start">D</text><text x="2537" y="245" font-size="38" font-weight="650" fill="#2d3142" text-anchor="start">执行与效果核对</text><text x="2480" y="283" font-size="22" font-weight="400" fill="#4f5d75" text-anchor="start">ExecutionCoordinator · Scheduler / Worker</text><g id="D1" class="detail" data-box="2472,298,836,200"><text x="2480" y="327" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">D1</text><text x="2526" y="327" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">可靠接收与业务接纳</text><rect x="2480" y="342" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2606.67" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Inbox 持久接收</text><rect x="2763.33" y="342" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2890" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">原操作去重</text><path d="M 2738.33,361 H 2756.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3046.67" y="342" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="3173.33" y="368" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">固定输入与实现</text><path d="M 3021.67,361 H 3039.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="2480" y="412" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">PERSISTED 表示可恢复处理；ACCEPTED 才表示业务已接纳。</text><text x="2480" y="439" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">旧请求返回原回执；新请求检查窗口／前提，两者均不证明效果。</text><rect x="2480" y="452" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="476" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX E：Inbox／处理责任；另次接纳提交输入 + 实现 + 工作</text></g><path d="M 2480,494 H 3300" stroke="#cbd5e1"/><g id="D2" class="detail" data-box="2472,498,836,200"><text x="2480" y="527" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">D2</text><text x="2526" y="527" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">准备确认后，才调用外部动作</text><rect x="2480" y="542" width="182.5" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2571.25" y="568" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">准备／消费许可</text><rect x="2692.5" y="542" width="182.5" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2783.75" y="568" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">确认提交</text><path d="M 2667.5,561 H 2685.5" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="2905" y="542" width="182.5" height="38" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.7" stroke-dasharray="6,4"/><text x="2996.25" y="568" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Driver.Start</text><path d="M 2880,561 H 2898" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3117.5" y="542" width="182.5" height="38" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.7" stroke-dasharray="6,4"/><text x="3208.75" y="568" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">API／GUI 目标</text><path d="M 3092.5,561 H 3110.5" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="2480" y="612" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">启动前保存“已准备、可能发出”；已有准备记录先恢复。</text><text x="2480" y="639" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Start 在事务外；手机 E1／电脑 E2、保存 S／J、读回 R 使用同一契约。</text><rect x="2480" y="652" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="676" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX E：许可与原操作绑定 + 启动登记 + 恢复工作</text></g><path d="M 2480,694 H 3300" stroke="#cbd5e1"/><g id="D3" class="detail" data-box="2472,698,836,267"><text x="2480" y="727" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">D3</text><text x="2526" y="727" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">一次等待，由多轮短工作推进</text><rect x="2480" y="742" width="182.5" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2571.25" y="768" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">登记下次核对</text><rect x="2692.5" y="742" width="182.5" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2783.75" y="768" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">扫描／领取</text><path d="M 2667.5,761 H 2685.5" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="2905" y="742" width="182.5" height="38" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.7" stroke-dasharray="6,4"/><text x="2996.25" y="768" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Inspect 原 S/J</text><path d="M 2880,761 H 2898" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3117.5" y="742" width="182.5" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="3208.75" y="768" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">保存本轮观察</text><path d="M 3092.5,761 H 3110.5" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><path d="M 3208.75,780 L 3208.75,833 Q 3208.75,841 3200.75,841 L 2579.25,841 Q 2571.25,841 2571.25,833 L 2571.25,780" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="2890" y="822" font-size="19" font-weight="500" fill="#4f5d75" text-anchor="middle">仍未决：保存下一次核对责任</text><text x="2480" y="879" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">扫描只找候选；当前条件与新领取代次有效才查询，租约过期不代表作业停止。</text><text x="2480" y="906" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">提交后结束本轮、释放 Worker；新事实连同报告责任可靠保存。</text><rect x="2480" y="919" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="943" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX E：S ↔ J／事实 + 下一轮工作／报告 Outbox</text></g><path d="M 2480,961 H 3300" stroke="#cbd5e1"/><g id="D4" class="detail" data-box="2472,965,836,227"><text x="2480" y="994" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">D4</text><text x="2526" y="994" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">两个未知，沿不同身份核对</text><rect x="2480" y="1009" width="395" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2677.5" y="1035" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">提交未知：原 change_id</text><rect x="2905" y="1009" width="395" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="3102.5" y="1035" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">效果未知：原 S／J</text><text x="2890" y="1035" font-size="17" font-weight="500" fill="#4f5d75" text-anchor="middle">或</text><text x="2480" y="1079" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">提交未知查自己的 ExecutionStore；可能发出先核对原操作，不盲目重发。</text><text x="2480" y="1106" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">仅确认未发送或幂等保证仍有效等条件满足，才按原操作安排重送。</text><text x="2480" y="1133" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">关联不足则等待证据／获准人工处置；超时或文件存在均不足以重做。</text><rect x="2480" y="1146" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="1170" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">阶段／结果／效果分别保存；已同步取得结果可直接报告</text></g><path d="M 2480,1188 H 3300" stroke="#cbd5e1"/><g id="D5" class="detail" data-box="2472,1192,836,200"><text x="2480" y="1221" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">D5</text><text x="2526" y="1221" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">控制受理后，继续处置在途工作</text><rect x="2480" y="1236" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2606.67" y="1262" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">阻挡新动作</text><rect x="2763.33" y="1236" width="253.333" height="38" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.7" stroke-dasharray="6,4"/><text x="2890" y="1262" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">Cancel／Inspect</text><path d="M 2738.33,1255 H 2756.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3046.67" y="1236" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="3173.33" y="1262" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">确认后结算与报告</text><path d="M 3021.67,1255 H 3039.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="2480" y="1306" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">资源控制由执行端保存；不可取消或效果未知时仍保留核对责任。</text><text x="2480" y="1333" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Driver 只报告事实；API／GUI 或第三方目标的幂等、查询、停止能力有界。</text><rect x="2480" y="1346" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="1370" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">边界：Driver 调用及外部目标均在 TX E 之外</text></g><text x="2480" y="1421" font-size="20" font-weight="500" fill="#2e5aa8" text-anchor="start">检查点：当前授权／资格／资源控制／预算；E = ExecutionStore</text></g></a><a href="system-flow-map.html#knowledge-services" data-node="knowledge-services" aria-label="定位 E · 记忆与能力目录"><g id="knowledge-services" class="node" data-number="E" data-box="2450,1790,880,510"><title>E · 记忆与能力目录</title><rect x="2450" y="1790" width="880" height="510" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.7" /><rect x="2450" y="1790" width="8" height="510" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1.7" /><text x="2480" y="1845" font-size="38" font-weight="700" fill="#2e5aa8" text-anchor="start">E</text><text x="2537" y="1845" font-size="38" font-weight="650" fill="#2d3142" text-anchor="start">记忆与能力目录</text><text x="2480" y="1883" font-size="22" font-weight="400" fill="#4f5d75" text-anchor="start">两个独立提供方，各自保留权威</text><g id="E1" class="detail" data-box="2472,1898,836,200"><text x="2480" y="1927" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">E1</text><text x="2526" y="1927" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">MemoryService：集合单一修改权威</text><rect x="2480" y="1942" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2606.67" y="1968" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">变更获准并接纳</text><rect x="2763.33" y="1942" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2890" y="1968" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">提交修订／墓碑</text><path d="M 2738.33,1961 H 2756.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3046.67" y="1942" width="253.333" height="38" rx th="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="2890" y="2748" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">准备健康实例</text><path d="M 2738.33,2741 H 2756.33" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><rect x="3046.67" y="2722" width="253.333" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7" /><text x="3173.33" y="2748" font-size="20" font-weight="600" fill="#2d3142" text-anchor="middle">逐节点提交激活</text><path d="M 3021.67,2741 H 3039.67" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#local-arrow)"/><text x="2480" y="2792" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Memory／Brain／Driver／UI 实现在激活事务外准备；原生／MCP 按真实能力适配</text><text x="2480" y="2819" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">。</text><text x="2480" y="2846" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">目录与运行路由应用激活修订；新工作可选择，已绑定 S／R 保持旧版。</text><rect x="2480" y="2859" width="820" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="2492" y="2883" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">TX X：ExtensionStore · 本地绑定 + 回执 + 应用责任</text></g></g></a><a href="system-flow-map.html#runtime-operations" data-node="runtime-operations" aria-label="定位 I · 组装、部署与恢复"><g id="runtime-operations" class="node" data-number="I" data-box="1100,2570,1040,350"><title>I · 组装、部署与恢复</title><rect x="1100" y="2570" width="1040" height="350" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.7" /><rect x="1100" y="2570" width="8" height="350" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1.7" /><text x="1130" y="2625" font-size="38" font-weight="700" fill="#2e5aa8" text-anchor="start">I</text><text x="1187" y="2625" font-size="38" font-weight="650" fill="#2d3142" text-anchor="start">组装、部署与恢复</text><text x="1130" y="2663" font-size="22" font-weight="400" fill="#4f5d75" text-anchor="start">Bootstrap · 路由／HA／RecoveryController</text><g id="I1" class="detail" data-box="1122,2678,996,204"><text x="1130" y="2707" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">I1</text><text x="1176" y="2707" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">为同一运行契约提供配置和保障</text><text x="1130" y="2742" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">Bootstrap 注入实现与 Store；恢复责任就绪后开放入口。用户 Cell、连接、Owner 分开。</text><text x="1130" y="2769" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">原子组不拆事务分区；公平调度、资源隔离与恢复限流按配置落实。</text><text x="1130" y="2796" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">恢复先隔离旧资格、确认耐久性；所属 Store 查原提交，可能发出则回 D4。</text><text x="1130" y="2823" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">迁移先全范围停写、复制核验，再切换唯一写入；目标有新写入后回切须重新迁移。</text><rect x="1130" y="2836" width="980" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="1142" y="2860" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">迁移保留操作窗口、控制、预算和全部未决责任</text></g></g></a><a href="system-flow-map.html#improvement-loop" data-node="improvement-loop" aria-label="定位 J · 观测、评测与持续改进"><g id="improvement-loop" class="node" data-number="J" data-box="80,3180,3250,450"><title>J · 观测、评测与持续改进</title><rect x="80" y="3180" width="3250" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.7" /><rect x="80" y="3180" width="8" height="450" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1.7" /><text x="110" y="3235" font-size="38" font-weight="700" fill="#2e5aa8" text-anchor="start">J</text><text x="167" y="3235" font-size="38" font-weight="650" fill="#2d3142" text-anchor="start">观测、评测与持续改进</text><text x="110" y="3273" font-size="22" font-weight="400" fill="#4f5d75" text-anchor="start">运行事实、评测结论、发布批准、节点生效分别记录</text><g id="J1" class="detail" data-box="102.0,3288,781.5,133"><text x="110" y="3317" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">J1</text><text x="156" y="3317" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">Observation：受控信号</text><text x="110" y="3352" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">关联 Task／执行／交互的已提交事实。</text><text x="110" y="3379" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">按原身份去重，报告覆盖缺口。</text><text x="110" y="3406" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">诊断不回写业务成功。</text></g><g id="J2" class="detail" data-box="902.5,3288,781.5,204"><text x="910.5" y="3317" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">J2</text><text x="956.5" y="3317" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">Evaluation → Evaluator</text><text x="910.5" y="3352" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">固定计划、样本、预算与判定规则。</text><text x="910.5" y="3379" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">隔离评测经正式任务入口运行。</text><text x="910.5" y="3406" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">运行记录 + 独立效果证据／真值。</text><text x="910.5" y="3433" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">报告通过／失败／不完整。</text><rect x="910.5" y="3446" width="765.5" height="36" rx="4" fill="#f8fafc" stroke="none" stroke-width="1.7" /><text x="922.5" y="3470" font-size="19" font-weight="500" fill="#2d3142" text-anchor="start">EvaluationStore 保存计划与证据</text></g><path d="M 900.5,3304 V 3530" stroke="#cbd5e1"/><g id="J3" class="detail" data-box="1703.0,3288,781.5,204"><text x="1711" y="3317" font-size="19" font-weight="700" fill="#2e5aa8" text-anchor="start">J3</text><text x="1757" y="3317" font-size="24" font-weight="600" fill="#2d3142" text-anchor="start">Evolution：精确候选发布</text><text x="1711" y="3352" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">精确候选 → 比较／独立保留确认。</text><text x="1711" y="3379" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">获准后分阶段启用，监测违规与退化。</text>< one" stroke="#4f5d75" stroke-width="1.7" marker-end="url(#local-arrow)"/><text x="1750" y="3604" font-size="18" font-weight="500" fill="#4f5d75" text-anchor="middle">精确候选 → 评测／保留确认</text></g></a><path d="M 80,3680 H 3460" stroke="#cbd5e1"/><path d="M 80,3720 h 65" stroke="#2e5aa8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow-flow)"/><text x="166" y="3727" font-size="23" font-weight="400" fill="#4f5d75" text-anchor="start">实线：主要请求／正式发布</text><path d="M 1200,3720 h 65" stroke="#4f5d75" stroke-width="2.2" stroke-dasharray="9,5" marker-end="url(#arrow-return)"/><text x="1286" y="3727" font-size="23" font-weight="400" fill="#4f5d75" text-anchor="start">虚线：反馈／控制／按需请求</text><path d="M 2320,3720 h 65" stroke="#788596" stroke-width="2" stroke-dasharray="10,4,2,4" marker-end="url(#arrow-supply)"/><text x="2406" y="3727" font-size="23" font-weight="400" fill="#4f5d75" text-anchor="start">点划线：配置／证据供给</text><text x="80" y="3770" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">外框表示职责分组，不定义部署层或共同事务；框内虚边框为事务外调用或外部目标。跨线弧表示交叉，不是汇合。</text><text x="80" y="3799" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">TX T／E／U／M／A／X 分别属于运行、执行、界面、记忆、授权和扩展 Store；相同标记的多次提交仍各自独立。</text><text x="80" y="3828" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">task_ref 定任务；state_version 定事实基线；owner_epoch 与领取代次定资格；来源 revision、显示 revision 分别管理。</text><text x="80" y="3857" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">operation_id（S／R）定业务语义；change_id 定内部提交；message_id 定交接消息；J 是外部作业。交接保留 Inbox／Outbox 和后续责任。</text><text x="80" y="3886" font-size="21" font-weight="400" fill="#4f5d75" text-anchor="start">正文 01–17 与能力基线均有覆盖入口；完整字段和故障矩阵见正文及规划附录。成文与图示检查不等于运行验收通过。</text></svg></div><p class="hint">A → B → D：输入、任务推进与执行 · B ↔ C：决策往返 · 框内 TX：各次本地提交 · 外框不表示共同事务。<span id="selection-status" aria-live="polite"></span></p><noscript><p>脚本未启用；完整图仍可滚动阅读，也可打开 SVG 使用浏览器缩放。</p></noscript><span id="request" class="alias" aria-hidden="tr oute": "A1", "task-admit": "B1", "decision-claim": "B2", "read-context": "C1", "catalog-search": "E2", "catalog-describe": "E2", "assemble": "C1", "brain": "C2", "model": "C2", "proposal": "C2", "precheck": "B3", "commit-receipt": "B3", "admit": "B3", "dispatch": "B3", "execution-inbox": "D1", "execution-admit": "D1", "prepare-start": "D2", "driver-start": "D2", "target": "D2", "job-association": "D3", "scan-work": "D3", "query-claim": "D3", "inspect": "D3", "persist-observation": "D3", "report-handoff": "D1", "consume-facts": "B4", "next-work": "B4", "verify-readback": "B4", "publish": "A2", "render": "A2", "finish": "B5", "memory": "E1", "memory-sync": "E1", "invalidate": "E1", "authorize": "F1", "grant": "F1", "interaction": "B5", "control": "B5", "cancel-inflight": "D5", "delegate": "G1", "child": "G1", "join": "B4", "seal-owner": "G2", "activate-owner": "G2", "reconnect": "G3", "recover": "I1", "unknown-effect": "D4", "extension-lock": "H1", "extension-ready": "H1", "extension-activate": "H1", "observe": "J1", "evaluation": "J2", "score": "J2", "release": "J3", "bootstrap": "I1", "migration": "I1", "validation": "J4", "production": "I1", "blocked": "B5", "input": "A1", "context": "C1", "decision": "C2", "admission": "B3", "execution": "D1", "facts": "B4", "waiting": "D3", "delivery": "A2", "version": "E1", "authorization": "F1", "collaboration": "G1", "edge": "G2", "recovery": "I1", "extensions": "H1", "deployment": "I1", "evolution": "J1", "assembly": "I1", "A1": "A1", "A2": "A2", "B1": "B1", "B2": "B2", "B3": "B3", "B4": "B4", "B5": "B5", "C1": "C1", "C2": "C2", "D1": "D1", "D2": "D2", "D3": "D3", "D4": "D4", "D5": "D5", "E1": "E1", "E2": "E2", "F1": "F1", "G1": "G1", "G2": "G2", "G3": "G3", "H1": "H1", "I1": "I1", "J1": "J1", "J2": "J2", "J3": "J3", "J4": "J4"}, "sources": {"interaction-system": "../main/02-subsystems/05-interaction.md", "task-core": "../main/02-subsystems/01-runtime-kernel.md", "decision-system": "../main/02-subsystems/02-context-and-memory.md", "execution-system": "../main/02-subsystems/04-tools-and-devices.md", "knowledge-services": "../main/02-subsystems/02-context-and-memory.md", "authorization-system": "../main/02-subsystems/06-identity-and-authorization.md", "coordination": "../main/03-coordination/03-agent-collaboration.md", "extensions-system": "../main/02-subsystems/08-extensions-and-runtime.md", "runtime-operations": "../main/04-engineering/02-deployment-and-storage.md", "improvement-loop": "../main/04-engineering/04-evaluation-and-release.md"}}</script><script>/* One persistent SVG: navigation changes position and size, never visibility. */
(() => {
  'use strict';
  const canvas = document.querySelector('.canvas');
  const svg = canvas.querySelector('svg');
  const {width, height} = svg.viewBox.baseVal;
  const config = JSON.parse(document.querySelector('#map-data').textContent);
  const nodes = new Map([...svg.querySelectorAll('.node')].map(node => [node.id, node]));
  const picker = document.querySelector('#node-select');
  const output = document.querySelector('#zoom-value');
  const status = document.querySelector('#selection-status');
  const source = document.querySelector('#node-source');
  let scale = 1;
  let selected = '';
  let selectedDetail = '';
  let automatic = true;
  document.documentElement.classList.add('js');

  function applyScale(value, keepCenter = true) {
    const centerX = (canvas.scrollLeft + canvas.clientWidth / 2) / scale;
    const centerY = (canvas.scrollTop + canvas.clientHeight / 2) / scale;
    scale = Math.min(2, Math.max(.02, value));
    svg.style.width = `${width * scale}px`;
    svg.style.height = `${height * scale}px`;
    output.value = `${Math.round(scale * 100)}%`;
    document.querySelector('#zoom-out').disabled = scale <= .02;
    document.querySelector('#zoom-in').disabled = scale >= 2;
    if (keepCenter) {
      canvas.scrollLeft = centerX * scale - canvas.clientWidth / 2;
      canvas.scrollTop = centerY * scale - canvas.clientHeight / 2;
    }
  }
  function fit(all = false) {
    applyScale(Math.min(1, (canvas.clientWidth - 2) / width,
      all ? (canvas.clientHeight - 2) / height : 1), false);
    canvas.scrollLeft = 0;
    canvas.scrollTop = 0;
  }
  function centerNode(id, detail = '') {
    const target = detail ? document.getElementById(detail) : nodes.get(id);
    const [x, y, w, h] = target.dataset.box.split(',').map(Number);
    // Large groups open at their heading; smaller groups can be centered whole.
    canvas.scrollLeft = w * scale > canvas.clientWidth - 40
      ? x * scale - 20 : (x + w / 2) * scale - canvas.clientWidth / 2;
    canvas.scrollTop = h * scale > canvas.clientHeight - 40
      ? y * scale - 20 : (y + h / 2) * scale - canvas.clientHeight / 2;
  }
  function choose(raw, {push = false, zoom = true} = {}) {
    const id = nodes.has(raw) ? raw : config.aliases[raw];
    if (!nodes.has(id)) return;
    selected = id;
    selectedDetail = config.focuses[raw] || '';
    automatic = false;
    for (const [key, node] of nodes) {
      node.parentElement.classList.toggle('selected', key === id);
      if (key === id) node.parentElement.setAttribute('aria-current', 'true');
      else node.parentElement.removeAttribute('aria-current');
    }
    picker.value = id;
    source.href = config.sources[id];
    source.textContent = `查看 ${nodes.get(id).dataset.number} 的正文依据`;
    status.textContent = ` 当前定位：${picker.selectedOptions[0].textContent}${selectedDetail ? ` · ${selectedDetail}` : ''}。`;
    if (zoom) applyScale(Math.max(scale, .9), false);
    centerNode(id, selectedDetail);
    const anchor = selectedDetail || id;
    if (push && location.hash !== `#${anchor}`) history.pushState(null, '', `#${anchor}`);
  }
  function restoreHash() {
    let hash = '';
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch { /* Invalid fragments leave the full diagram visible. */ }
    if (nodes.has(hash) || config.aliases[hash]) choose(hash);
    else if (!hash || hash === 'panorama') fit();
    requestAnimationFrame(() => window.scrollTo(0, 0));
  }
  svg.addEventListener('click', event => {
    const link = event.target.closest('[data-node]');
    if (!link || event.button || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    choose(event.target.closest('.detail')?.id || link.dataset.node, {push:true});
  });
  picker.addEventListener('change', () => choose(picker.value, {push:true}));
  window.addEventListener('popstate', restoreHash);
  window.addEventListener('hashchange', restoreHash);
  for (const [id, value] of [['zoom-in', 1.25], ['zoom-out', .8]]) {
    document.querySelector(`#${id}`).addEventListener('click', () => { automatic = false; applyScale(scale * value); });
  }
  document.querySelector('#zoom-fit').addEventListener('click', () => { automatic = false; fit(true); });
  document.querySelector('#zoom-width').addEventListener('click', () => { automatic = false; fit(); });
  document.querySelector('#zoom-reset').addEventListener('click', () => { automatic = false; applyScale(1); if (selected) centerNode(selected, selectedDetail); });
  window.addEventListener('resize', () => { if (automatic) fit(); });

  let drag = null;
  canvas.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('a')) return;
    drag = {x:event.clientX, y:event.clientY, left:canvas.scrollLeft, top:canvas.scrollTop};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag) return;
    if (Math.abs(event.clientX-drag.x) + Math.abs(event.clientY-drag.y) > 4) canvas.classList.add('dragging');
    canvas.scrollLeft = drag.left - (event.clientX-drag.x);
    canvas.scrollTop = drag.top - (event.clientY-drag.y);
  });
  const stop = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('lostpointercapture', stop);
  fit();
  if (location.hash) restoreHash();
})();
</script></body></html>
