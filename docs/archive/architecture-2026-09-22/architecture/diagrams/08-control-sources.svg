<path class="connector" data-from="sources" data-to="cancelled" data-kind="call" data-route="480,356 480,424" d="M 480,356 L 480,424" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#08-control-sources-arrow)"/>
