<g class="node" data-key="p" data-box="40,112,240,88"><rect x="40" y="112" width="240" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="56" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">暂停来源甲：已解除</text><text x="56" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">恢复明确引用来源甲</text><text x="56" y="184" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">CLEARED</text></g>
<g class="node" data-key="q" data-box="680,112,240,88"><rect x="680" y="112" width="240" height="88" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="696" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">暂停来源乙：仍有效</text><text x="696" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">独立接纳的另一项暂停</text><text x="696" y="184" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">ACTIVE</text></g>
<g class="node" data-key="sources" data-box="360,268,240,88"><rect x="360" y="268" width="240" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="376" y="296" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">读取全部控制来源</text><text x="376" y="320" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保留原操作、范围与修订</text><text x="376" y="340" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">解除记录也参与恢复核对</text></g>
<g class="node decision" data-key="cancelled" data-box="360,424,240,112"><polygon points="480.0,424 600,480.0 480.0,536 360,480.0" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="480.0" y="476.0" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">已接纳取消？</text><text x="480.0" y="498.0" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">取消优先处理</text></g>
