<g class="node decision" data-key="paused" data-box="360,616,240,112"><polygon points="480.0,616 600,672.0 480.0,728 360,672.0" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="480.0" y="668.0" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">仍有有效暂停？</text><text x="480.0" y="690.0" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">任一来源为 ACTIVE</text></g>
<g class="node" data-key="pause" data-box="40,624,240,96"><rect x="40" y="624" width="240" height="96" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="56" y="652" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">有效控制：PAUSE</text><text x="56" y="676" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">来源乙仍然有效</text><text x="56" y="696" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">暂停与落实进展分别报告</text></g>
<g class="node" data-key="run" data-box="360,800,240,112"><rect x="360" y="800" width="240" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="376" y="828" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">有效控制：RUN</text><text x="376" y="852" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">再查输入、权限与资源</text><text x="376" y="872" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">以及依赖和可运行工作</text><text x="376" y="892" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">仍可能需要等待</text></g><line x1="40" y1="932" x2="920" y2="932" stroke="#cbd5e1"/><text x="40" y="960" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">来源甲已解除、乙仍有效 → PAUSE。控制意图与任务主状态分开记录。</text>
</svg>
