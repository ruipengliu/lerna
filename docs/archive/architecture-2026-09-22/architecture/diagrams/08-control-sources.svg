<path class="connector" data-from="cancelled" data-to="paused" data-kind="call" data-route="480,536 480,616" d="M 480,536 L 480,616" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#08-control-sources-arrow)"/>
