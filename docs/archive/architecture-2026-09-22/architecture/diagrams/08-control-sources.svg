<?xml version="1.0" encoding="UTF-8"?>
<svg id="08-control-sources" viewBox="0 0 960 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-control-sources-title 08-control-sources-desc">
<title id="08-control-sources-title">解除一次暂停，为什么还不能继续</title>
<desc id="08-control-sources-desc">任务保存按来源区分的暂停集合。解除来源甲后，其状态为 CLEARED，来源乙仍为 ACTIVE。合并时先判断已接纳取消，再判断是否存在有效暂停；图中的例子因此仍为 PAUSE。只有没有取消且全部暂停来源已解除时才得到 RUN，此后仍须检查输入、权限、资源和依赖。后到的旧来源修订不得覆盖已保存的解除记录，父任务恢复也不能清除子任务独立暂停。图中 CANCEL、PAUSE、RUN 是控制意图，不是任务的完成、等待或运行主状态。</desc>
<defs><marker id="08-control-sources-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="08-control-sources-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="984" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">解除一次暂停，为什么还不能继续</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">独立控制例：任务先后接纳暂停来源甲和乙；恢复操作只解除来源甲，本例尚未接纳取消</text><path class="connector" data-from="p" data-to="sources" data-kind="call" data-route="160,200 160,232 420,232 420,268" d="M 160,200 L 160,224 Q 160,232 168,232 L 412,232 Q 420,232 420,240 L 420,268" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#08-control-sources-arrow)"/>
