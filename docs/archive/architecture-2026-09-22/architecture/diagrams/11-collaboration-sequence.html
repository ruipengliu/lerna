<p>父任务 T 先原子登记 U1、U2、有限预算预留、待处理工作及必要 Outbox，再分别委派。两个只读子任务在自己的事务中接纳、建立关联，并独立核对获准的 E1、E2。子任务完成自身收尾后可靠交接正式结果、来源、覆盖和用量；父任务核验并记录事实、结算额度，按有效偏好 P@1 综合摘要 D，再沿保存 S、读回 R 和手机交付的原流程完成目标。每列表示任务及其运行模块，不固定进程或设备；图中结果是资料记载的核对，不是实际产品验收。</p><p><a href="../main/03-coordination/03-agent-collaboration.md">返回多 Agent 协作</a></p>
