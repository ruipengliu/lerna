<?xml version="1.0" encoding="UTF-8"?>
<svg id="06-capability-selection" viewBox="0 0 960 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-capability-selection-title 06-capability-selection-desc">
<title id="06-capability-selection-title">怎样从候选中选到适用能力</title>
<desc id="06-capability-selection-desc">内核协调上下文准备，按目的、权限、资源和处理位置限制范围，Search 返回候选与覆盖状态。信息足够时用 Describe 加载准确版本的声明，核对语义、前提和参数来源，再形成有限提案。不足时区分无匹配、节点不可达、索引滞后和预算耗尽；仅在数量、时间及调用预算允许时补查，必要时允许有界扫描权威目录。不可补查或补查后仍不足时，明确原因与恢复条件，等待或澄清。补查不自动切换 GUI，目录分数也不授予执行权限。</desc>
<defs><marker id="06-capability-selection-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="06-capability-selection-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="816" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">怎样从候选中选到适用能力</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">正常路径先缩小范围，再加载准确声明；信息不足时保留原因，补查受预算约束</text><path class="connector" data-from="constraints" data-to="search" data-kind="call" data-route="224,216 272,216" d="M 224,216 L 272,216" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#06-capability-selection-arrow)"/>
