<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="564" viewBox="0 0 1120 564" role="img" aria-labelledby="05-offline-title 05-offline-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="05-offline-title">新受限工作的核验依据怎样变化</title><desc id="05-offline-desc">当前进程核验有效且许可允许离线时可进入有限窗口，重连、窗口到期、时间异常和远端有限许可的离线重启都回到重新核验；各请求继续受原范围和运行资格限制。</desc>
<defs>
        <marker id="05-offline-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="05-offline-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="05-offline-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="05-offline-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="564" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">新受限工作的核验依据怎样变化</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">这些是阅读用的资格状态，不是新增持久状态枚举。</text><line x1="40" y1="512" x2="1080" y2="512" stroke="#dae3ed"/><text x="40" y="540" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">时间异常不抹去已发出的动作；它们继续在获准收尾范围内核对。</text><path d="M190,230 L190.0,158.0 Q190,149 199.0,149.0 L427,149" fill="none" stroke="#245c9c" stroke-width="1.7" marker-end="url(#05-offline-arrow-accent)"/><path d="M730,149 L916.0,149.0 Q925,149 925.0,158.0 L925,327" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#05-offline-arrow)"/><path d="M580,192 L580.0,270.0 Q580,279 571.0,279.0 L320,279" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#05-offline-arrow)"/><path d="M925,427 L925.0,469.0 Q925,478 916.0,478.0 L199.0,478.0 Q190,478 190.0,469.0 L190,330" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#05-offline-arrow)"/><g data-node="待重新核验" data-bounds="60,230,260,100"><rect x="60" y="230" width="260" height="100" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="190.0" y="275.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">待重新核验</text><text x="190.0" y="302.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">不开始新的受限工作</text></g><g data-node="本进程核验有效" data-bounds="427,106,303,86"><rect x="427" y="106" width="303" height="86" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="578.5" y="144.5" font-size="22" fill="#245c9c" text-anchor="middle" font-weight="600">本进程核验有效</text><text x="578.5" y="171.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">每个请求仍须检查</text></g><g data-node="有限离线窗口内" data-bounds="775,327,303,100"><rect x="775" y="327" width="303" height="100" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="926.5" y="372.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">有限离线窗口内</text><text x="926.5" y="399.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">原范围与绑定继续有效</text></g><g data-label="true" data-bounds="262.0,112,92,29"><rect x="262.0" y="112" width="92" height="29" rx="3" fill="#fff"/><text x="308" y="134" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">核验通过</text></g><g data-label="true" data-bounds="949.0,207,110,54"><rect x="949.0" y="207" width="110" height="54" rx="3" fill="#fff"/><text x="1004" y="229" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">断网且许可</text><text x="1004" y="254" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">允许离线</text></g><g data-label="true" data-bounds="340.0,243,224,29"><rect x="340.0" y="243" width="224" height="29" rx="3" fill="#fff"/><text x="452" y="264" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">仅在线许可断网／核验失效</text></g><g data-label="true" data-bounds="354.0,442,394,29"><rect x="354.0" y="442" width="394" height="29" rx="3" fill="#fff"/><text x="551" y="463" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">重连／窗口到期／时间不可信／远端许可离线重启</text></g></svg>