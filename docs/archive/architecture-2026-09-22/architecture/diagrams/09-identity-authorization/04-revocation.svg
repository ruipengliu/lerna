<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="04-revocation-title 04-revocation-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="04-revocation-title">撤销已记录，原操作仍可能完成</title><desc id="04-revocation-desc">授权方记录撤销后通知资源端，资源端验证来源并将撤销和应用游标一起提交，阻止新的受限动作；独立回报应用进展并处置原作业，图中取消未阻止外部效果，随后保存真实效果和报告。</desc>
<defs>
        <marker id="04-revocation-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="04-revocation-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="04-revocation-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="04-revocation-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="880" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">撤销已记录，原操作仍可能完成</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">原操作已在有效许可下启动；查询、取消及必要披露另有有限许可与预算。</text><line x1="180" y1="161" x2="180" y2="800" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="560" y1="161" x2="560" y2="800" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="930" y1="161" x2="930" y2="800" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="40" y1="828" x2="1080" y2="828" stroke="#dae3ed"/><text x="40" y="856" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">资源端可独立回报“已应用”；取消与核对不等待回报成功。任务与界面按真实效果更新。</text><path d="M180,330 L560,330" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#04-revocation-arrow-open)"/><path d="M560,529 L930,529" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#04-revocation-arrow)"/><path d="M930,585 L560,585" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#04-revocation-arrow)"/><path d="M560,641 L930,641" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#04-revocation-arrow)"/><path d="M930,697 L560,697" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#04-revocation-arrow)"/><g data-node="授权方" data-bounds="64,105,232,66"><rect x="64" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="180.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">授权方</text><text x="180.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">权威撤销与传播</text></g><g data-node="资源执行端" data-bounds="444,105,232,66"><rect x="444" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">资源执行端</text><text x="560.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">执行存储与受信 Driver</text></g><g data-node="目标系统" data-bounds="814,105,232,66"><rect x="814" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="930.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">目标系统</text><text x="930.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">原作业正在执行</text></g><g data-node="记录撤销" data-bounds="50,194,260,84"><rect x="50" y="194" width="260" height="84" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="180.0" y="231.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">记录撤销</text><text x="180.0" y="258.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">撤销 · 回执 · Outbox</text></g><g data-node="本地应用事务" data-bounds="388,359,344,116"><rect x="388" y="359" width="344" height="116" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="560.0" y="398.5" font-size="21" fill="#245c9c" text-anchor="middle" font-weight="600">本地应用事务</text><text x="560.0" y="425.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">验证来源后提交撤销与游标</text><text x="560.0" y="452.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">阻止依赖原许可的新动作</text></g><g data-node="保存真实结果与报告待办" data-bounds="385,731,350,64"><rect x="385" y="731" width="350" height="64" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="771.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">保存真实结果与报告待办</text></g><g data-label="true" data-bounds="306.0,294,128,29"><rect x="306.0" y="294" width="128" height="29" rx="3" fill="#fff"/><text x="370.0" y="316" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">传播撤销修订</text></g><g data-label="true" data-bounds="672.0,493,146,29"><rect x="672.0" y="493" width="146" height="29" rx="3" fill="#fff"/><text x="745.0" y="515" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">请求取消原作业</text></g><g data-label="true" data-bounds="663.0,549,164,29"><rect x="663.0" y="549" width="164" height="29" rx="3" fill="#fff"/><text x="745.0" y="571" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">取消未能阻止效果</text></g><g data-label="true" data-bounds="690.0,605,110,29"><rect x="690.0" y="605" width="110" height="29" rx="3" fill="#fff"/><text x="745.0" y="627" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">核对原作业</text></g><g data-label="true" data-bounds="663.0,661,164,29"><rect x="663.0" y="661" width="164" height="29" rx="3" fill="#fff"/><text x="745.0" y="683" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">已完成及效果证据</text></g></svg>