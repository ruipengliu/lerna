<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="01-components-title 01-components-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="01-components-title">执行路径依赖谁</title><desc id="01-components-desc">接入层调用身份验证，内核和资源处理模块均调用授权判定；单次消费与业务准备由处理模块在自己的存储中原子提交。</desc>
<defs>
        <marker id="01-components-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="01-components-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="01-components-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="01-components-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="550" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">执行路径依赖谁</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">箭头从调用方指向被使用的接口；不表示调用先后。</text><line x1="40" y1="498" x2="1080" y2="498" stroke="#dae3ed"/><text x="40" y="526" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">许可管理在缺权分支展开；授权判定不代替消费登记，也不证明外部效果。</text><path d="M190,204 L190,336" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#01-components-arrow)"/><path d="M560,204 L560.0,243.0 Q560,252 551.0,252.0 L519.0,252.0 Q510,252 510.0,261.0 L510,336" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#01-components-arrow)"/><path d="M850,204 L850.0,267.0 Q850,276 841.0,276.0 L665.0,276.0 Q656,276 656.0,285.0 L656,336" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#01-components-arrow)"/><path d="M1010,204 L1010,336" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#01-components-arrow)"/><g data-node="受信接入层" data-bounds="60,120,260,84"><rect x="60" y="120" width="260" height="84" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="190.0" y="157.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">受信接入层</text><text x="190.0" y="184.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">连接与会话入口</text></g><g data-node="任务内核" data-bounds="430,120,260,84"><rect x="430" y="120" width="260" height="84" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="157.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">任务内核</text><text x="560.0" y="184.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">接纳、委派、决策、调度</text></g><g data-node="资源处理模块" data-bounds="800,120,280,84"><rect x="800" y="120" width="280" height="84" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="940.0" y="157.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">资源处理模块</text><text x="940.0" y="184.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">执行、记忆及数据出口</text></g><g data-node="身份验证" data-bounds="60,336,260,90"><rect x="60" y="336" width="260" height="90" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="190.0" y="376.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">身份验证</text><text x="190.0" y="403.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">IdentityVerifier</text></g><g data-node="授权判定" data-bounds="405,336,310,90"><rect x="405" y="336" width="310" height="90" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="560.0" y="376.5" font-size="22" fill="#245c9c" text-anchor="middle" font-weight="600">授权判定</text><text x="560.0" y="403.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">Authorizer.Evaluate</text></g><g data-node="业务／执行存储" data-bounds="800,336,280,106"><path d="M800,349 Q800,336 940.0,336 Q1080,336 1080,349 V429 Q1080,442 940.0,442 Q800,442 800,429 Z" fill="#f5f8fb" stroke="#b8c8da" stroke-width="1.5"/><path d="M800,349 Q940.0,370 1080,349" fill="none" stroke="#b8c8da" stroke-width="1.2"/><text x="940.0" y="390.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">业务／执行存储</text><text x="940.0" y="417.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">处理端自己的原子组</text></g><g data-label="true" data-bounds="219.0,256,56,29"><rect x="219.0" y="256" width="56" height="29" rx="3" fill="#fff"/><text x="247" y="278" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">认证</text></g><g data-label="true" data-bounds="397.0,217,110,29"><rect x="397.0" y="217" width="110" height="29" rx="3" fill="#fff"/><text x="452" y="239" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">接纳／调度</text></g><g data-label="true" data-bounds="697.0,239,110,29"><rect x="697.0" y="239" width="110" height="29" rx="3" fill="#fff"/><text x="752" y="261" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">使用前复核</text></g><g data-label="true" data-bounds="853.0,288,146,29"><rect x="853.0" y="288" width="146" height="29" rx="3" fill="#fff"/><text x="926" y="310" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">消费与业务提交</text></g></svg>