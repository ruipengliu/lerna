<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="796" viewBox="0 0 1120 796" role="img" aria-labelledby="03-issuance-title 03-issuance-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="03-issuance-title">批准怎样变成可交付的许可</title><desc id="03-issuance-desc">授权模块先持久保存等待项并呈现，用户回应经权限复核后，在授权存储中核对申请版本并原子记录回应、等待项消费、许可、预留、回执与通知，确认提交才交付。</desc>
<defs>
        <marker id="03-issuance-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="03-issuance-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="03-issuance-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="03-issuance-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="796" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">批准怎样变成可交付的许可</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">只展开有效批准；迟到、冲突和未知提交见细则 B。</text><line x1="140" y1="161" x2="140" y2="712" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="420" y1="161" x2="420" y2="712" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="690" y1="161" x2="690" y2="712" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="980" y1="161" x2="980" y2="712" stroke="#b8c8da" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="40" y1="744" x2="1080" y2="744" stroke="#dae3ed"/><text x="40" y="772" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">授权、任务和界面各自提交；等待项消费与执行端许可消费分别登记。</text><path d="M420,211 L690,211" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#03-issuance-arrow)"/><path d="M690,261 L420,261" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#03-issuance-arrow)"/><path d="M420,312 L140,312" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#03-issuance-arrow-open)"/><path d="M140,365 L420,365" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#03-issuance-arrow)"/><path d="M420,423 L690,423" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#03-issuance-arrow)"/><path d="M690,621 L420,621" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#03-issuance-arrow)"/><path d="M420,680 L980,680" fill="none" stroke="#245c9c" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#03-issuance-arrow-open)"/><g data-node="用户界面" data-bounds="24,105,232,66"><rect x="24" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="140.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">用户界面</text><text x="140.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">呈现与可靠转交</text></g><g data-node="授权管理" data-bounds="304,105,232,66"><rect x="304" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="420.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">授权管理</text><text x="420.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">复核与签发</text></g><g data-node="授权存储" data-bounds="574,105,232,66"><rect x="574" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="690.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">授权存储</text><text x="690.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">AuthorizationStore</text></g><g data-node="资源处理端" data-bounds="864,105,232,66"><rect x="864" y="105" width="232" height="66" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="980.0" y="133.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">资源处理端</text><text x="980.0" y="160.0" font-size="16" fill="#53667e" text-anchor="middle" font-weight="400">本地复核与使用</text></g><g data-node="授权存储事务" data-bounds="533,444,314,133"><rect x="533" y="444" width="314" height="133" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="690.0" y="478.5" font-size="21" fill="#245c9c" text-anchor="middle" font-weight="600">授权存储事务</text><text x="690.0" y="505.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">核对等待项与版本</text><text x="690.0" y="532.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">回应 · 消费申请 · Grant</text><text x="690.0" y="559.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">预留 · 回执 · Outbox</text></g><g data-label="true" data-bounds="482.0,175,146,29"><rect x="482.0" y="175" width="146" height="29" rx="3" fill="#fff"/><text x="555.0" y="197" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">保存申请及版本</text></g><g data-label="true" data-bounds="491.0,225,128,29"><rect x="491.0" y="225" width="128" height="29" rx="3" fill="#fff"/><text x="555.0" y="247" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">等待项已保存</text></g><g data-label="true" data-bounds="234.0,276,92,29"><rect x="234.0" y="276" width="92" height="29" rx="3" fill="#fff"/><text x="280.0" y="298" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">呈现申请</text></g><g data-label="true" data-bounds="198.0,329,164,29"><rect x="198.0" y="329" width="164" height="29" rx="3" fill="#fff"/><text x="280.0" y="351" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">回应绑定当前申请</text></g><g data-label="true" data-bounds="473.0,387,164,29"><rect x="473.0" y="387" width="164" height="29" rx="3" fill="#fff"/><text x="555.0" y="409" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">复核授予权后提交</text></g><g data-label="true" data-bounds="500.0,585,110,29"><rect x="500.0" y="585" width="110" height="29" rx="3" fill="#fff"/><text x="555.0" y="607" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">确认已提交</text></g><g data-label="true" data-bounds="600.0,644,200,29"><rect x="600.0" y="644" width="200" height="29" rx="3" fill="#fff"/><text x="700.0" y="666" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">交付已提交的签名许可</text></g><g data-label="true" data-bounds="860.5,707,139,29"><rect x="860.5" y="707" width="139" height="29" rx="3" fill="#fff"/><text x="930" y="728" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">转入使用前复核</text></g></svg>