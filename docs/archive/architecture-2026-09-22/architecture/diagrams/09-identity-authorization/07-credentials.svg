<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="656" viewBox="0 0 1120 656" role="img" aria-labelledby="07-credentials-title 07-credentials-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="07-credentials-title">受信执行端使用凭证，任务只传引用</title><desc id="07-credentials-desc">任务携带受控凭证引用，受信 Driver 按目标服务、账号、用途和自身身份向凭证代理申请必要使用能力，代理使用节点加密凭证及独立主密钥供应，秘密不返回普通任务消息。</desc>
<defs>
        <marker id="07-credentials-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="07-credentials-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="07-credentials-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="07-credentials-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="656" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">受信执行端使用凭证，任务只传引用</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">只展开已获准调用的凭证关系；图中位置不代表进程隔离。</text><line x1="40" y1="604" x2="1080" y2="604" stroke="#dae3ed"/><text x="40" y="632" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">实线为请求或材料流向，虚线返回必要使用能力；秘密不进入模型与普通任务消息。</text><path d="M292,176 L430,176" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#07-credentials-arrow)"/><path d="M712,176 L836,176" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#07-credentials-arrow)"/><path d="M490,220 L490,400" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#07-credentials-arrow)"/><path d="M650,400 L650,220" fill="none" stroke="#245c9c" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#07-credentials-arrow-accent)"/><path d="M310,460 L430,460" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#07-credentials-arrow)"/><path d="M836,460 L712,460" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#07-credentials-arrow)"/><g data-node="任务消息" data-bounds="40,132,252,88"><rect x="40" y="132" width="252" height="88" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="166.0" y="171.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">任务消息</text><text x="166.0" y="198.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">大脑、Skill 只传引用</text></g><g data-node="受信 Driver／出口" data-bounds="430,132,282,88"><rect x="430" y="132" width="282" height="88" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="571.0" y="171.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">受信 Driver／出口</text><text x="571.0" y="198.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">在获准执行位置调用</text></g><g data-node="目标文件服务" data-bounds="836,132,246,88"><rect x="836" y="132" width="246" height="88" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="959.0" y="171.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">目标文件服务</text><text x="959.0" y="198.0" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">操作范围仍受许可限制</text></g><g data-node="独立主密钥供应" data-bounds="40,400,270,120"><rect x="40" y="400" width="270" height="120" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="175.0" y="441.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">独立主密钥供应</text><text x="175.0" y="468.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">来自独立受限位置</text><text x="175.0" y="495.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">不进入凭证库或日志</text></g><g data-node="凭证代理" data-bounds="430,400,282,120"><rect x="430" y="400" width="282" height="120" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="571.0" y="441.5" font-size="21" fill="#245c9c" text-anchor="middle" font-weight="600">凭证代理</text><text x="571.0" y="468.5" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">CredentialBroker</text><text x="571.0" y="495.5" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">核对目标、账号、用途、身份</text></g><g data-node="凭证存储" data-bounds="836,400,246,120"><path d="M836,413 Q836,400 959.0,400 Q1082,400 1082,413 V507 Q1082,520 959.0,520 Q836,520 836,507 Z" fill="#f5f8fb" stroke="#b8c8da" stroke-width="1.5"/><path d="M836,413 Q959.0,434 1082,413" fill="none" stroke="#b8c8da" stroke-width="1.2"/><text x="959.0" y="447.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">凭证存储</text><text x="959.0" y="474.5" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">使用节点的 SQLite</text><text x="959.0" y="501.5" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">加密保存</text></g><g data-label="true" data-bounds="317.0,119,88,54"><rect x="317.0" y="119" width="88" height="54" rx="3" fill="#fff"/><text x="361" y="140" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">获准请求</text><text x="361" y="165" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">受控引用</text></g><g data-label="true" data-bounds="721.5,135,105,29"><rect x="721.5" y="135" width="105" height="29" rx="3" fill="#fff"/><text x="774" y="156" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">登录／调用</text></g><g data-label="true" data-bounds="388.0,288,88,29"><rect x="388.0" y="288" width="88" height="29" rx="3" fill="#fff"/><text x="432" y="309" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">申请使用</text></g><g data-label="true" data-bounds="681.0,288,122,29"><rect x="681.0" y="288" width="122" height="29" rx="3" fill="#fff"/><text x="742" y="309" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">必要使用能力</text></g><g data-label="true" data-bounds="334.5,418,71,29"><rect x="334.5" y="418" width="71" height="29" rx="3" fill="#fff"/><text x="370" y="439" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">主密钥</text></g><g data-label="true" data-bounds="730.0,418,88,29"><rect x="730.0" y="418" width="88" height="29" rx="3" fill="#fff"/><text x="774" y="439" font-size="17" fill="#53667e" text-anchor="middle" font-weight="400">加密凭证</text></g></svg>