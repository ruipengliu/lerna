<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="564" viewBox="0 0 1120 564" role="img" aria-labelledby="06-data-title 06-data-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="06-data-title">每个数据出口分别取得许可</title><desc id="06-data-desc">资料读取后到达记忆、模型、界面、日志或评测前，由各处理端分别核对用途、位置和接收方；策略收紧时停止新不合规使用并处理上下文与副本。</desc>
<defs>
        <marker id="06-data-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="06-data-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="06-data-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="06-data-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="564" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">每个数据出口分别取得许可</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">箭头表示可获准的数据路径；一次读取许可不覆盖所有后续用途。</text><line x1="40" y1="512" x2="1080" y2="512" stroke="#dae3ed"/><text x="40" y="540" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">检查分布在各出口；此图不引入集中数据网关，也不授予云端读取端侧原文的权限。</text><path d="M270,264 L395,264" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#06-data-arrow)"/><path d="M675,238 L727.0,238.0 Q736,238 736.0,229.0 L736.0,153.0 Q736,144 745.0,144.0 L825,144" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#06-data-arrow)"/><path d="M675,256 L764.0,256.0 Q768,256 768.0,252.0 L768.0,252.0 Q768,248 772.0,248.0 L825,248" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#06-data-arrow)"/><path d="M675,274 L759.0,274.0 Q768,274 768.0,283.0 L768.0,343.0 Q768,352 777.0,352.0 L825,352" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#06-data-arrow)"/><path d="M675,292 L727.0,292.0 Q736,292 736.0,301.0 L736.0,447.0 Q736,456 745.0,456.0 L825,456" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#06-data-arrow)"/><g data-node="受控内容" data-bounds="40,218,230,92"><rect x="40" y="218" width="230" height="92" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="155.0" y="259.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">受控内容</text><text x="155.0" y="286.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">原文 · 偏好 · 摘要</text></g><g data-node="各处理端分别检查" data-bounds="395,209,280,110"><rect x="395" y="209" width="280" height="110" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="535.0" y="246.0" font-size="22" fill="#245c9c" text-anchor="middle" font-weight="600">各处理端分别检查</text><text x="535.0" y="273.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">本次用途、处理位置</text><text x="535.0" y="300.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">接收方与适用限制</text></g><g data-node="记忆" data-bounds="825,106,260,76"><rect x="825" y="106" width="260" height="76" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="955.0" y="139.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">记忆</text><text x="955.0" y="166.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">长期保存与同步</text></g><g data-node="模型" data-bounds="825,210,260,76"><rect x="825" y="210" width="260" height="76" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="955.0" y="243.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">模型</text><text x="955.0" y="270.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">实际模型处理位置</text></g><g data-node="界面与交付" data-bounds="825,314,260,76"><rect x="825" y="314" width="260" height="76" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="955.0" y="347.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">界面与交付</text><text x="955.0" y="374.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">可披露内容</text></g><g data-node="日志、评测与复用" data-bounds="825,418,260,76"><rect x="825" y="418" width="260" height="76" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="955.0" y="451.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="600">日志、评测与复用</text><text x="955.0" y="478.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">各用途的最小事实</text></g><g data-label="true" data-bounds="286.0,222,92,29"><rect x="286.0" y="222" width="92" height="29" rx="3" fill="#fff"/><text x="332" y="244" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">读取获准</text></g></svg>