<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="02-decision-title 02-decision-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="02-decision-title">同一次求值，三种去向</title><desc id="02-decision-desc">可信请求由 Authorizer 求值：拒绝则停止本次尝试，需要输入则进入有权回应者可补充的申请，允许则由处理端落实限制与当前运行资格。</desc>
<defs>
        <marker id="02-decision-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="02-decision-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="02-decision-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="02-decision-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="600" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">同一次求值，三种去向</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">已有许可直接使用；授权等待只适用于可补充的权限。</text><line x1="40" y1="548" x2="1080" y2="548" stroke="#dae3ed"/><text x="40" y="576" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">未知条件、无法证明的范围关系、求值预算耗尽：不产生允许结果。</text><path d="M560,180 L560,222" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#02-decision-arrow)"/><path d="M425,276 L199.0,276.0 Q190,276 190.0,285.0 L190,444" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#02-decision-arrow)"/><path d="M560,330 L560,444" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#02-decision-arrow)"/><path d="M695,276 L921.0,276.0 Q930,276 930.0,285.0 L930,444" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#02-decision-arrow)"/><g data-node="Authorizer.Evaluate" data-bounds="385,110,350,70"><rect x="385" y="110" width="350" height="70" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="560.0" y="140.0" font-size="21" fill="#245c9c" text-anchor="middle" font-weight="600">Authorizer.Evaluate</text><text x="560.0" y="167.0" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">使用当前请求与受信范围</text></g><g data-node="判定结果" data-bounds="425,222,270,108"><path d="M560,222 L695,276 L560,330 L425,276 Z" fill="#fff" stroke="#b8c8da" stroke-width="1.5"/><text x="560" y="284" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">判定结果</text></g><g data-node="结束本次尝试" data-bounds="55,444,270,82"><rect x="55" y="444" width="270" height="82" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="190.0" y="480.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">结束本次尝试</text><text x="190.0" y="507.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">硬性禁止不能靠询问绕过</text></g><g data-node="申请补充许可" data-bounds="425,444,270,82"><rect x="425" y="444" width="270" height="82" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="560.0" y="480.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">申请补充许可</text><text x="560.0" y="507.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">策略允许，回应者有权</text></g><g data-node="落实限制后继续" data-bounds="795,444,270,82"><rect x="795" y="444" width="270" height="82" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="930.0" y="480.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">落实限制后继续</text><text x="930.0" y="507.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">使用前还需当前资格有效</text></g><g data-label="true" data-bounds="271.0,239,56,29"><rect x="271.0" y="239" width="56" height="29" rx="3" fill="#fff"/><text x="299" y="261" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">拒绝</text></g><g data-label="true" data-bounds="584.0,368,92,29"><rect x="584.0" y="368" width="92" height="29" rx="3" fill="#fff"/><text x="630" y="390" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">需要输入</text></g><g data-label="true" data-bounds="789.0,239,56,29"><rect x="789.0" y="239" width="56" height="29" rx="3" fill="#fff"/><text x="817" y="261" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">允许</text></g></svg>