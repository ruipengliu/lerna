<?xml version="1.0" encoding="UTF-8"?>
<svg id="15-package-dependencies" viewBox="0 0 960 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="15-package-dependencies-title 15-package-dependencies-desc">
<title id="15-package-dependencies-title">由启动入口选择实现，核心依赖行为契约</title>
<desc id="15-package-dependencies-desc">启动入口导入消费方模块和 Adapter；Adapter 导入消费方接口、共同领域类型及所用第三方库，消费方模块依赖共同领域类型，不导入具体 Adapter。模块和 Adapter 都使用相同的领域语义。图表示 Go 导入依赖，运行时调用由消费方经接口进入 Adapter；包路径与构造入口仍是设计示意。</desc>
<defs><marker id="15-package-dependencies-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="15-package-dependencies-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="15-package-dependencies-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="15-package-dependencies-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="872" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">由启动入口选择实现，核心依赖行为契约</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">依赖图：箭头从导入方指向被依赖方；只展示主要包关系，角标统计图内入边</text><text x="64" y="784" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="500" fill="#2d3142" text-anchor="start">公开接口可被外部实现导入；内部协调逻辑按需留在 internal 包。</text>
