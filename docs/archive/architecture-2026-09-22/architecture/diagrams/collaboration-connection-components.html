<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>委派经过连接，业务责任留在两端</title><style>body{margin:0;background:#fff}main{max-width:1120px;margin:auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1120" height="656" viewBox="0 0 1120 656" role="img" aria-labelledby="collaboration-connection-components-title collaboration-connection-components-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="collaboration-connection-components-title">委派经过连接，业务责任留在两端</title><desc id="collaboration-connection-components-desc">父任务保存委派及交接责任，经连接适配器向对端任务入口提交原请求；对端独立接纳、推进并返回结果。连接适配器合并表示两端通信职责，不取得任务推进权，两端业务存储各自保存事实。</desc>

        <marker id="collaboration-connection-components-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="collaboration-connection-components-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
