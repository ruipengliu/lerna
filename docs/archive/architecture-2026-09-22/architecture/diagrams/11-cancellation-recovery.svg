<rect x="344" y="584" width="592" height="40" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" />
<text x="360" y="608" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">此后联系恢复；当前权限与有限处置额度有效</text>
