<?xml version="1.0" encoding="UTF-8"?>
<svg id="11-cancellation-recovery" viewBox="0 0 960 1232" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="11-cancellation-recovery-title 11-cancellation-recovery-desc">
<title id="11-cancellation-recovery-title">子任务失联后，取消仍要核对与收尾</title>
<desc id="11-cancellation-recovery-desc">用户取消父任务 T，父端原子接纳 K，停止新增目标工作并持久记录发给 T2 的取消 K2。失联期间只能报告待联系、待核对，原预算预留继续占用。联系恢复且权限和有限处置额度有效后，父端交付原 K2；T2 的接纳回执不代表已停止。图中选择 T2 能处置在途工作、确认停止并核清用量的路径。父端查询原 T2，核验真实结果与预算，确认所有受辖工作完成必要处置后才记录 CANCELLED 并发布状态。两端分别提交，外部效果和用量不能由本地取消请求推断。</desc>
<defs><marker id="11-cancellation-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="11-cancellation-recovery-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="1232" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">子任务失联后，取消仍要核对与收尾</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">分支：T1 已完成并结算，T2 已接纳后失联；父子关联已保存，S、R 尚未准入</text><line x1="160" y1="192" x2="160" y2="1176" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="480" y1="192" x2="480" y2="1176" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
