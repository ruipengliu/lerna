<g class="edge-label"><rect x="244.0" y="1122" width="152" height="20" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5" class="label-mask"/><text x="320" y="1136" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">T 已取消，发布已知结果</text></g>
<g class="node" data-key="ui" data-box="40,112,240,80"><rect x="40" y="112" width="240" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="160.0" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">用户界面</text><text x="160.0" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">提交控制、读取真实状态</text></g>
<g class="node" data-key="parent" data-box="360,112,240,80"><rect x="360" y="112" width="240" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="480.0" y="140" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">父任务 T</text><text x="480.0" y="164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="middle">原 U2 与 T2 关联已保存</text></g>
