<g class="node" data-key="cancel" data-box="360,264,240,112"><rect x="360" y="264" width="240" height="112" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="376" y="292" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">原子接纳取消</text><text x="376" y="316" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">T 停止新增目标工作</text><text x="376" y="336" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保存对子取消 K2 及 Outbox</text></g>
<g class="node" data-key="wait" data-box="360,448,240,112"><rect x="360" y="448" width="240" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="376" y="476" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">等待联系恢复</text><text x="376" y="500" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保留原关联与待送达 K2</text><text x="376" y="520" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">未知预算继续占用</text></g>
<g class="node" data-key="stop" data-box="680,736,240,112"><rect x="680" y="736" width="240" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" /><text x="696" y="764" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">按实际情况收尾</text><text x="696" y="788" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">停止新工作，处置在途调用</text><text x="696" y="808" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">确认原分配不能继续使用</text><text x="696" y="828" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">保存最终用量与终态</text></g>
<g class="node" data-key="finish" data-box="360,976,240,120"><rect x="360" y="976" width="240" height="120" rx="6" fill="#edf4ff" stroke="#2e5aa8" stroke-width="1.5" /><text x="376" y="1004" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">核验后结束父任务</text><text x="376" y="1028" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">核对停止、效果及实际用量</text><text x="376" y="1048" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">结算一次，保留已发生事实</text><text x="376" y="1068" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">所辖工作已处置：CANCELLED</text></g><line x1="40" y1="1180" x2="920" y2="1180" stroke="#cbd5e1"/><text x="40" y="1208" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">实线为请求，虚线实心箭头为回执，空心为状态通知；受理、停止和预算结算分别确认。</text>
</svg>
