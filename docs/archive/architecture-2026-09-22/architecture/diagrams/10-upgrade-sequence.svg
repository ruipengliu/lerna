<?xml version="1.0" encoding="UTF-8"?>
<svg id="10-upgrade-sequence" viewBox="0 0 960 1304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10-upgrade-sequence-title 10-upgrade-sequence-desc">
<title id="10-upgrade-sequence-title">新版本激活后，旧工作沿原绑定继续</title>
<desc id="10-upgrade-sequence-desc">受信独立进程实现 v2 验证后先准备就绪，扩展管理原子保存本节点激活修订、绑定、回执及通知。目录应用修订后，另一项尚未固定的新工作可以选择兼容 v2。原操作仍由 v1 核对外部作业；前置效果确认后，已固定 v1 的后续操作继续经 v1 执行并报告证据。目录投影与执行路由在图中合并一列，各自状态仍分别保存。准备实例在激活事务之外，旧工作运行与外部效果也不属于激活事务。</desc>
<defs><marker id="10-upgrade-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="10-upgrade-sequence-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="1304" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">新版本激活后，旧工作沿原绑定继续</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">在途调用及已准入后续操作固定 v1；两版可并存、当前获准，本次无状态格式迁移</text><line x1="112" y1="192" x2="112" y2="1232" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
