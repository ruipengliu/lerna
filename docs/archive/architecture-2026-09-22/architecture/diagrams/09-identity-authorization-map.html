;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">读取、记忆变更及其他消费者</text><g class="source-block" id="source-60" data-source-block="60" data-kind="paragraph" data-source-line="225"><text x="3760" y="2790" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">单次许可在其他模块中也要登记：记忆变更将消费与业务提交绑定；单次读取在披露前保存</text><text x="3760" y="2834" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">原操作、读取修订和结果引用，重试恢复原获准结果。原结果无法恢复时明确报告，不能凭</text><text x="3760" y="2878" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">旧许可重新读取更新后的内容。无法将消费直接纳入业务事务的模块先持久预留，交接不明</text><text x="3760" y="2922" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">时保持占用。</text></g></g><g class="panel" id="09-identity-authorization-map-credentials" data-box="3728,3016,1120,1432"><rect x="3728" y="3016" width="1120" height="1432" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="3760" y="3070" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">外部服务分支：引用与使用能力</text><g class="source-block" id="source-48" data-source-block="48" data-kind="paragraph" data-source-line="187"><text x="3760" y="3134" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">本例的本机保存无需新增第三方令牌。如果接入需要账号登录的文件服务，执行端还要使用</text><text x="3760" y="3178" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">账号凭证。Harness 许可限定本次操作可以做什么，凭证用于服务登录或调用，拥有凭证</text><text x="3760" y="3222" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">不自动获得账号的全部使用权限。</text></g><g class="source-block" id="source-49" data-source-block="49" data-kind="paragraph" data-source-line="189"><text x="3760" y="3286" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">大脑、Skill 和普通任务消息只传受控凭证引用。凭证代理（CredentialBroker）在</text><text x="3760" y="3330" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">获准执行位置，按目标服务、账号、用途和 Driver 身份提供必要的使用能力，只有受信 </text><text x="3760" y="3374" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">Driver 或受控出口可以取得。引用本身须授权；外部 Agent 取得受限能力入口，不因委</text><text x="3760" y="3418" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">派拿到长期密钥。</text></g><g class="source-block" id="source-50" data-source-block="50" data-kind="paragraph" data-source-line="191"><text x="3760" y="3482" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">凭证子路径展示获准调用中的引用与使用能力流向；决策、调度和业务恢复的约束在本图其</text><text x="3760" y="3526" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">他区域展开。</text></g><g class="source-block" id="source-51" data-source-block="51" data-kind="figure" data-source-line="193"><path class="connector" data-route="[(4000, 3676), (4156, 3676)]" d="M 4000,3676 L 4156,3676" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="4000.0" y="3629" width="156" height="30" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4078" y="3652" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">获准请求／引用</text><path class="connector" data-route="[(4396, 3676), (4552, 3676)]" d="M 4396,3676 L 4552,3676" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="4416.0" y="3629" width="116" height="30" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4474" y="3652" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">登录／调用</text><path class="connector" data-route="[(4208, 3740), (4208, 3916)]" d="M 4208,3740 L 4208,3916" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="4088.0" y="3813" width="96" height="30" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4136" y="3836" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">申请使用</text><path class="connector" data-route="[(4344, 3916), (4344, 3740)]" d="M 4344,3916 L 4344,3740" fill="none" stroke="#51677b" stroke-width="3" stroke-dasharray="10,8" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="4380.0" y="3813" width="96" height="30" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4428" y="3836" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">使用能力</text><path class="connector" data-route="[(4000, 3980), (4156, 3980)]" d="M 4000,3980 L 4156,3980" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="4030.0" y="3933" width="96" height="30" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4078" y="3956" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">加密凭证</text><rect x="3760" y="3612" width="240" height="128" rx="8" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><text x="3880" y="3656" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">任务消息</text><text x="3880" y="3692" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">大脑／Skill 只传引</text><text x="3880" y="3720" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">用</text><rect x="4156" y="3612" width="240" height="128" rx="8" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><text x="4276" y="3656" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">受信 Driver</text><text x="4276" y="3692" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">或受控出口</text><rect x="4552" y="3612" width="240" height="128" rx="8" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><text x="4672" y="3656" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">目标文件服务</text><text x="4672" y="3692" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">登录／调用</text><rect x="4156" y="3916" width="240" height="128" rx="8" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><text x="4276" y="3960" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">凭证代理</text><text x="4276" y="3996" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">CredentialBroker</text><rect x="3760" y="3916" width="240" height="128" rx="8" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><text x="3880" y="3960" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">凭证存储</text><text x="3880" y="3996" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="20" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">加密凭证；主密钥独立</text><text x="3760" y="4104" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">虚线表示使用能力返回；空间位置不表示进程隔离。</text><text x="3760" y="4164" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">任务消息只携带受控凭证引用，受信 Driver 或受控出口向凭证代理申请使用能力，代理按目标服</text><text x="3760" y="4204" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">务、账号、用途和 Driver 身份核验后提供，执行端据此调用目标服务；原始秘密不返回模型或普</text><text x="3760" y="4244" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">通任务消息。</text></g><g class="source-block" id="source-52" data-source-block="52" data-kind="paragraph" data-source-line="195"><text x="3760" y="4306" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">凭证缺失、过期或主密钥不可用时，暂停依赖它的新调用，其他独立工作可继续。诊断仅保</text><text x="3760" y="4350" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">留受控引用和原因，秘密不进入模型、索引、普通载荷或错误文本。引用也不能成为任意下</text><text x="3760" y="4394" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">载密钥的地址。</text></g></g><g class="panel" id="09-identity-authorization-map-key-storage" data-box="3728,4488,1120,768"><rect x="3728" y="4488" width="1120" height="768" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="3760" y="4542" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">凭证与主密钥怎样保存和轮换</text><g class="source-block" id="source-63" data-source-block="63" data-kind="table" data-source-line="237"><rect x="3760" y="4580" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="4580" x2="4056" y2="4656" stroke="#cedae5" stroke-width="2"/><text x="3776" y="4622" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">环节</text><text x="4072" y="4622" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">参考实现与恢复要求</text><rect x="3760" y="4656" width="1056" height="208" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="4656" x2="4056" y2="4864" stroke="#cedae5" stroke-width="2"/><text x="3776" y="4698" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">保存与主密钥供应</text><text x="4072" y="4698" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">凭证加密保存在使用节点的 SQLite，主密钥从独立受限位置</text><text x="4072" y="4742" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">取得，不进入凭证库、普通任务配置或日志。供应方式可替换为</text><text x="4072" y="4786" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">操作系统凭证设施、人工解锁或外部密钥管理，各实现声明支持</text><text x="4072" y="4830" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">范围。</text><rect x="3760" y="4864" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="4864" x2="4056" y2="4984" stroke="#cedae5" stroke-width="2"/><text x="3776" y="4906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">密钥轮换</text><text x="4072" y="4906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">记录版本，逐条重新加密，支持断点恢复；数据迁移及允许的备</text><text x="4072" y="4950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">份保留处置完成后，才清理不再需要的旧密钥。</text><rect x="3760" y="4984" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="4984" x2="4056" y2="5060" stroke="#cedae5" stroke-width="2"/><text x="3776" y="5026" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">第三方令牌续期</text><text x="4072" y="5026" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">结果不明时，按提供方契约核对。</text></g><g class="source-block" id="source-64" data-source-block="64" data-kind="paragraph" data-source-line="243"><text x="3760" y="5114" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">默认加密方案保护数据库单独泄漏等情况。主密钥与密文同时泄漏，或宿主执行进程被控制</text><text x="3760" y="5158" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">时，无法提供同样保障；加密也不自动防止合法旧记录回滚。算法、密钥供应、内存使用和</text><text x="3760" y="5202" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">轮换配置见附录 02。</text></g></g><g class="panel" id="09-identity-authorization-map-revocation" data-box="4944,744,1120,1932"><rect x="4944" y="744" width="1120" height="1932" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="4976" y="798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">原保存分支：撤销与在途效果</text><g class="source-block" id="source-34" data-source-block="34" data-kind="paragraph" data-source-line="140"><text x="4976" y="862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">这个独立分支回到原任务：电脑已按有效写入许可向“输出”目录启动异步保存，用户此时撤</text><text x="4976" y="906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">销许可。授权方与电脑分开运行，通知暂未送达。工具可以查询原作业并请求取消，但不保</text><text x="4976" y="950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">证取消成功；查询、取消和必要结果披露另有有效的有限许可及处置预算。</text></g><g class="source-block" id="source-35" data-source-block="35" data-kind="paragraph" data-source-line="142"><text x="4976" y="1014" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权方先一起保存撤销记录和待发送通知，界面此时可以显示“撤销已记录，电脑待应用”。</text><text x="4976" y="1058" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑收到并应用撤销后，阻止依赖这份许可的新写入，再尝试取消和核对已经开始的保存。</text><text x="4976" y="1102" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权方记录撤销、电脑应用撤销和保存实际停止，需要分别确认。</text></g><g class="source-block" id="source-36" data-source-block="36" data-kind="paragraph" data-source-line="144"><text x="4976" y="1166" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">撤销分支选择取消未能阻止写入的结果，后续查询确认文件已经保存。原保存为 S，外部作</text><text x="4976" y="1210" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">业为 J，原写入许可为 G。</text></g><g class="source-block" id="source-37" data-source-block="37" data-kind="figure" data-source-line="146"><rect x="4976" y="1248" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="5000" y="1288" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">用户 → 授权方</text><text x="5192" y="1286" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">撤销 G；授权方一起保存撤销、管理回执与通知待办，报告“已记录；电脑待</text><text x="5192" y="1324" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">应用”。</text><rect x="4976" y="1392" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="5000" y="1432" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">授权方 → 电脑</text><text x="5192" y="1430" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">传播撤销修订。电脑将撤销状态与已应用游标一起提交，阻止依赖 G 的新受</text><text x="5192" y="1468" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">限写入。</text><rect x="4976" y="1536" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="5000" y="1576" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">应用后：回报</text><text x="5192" y="1574" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑向授权方报告“已应用”；授权方向任务／界面发布“电脑已应用；S 待核</text><text x="5192" y="1612" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">对”。</text><rect x="4976" y="1680" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="5000" y="1720" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">应用后：处置</text><text x="5192" y="1718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑向保存服务请求取消原作业 J；本例取消未能阻止写入。继续查询 J，服</text><text x="5192" y="1756" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">务返回 S 已写入的效果证据。</text><rect x="4976" y="1824" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="5000" y="1864" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">电脑 → 任务／</text><text x="5000" y="1900" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">界面</text><text x="5192" y="1862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">保存真实结果与交付待办，交接 S 的实际结果。任务按事实收尾，界面呈现</text><text x="5192" y="1900" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">已保存。</text><text x="4976" y="1992" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">回报与在途处置分别进行；这组事件的排列不表示取消必须等待界面确认。</text><text x="4976" y="2052" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">保存 S 已在许可 G 有效时启动。用户撤销 G，授权方将撤销和通知一起提交，先报告电脑待应用。</text><text x="4976" y="2092" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">电脑收到并应用撤销后阻止依赖 G 的新受限写入，再在仍获准的有限收尾范围内取消并核对 J。本</text><text x="4976" y="2132" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">例取消未能阻止写入，查询确认 S 已保存；执行端保存真实效果及报告，任务按事实收尾并更新界</text><text x="4976" y="2172" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">面。部分交接标签合并展示任务与界面，它们仍分别保存自己的状态。电脑执行端包含执行协调、E</text><text x="4976" y="2212" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">xecutionStore 与 Driver，外部调用始终在本地事务之外。</text></g><g class="source-block" id="source-38" data-source-block="38" data-kind="paragraph" data-source-line="148"><text x="4976" y="2274" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">撤销操作有稳定身份和预期修订，重放返回原回执；撤销上级授权也会限制其派生授权。电</text><text x="4976" y="2318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">脑验证通知来源，再将本地撤销状态和已应用游标一起提交。仅持久接收消息，还不能报告</text><text x="4976" y="2362" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">“已应用”。</text></g><g class="source-block" id="source-39" data-source-block="39" data-kind="paragraph" data-source-line="150"><text x="4976" y="2426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">已经发生的写入如实记录，未知结果保留待核对。撤销许可不取消整个任务，也不删除已写</text><text x="4976" y="2470" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">文件；清理须另行发起获准的删除操作。收尾仍受权限、保留策略和有限预算约束，不能借</text><text x="4976" y="2514" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">恢复重新取得写入资格。</text></g><g class="source-block" id="source-40" data-source-block="40" data-kind="paragraph" data-source-line="152"><text x="4976" y="2578" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权方不可达时，资源处理方可以在自身权限内收紧本地准入，但须按传播的实际进展报</text><text x="4976" y="2622" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">告，不能声称远端权威已完成撤销。</text></g></g><g class="panel" id="09-identity-authorization-map-offline" data-box="4944,2716,1120,1476"><rect x="4944" y="2716" width="1120" height="1476" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="4976" y="2770" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">离线、重启与重新核验</text><g class="source-block" id="source-41" data-source-block="41" data-kind="paragraph" data-source-line="157"><text x="4976" y="2834" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑离线时，看不到另一端刚发生的撤销。允许离线的许可须事先约定有限窗口和可验证条</text><text x="4976" y="2878" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">件；要求在线核验的工作等待连接恢复。是否能开始新的受限工作，取决于许可模式及本地</text><text x="4976" y="2922" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">能够证明的状态。</text></g><g class="source-block" id="source-42" data-source-block="42" data-kind="table" data-source-line="159"><rect x="4976" y="2960" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="2960" x2="5272" y2="3036" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3002" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">当前条件</text><text x="5288" y="3002" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">新受限工作的处理</text><rect x="4976" y="3036" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3036" x2="5272" y2="3156" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3078" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">在线且完成当前状态核</text><text x="4992" y="3122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">验</text><text x="5288" y="3078" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">按当前策略、撤销、期限和运行资格判断；连接存在本身不延长</text><text x="5288" y="3122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">许可。</text><rect x="4976" y="3156" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3156" x2="5272" y2="3276" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3198" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">同一进程离线，许可仍</text><text x="4992" y="3242" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">有效</text><text x="5288" y="3198" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">只在原资源、用途、接收方及操作／额度绑定内继续，截止不晚</text><text x="5288" y="3242" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">于许可到期和最大离线窗口。</text><rect x="4976" y="3276" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3276" x2="5272" y2="3396" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">必须在线核验，或离线</text><text x="4992" y="3362" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">窗口到期</text><text x="5288" y="3318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">等待重新核验，不能推断远端没有撤销。</text><rect x="4976" y="3396" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3396" x2="5272" y2="3516" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3438" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">时钟回拨、休眠异常或</text><text x="4992" y="3482" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">偏差使时间不可信</text><text x="5288" y="3438" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">停止新受限工作，重新建立可信时间和授权状态；已发出的动作</text><text x="5288" y="3482" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">继续受控核对。</text><rect x="4976" y="3516" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3516" x2="5272" y2="3636" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3558" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">依赖远端有限许可，离</text><text x="4992" y="3602" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">线后进程重启</text><text x="5288" y="3558" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">默认等待重新验证；文件里保存的剩余时长不足以证明许可仍有</text><text x="5288" y="3602" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">效。</text><rect x="4976" y="3636" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5272" y1="3636" x2="5272" y2="3756" stroke="#cedae5" stroke-width="2"/><text x="4992" y="3678" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">本机就是授权权威，重</text><text x="4992" y="3722" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">启后恢复</text><text x="5288" y="3678" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">可在受信本机重新核验本地策略和时间，建立新的执行资格，无</text><text x="5288" y="3722" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">需强制联系云服务。</text></g><g class="source-block" id="source-43" data-source-block="43" data-kind="paragraph" data-source-line="168"><text x="4976" y="3810" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">在线核验时，参考实现记录时间锚点和本次进程内的最晚执行时间，再结合单调经过时间、</text><text x="4976" y="3854" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">时钟不确定性及可检测异常检查期限。方案信任节点操作系统和签发方的时钟；宿主被控制</text><text x="4976" y="3898" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">时，无法保证抵抗时间篡改。替代实现若要支持远端许可在离线重启后继续使用，还须提供</text><text x="4976" y="3942" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">可信时间和防回滚证据。</text></g><g class="source-block" id="source-44" data-source-block="44" data-kind="paragraph" data-source-line="170"><text x="4976" y="4006" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">恢复连接后，先通过获准快照及连续变更取得当前策略和撤销信息，再接纳依赖在线状态的</text><text x="4976" y="4050" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">新工作。快照绑定视图及修订边界，游标或视图失效就重新取快照；不能先清空旧撤销状态</text><text x="4976" y="4094" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">再执行。同步密钥也只能从既有受信更新流程取得。旧备份恢复后须先隔离并重新核验，端</text><text x="4976" y="4138" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">云运行过程见端云协同与离线运行。</text></g></g><g class="panel" id="09-identity-authorization-map-checks-1" data-box="80,5584,1436,452"><rect x="80" y="5584" width="1436" height="452" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="5638" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">可信身份与许可材料</text><g class="source-block" data-source-block="66" data-kind="table"><rect x="112" y="5676" width="1372" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="496" y1="5676" x2="496" y2="5752" stroke="#cedae5" stroke-width="2"/><text x="128" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">验证重点</text><text x="512" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">必须取得的可观察证据</text><rect x="112" y="5752" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="496" y1="5752" x2="496" y2="5872" stroke="#cedae5" stroke-width="2"/><text x="128" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">可信身份</text><text x="512" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">伪造代理主体、错误 Origin、失效会话、节点禁用及恢复连接实际被拒绝，不能</text><text x="512" y="5838" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">退回较弱认证。</text><rect x="112" y="5872" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="496" y1="5872" x2="496" y2="5992" stroke="#cedae5" stroke-width="2"/><text x="128" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">范围及验证材料</text><text x="512" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">错误签发者、算法、接收方、证书绑定、未知限制和扩大委派均被拒绝；上级授权</text><text x="512" y="5958" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">撤销不能被派生材料隐藏。</text></g></g><g class="panel" id="09-identity-authorization-map-checks-2" data-box="1596,5584,1436,408"><rect x="1596" y="5584" width="1436" height="408" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="1628" y="5638" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">一次许可与任务控制</text><g class="source-block" data-source-block="66" data-kind="table"><rect x="1628" y="5676" width="1372" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="2012" y1="5676" x2="2012" y2="5752" stroke="#cedae5" stroke-width="2"/><text x="1644" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">验证重点</text><text x="2028" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">必须取得的可观察证据</text><rect x="1628" y="5752" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2012" y1="5752" x2="2012" y2="5872" stroke="#cedae5" stroke-width="2"/><text x="1644" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">一次许可</text><text x="2028" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">双执行者、重复提交、跨端重放和交付未知不增加消费次数；签发冲突的材料不交</text><text x="2028" y="5838" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">付，提交中断可核对。</text><rect x="1628" y="5872" width="1372" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2012" y1="5872" x2="2012" y2="5948" stroke="#cedae5" stroke-width="2"/><text x="1644" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">批准与任务控制</text><text x="2028" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">迟到或重复批准、任务取消与签发交错分别记录；授权成功不解除任务控制。</text></g></g><g class="panel" id="09-identity-authorization-map-checks-3" data-box="3112,5584,1436,452"><rect x="3112" y="5584" width="1436" height="452" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="3144" y="5638" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">撤销、离线与时间</text><g class="source-block" data-source-block="66" data-kind="table"><rect x="3144" y="5676" width="1372" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="3528" y1="5676" x2="3528" y2="5752" stroke="#cedae5" stroke-width="2"/><text x="3160" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">验证重点</text><text x="3544" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">必须取得的可观察证据</text><rect x="3144" y="5752" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="3528" y1="5752" x2="3528" y2="5872" stroke="#cedae5" stroke-width="2"/><text x="3160" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">撤销及在途效果</text><text x="3544" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">区分已记录、已接收和已应用；通知丢失或游标过期后可恢复，已经发生或未知的</text><text x="3544" y="5838" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">写入保留真实状态。</text><rect x="3144" y="5872" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="3528" y1="5872" x2="3528" y2="5992" stroke="#cedae5" stroke-width="2"/><text x="3160" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">离线与时间</text><text x="3544" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">窗口到期、时钟异常、离线重启及旧备份恢复遵守有限保证；本地权威与远端许可</text><text x="3544" y="5958" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">分别验证。</text></g></g><g class="panel" id="09-identity-authorization-map-checks-4" data-box="4628,5584,1436,452"><rect x="4628" y="5584" width="1436" height="452" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="4660" y="5638" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">数据、凭证与隔离</text><g class="source-block" data-source-block="66" data-kind="table"><rect x="4660" y="5676" width="1372" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="5044" y1="5676" x2="5044" y2="5752" stroke="#cedae5" stroke-width="2"/><text x="4676" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">验证重点</text><text x="5060" y="5718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">必须取得的可观察证据</text><rect x="4660" y="5752" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5044" y1="5752" x2="5044" y2="5872" stroke="#cedae5" stroke-width="2"/><text x="4676" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">数据与凭证</text><text x="5060" y="5794" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用途限制、纠正和删除触发相应处理；目标错绑、密文替换、主密钥缺失、轮换中</text><text x="5060" y="5838" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">断及秘密出口得到实际约束。</text><rect x="4660" y="5872" width="1372" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="5044" y1="5872" x2="5044" y2="5992" stroke="#cedae5" stroke-width="2"/><text x="4676" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">替换与隔离</text><text x="5060" y="5914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">身份、判定、授权存储及凭证供应实现复用共同契约；受信与不受信扩展分别声明</text><text x="5060" y="5958" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">环境和隔离证据。</text></g></g><g class="panel" id="09-identity-authorization-map-references" data-box="80,6076,5984,640"><rect x="80" y="6076" width="5984" height="640" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="6130" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">实现状态与查阅出处</text><g class="source-block" id="source-67" data-source-block="67" data-kind="pa " fill="#2e5aa8" text-anchor="start" xml:space="preserve">附录 03  ·  03-state-and-failure-matrices.md</text></a><a href="../main/02-subsystems/08-extensions-and-runtime.md"><text x="2096" y="6630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#2e5aa8" text-anchor="start" xml:space="preserve">《扩展接入与协议互操作》  ·  10-extensions-and-protocols.md</text></a><a href="../main/02-subsystems/05-interaction.md"><text x="4080" y="6630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#2e5aa8" text-anchor="start" xml:space="preserve">上一篇：用户交互与任务控制  ·  08-interaction-and-task-control.md</text></a><a href="../README.md"><text x="112" y="6678" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#2e5aa8" text-anchor="start" xml:space="preserve">返回阅读导航  ·  README.md</text></a></g><g class="panel" id="09-identity-authorization-map-evidence" data-box="80,5344,5984,216"><rect x="80" y="5344" width="5984" height="216" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="5398" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">共同验证：观察实际约束与恢复结果</text><g class="source-block" id="source-65" data-source-block="65" data-kind="paragraph" data-source-line="248"><text x="112" y="5462" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">验证要观察请求是否实际被允许或拒绝、原操作怎样恢复，以及已发生结果是否如实保留。审计日志提供线索，单凭日志不足以证明权限</text><text x="112" y="5506" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">已经落实。</text></g></g><line x1="80" y1="6740" x2="6064" y2="6740" stroke="#cedae5" stroke-width="2"/><text x="80" y="6776" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">读图：主线箭头表示处理顺序；分支写明适用条件；竖向分区用于查阅，约束持续适用；两个蓝色侧线框分别标出授权与执行存储。</text><text x="80" y="6830" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">全部规则、原伪代码与验证条目均在图内展开。签发、许可使用、实际效果分别核对；当前没有认证、密码互操作、离线时钟或安全实验结果。</text></svg></div></main>
<script>
(()=>{
const area=document.getElementById('viewport'),sheet=document.getElementById('sheet'),label=document.getElementById('scale'),toolbar=document.querySelector('header');
const W=6144,H=6864;let scale=1;
function resize(){area.style.height=(innerHeight-toolbar.offsetHeight)+'px';}
function setScale(next,point){next=Math.max(.045,Math.min(2,next));const cx=point?.x??area.clientWidth/2,cy=point?.y??area.clientHeight/2;const ar=area.getBoundingClientRect(),sr=sheet.getBoundingClientRect();const px=(ar.left+cx-sr.left)/scale,py=(ar.top+cy-sr.top)/scale;scale=next;sheet.style.width=(W*scale)+'px';sheet.style.height=(H*scale)+'px';const nr=sheet.getBoundingClientRect();area.scrollLeft+=nr.left+px*scale-ar.left-cx;area.scrollTop+=nr.top+py*scale-ar.top-cy;label.textContent=Math.round(scale*100)+'%';}
function fit(){setScale(Math.min((area.clientWidth-48)/W,(area.clientHeight-48)/H));area.scrollTo(0,0);document.getElementById('jump').value='';}
function locate(id){const el=document.getElementById(id);if(!el)return;const b=el.getBBox();setScale(.8);area.scrollTo(Math.max(0,b.x*scale-24),Math.max(0,b.y*scale-24));}
function read(){setScale(.8);area.scrollTo(0,0);document.getElementById('jump').value='';}
document.getElementById('fit').onclick=fit;document.getElementById('read').onclick=read;
document.getElementById('more').onclick=()=>setScale(scale*1.25);document.getElementById('less').onclick=()=>setScale(scale/1.25);
document.getElementById('jump').onchange=e=>{if(e.target.value)locate(e.target.value);};
area.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const r=area.getBoundingClientRect();setScale(scale*Math.exp(-e.deltaY*.002),{x:e.clientX-r.left,y:e.clientY-r.top});},{passive:false});
window.addEventListener('resize',resize);resize();read();
})();
</script></body></html>
