7;,&#x27;PingFang SC&#x27;,sans-serif" font-size="30" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">归档分支与材料</text><g id="09-identity-authorization-map-stage-4" class="stage" data-box="3808,348,960,184"><rect x="3808" y="348" width="960" height="184" rx="8" fill="#f4f7fa" stroke="#51677b" stroke-width="2" /><text x="4288.0" y="426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="42" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">04  实际使用资源</text><text x="4288.0" y="484" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">处理端复核当前条件；单次许可先登记消费</text></g><line x1="4288.0" y1="544" x2="4288.0" y2="708" stroke="#cedae5" stroke-width="2" stroke-dasharray="10,8"/><text x="3760" y="716" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="30" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">消费、执行与秘密</text><g id="09-identity-authorization-map-stage-5" class="stage" data-box="5024,348,960,184"><rect x="5024" y="348" width="960" height="184" rx="8" fill="#f4f7fa" stroke="#51677b" stroke-width="2" /><text x="5504.0" y="426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="42" font-weight="600" fill="#24384b" text-anchor="middle" xml:space="preserve">05  核对效果／处理变化</text><text x="5504.0" y="484" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">在途动作继续核对；变化可能发生在执行期间</text></g><line x1="5504.0" y1="544" x2="5504.0" y2="708" stroke="#cedae5" stroke-width="2" stroke-dasharray="10,8"/><text x="4976" y="716" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="30" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">撤销、离线与恢复</text><rect x="2352.0" y="368" width="224" height="64" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="2464.0" y="426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">缺权且可补充</text><rect x="3568.0" y="368" width="224" height="64" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="3680.0" y="394" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">签发提交确认</text><text x="3680.0" y="426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">并交付许可</text><rect x="4784.0" y="368" width="224" height="64" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="4896.0" y="426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="middle" xml:space="preserve">核对实际效果</text><rect x="2512" y="620" width="3552" height="64" rx="2" fill="#ffffff" stroke="none" stroke-width="2" /><text x="2528" y="662" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">持续约束：新的受限工作仍检查撤销、离线与用途限制；恢复、重连或策略变化后，先重新核验。</text><g class="panel" id="09-identity-authorization-map-task" data-box="80,744,1120,412"><rect x="80" y="744" width="1120" height="412" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">任务从哪里开始</text><g class="source-block" id="source-01" data-source-block="01" data-kind="paragraph" data-source-line="3"><text x="112" y="862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">手机发来“整理资料并保存摘要”的请求后，电脑需要先确认请求来自谁，再判断这次保存是</text><text x="112" y="906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">否获准。即使任务已经接纳，负责读取、发送和写入的模块仍要在实际使用资源时检查权</text><text x="112" y="950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">限，因为许可可能已经变化。</text></g><g class="source-block" id="source-02" data-source-block="02" data-kind="paragraph" data-source-line="5"><text x="112" y="1014" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">本篇沿用连续示例：读取手机里的《会议记录》和电脑上的《需求说明》，按获准的分组偏</text><text x="112" y="1058" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">好整理摘要，保存到电脑的 输出/项目进展摘要.md，读回核验后向手机交付。前篇的内容</text><text x="112" y="1102" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">确认表示用户接受这版摘要，实际执行范围仍由授权决定。</text></g></g><g class="panel" id="09-identity-authorization-map-identity" data-box="80,1196,1120,808"><rect x="80" y="1196" width="1120" height="808" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="1250" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">确认用户、代理与节点</text><g class="source-block" id="source-03" data-source-block="03" data-kind="paragraph" data-source-line="14"><text x="112" y="1314" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑收到请求时，要分别核对用户、Agent 和节点身份。</text></g><g class="source-block" id="source-04" data-source-block="04" data-kind="table" data-source-line="16"><rect x="112" y="1352" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="1352" x2="408" y2="1428" stroke="#cedae5" stroke-width="2"/><text x="128" y="1394" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">身份</text><text x="424" y="1394" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">在摘要任务中的含义</text><rect x="112" y="1428" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="1428" x2="408" y2="1504" stroke="#cedae5" stroke-width="2"/><text x="128" y="1470" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用户</text><text x="424" y="1470" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">提出任务，是请求的原始发起主体。</text><rect x="112" y="1504" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="1504" x2="408" y2="1580" stroke="#cedae5" stroke-width="2"/><text x="128" y="1546" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">Agent</text><text x="424" y="1546" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">代表用户处理任务，只能在获准范围内行动。</text><rect x="112" y="1580" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="1580" x2="408" y2="1656" stroke="#cedae5" stroke-width="2"/><text x="128" y="1622" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">节点</text><text x="424" y="1622" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">手机或电脑等通信参与方，须经认证和受信登记确认能代表谁。</text></g><g class="source-block" id="source-05" data-source-block="05" data-kind="paragraph" data-source-line="22"><text x="112" y="1710" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">连接入口先认证对端，再按受信登记建立这些关系，不能仅凭消息中的“我是这个用户”放</text><text x="112" y="1754" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">行。请求经过转交时保留原始发起主体和代理关系，中间节点不能换用自己更宽的权限。进</text><text x="112" y="1798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">程内调用也由受信宿主提供身份上下文，普通工具参数不能覆盖它。</text></g><g class="source-block" id="source-06" data-source-block="06" data-kind="paragraph" data-source-line="24"><text x="112" y="1862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">这些身份归入用户的隔离范围，即命名空间（namespace）。隔离贯穿路由、存储键、缓</text><text x="112" y="1906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">存、索引、对象访问和订阅。同一用户的设备可以协作，每项资源仍按自己的权限开放。任</text><text x="112" y="1950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">务拥有者（Owner）有资格推进任务状态，读取或保存还要另行满足资源授权。</text></g></g><g class="panel" id="09-identity-authorization-map-registration" data-box="80,2044,1120,876"><rect x="80" y="2044" width="1120" height="876" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="2098" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">先建立信任，再接受连接</text><g class="source-block" id="source-55" data-source-block="55" data-kind="paragraph" data-source-line="209"><text x="112" y="2162" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">身份管理可以在单机完成，外部身份平台通过可替换的验证接口接入。</text></g><g class="source-block" id="source-56" data-source-block="56" data-kind="table" data-source-line="211"><rect x="112" y="2200" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="2200" x2="408" y2="2276" stroke="#cedae5" stroke-width="2"/><text x="128" y="2242" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">环节</text><text x="424" y="2242" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">配置与检查</text><rect x="112" y="2276" width="1056" height="208" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="2276" x2="408" y2="2484" stroke="#cedae5" stroke-width="2"/><text x="128" y="2318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">建立信任与加入设备</text><text x="424" y="2318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">首次安装通过本地受信管理入口建立管理员和信任根。新设备提</text><text x="424" y="2362" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">交公钥及目标用户范围，管理员核对后登记并交付证书，私钥留</text><text x="424" y="2406" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">在设备。加入请求短期且一次性，设备也须核验经受信路径取得</text><text x="424" y="2450" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">的信任根；自动发现和连接成功只提供待核对线索。</text><rect x="112" y="2484" width="1056" height="208" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="2484" x2="408" y2="2692" stroke="#cedae5" stroke-width="2"/><text x="128" y="2526" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">日常连接</text><text x="424" y="2526" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">原生节点通过双向 TLS（mTLS）互相认证；浏览器通过同源 H</text><text x="424" y="2570" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">TTPS 登录和服务端会话确认用户，建立 WebSocket 时核对</text><text x="424" y="2614" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">会话与来源。系统持续检查节点和会话是否失效，包括长连接和</text><text x="424" y="2658" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">恢复的连接。</text><rect x="112" y="2692" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="408" y1="2692" x2="408" y2="2812" stroke="#cedae5" stroke-width="2"/><text x="128" y="2734" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">认证边界</text><text x="424" y="2734" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">节点认证失败不能退回浏览器身份，默认直连不信任代理自报的</text><text x="424" y="2778" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用户头。</text></g><g class="source-block" id="source-57" data-source-block="57" data-kind="paragraph" data-source-line="217"><text x="112" y="2866" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">登记、登录和认证字段见附录 02，生产网关代理身份见部署、存储与规模扩展。</text></g></g><g class="panel" id="09-identity-authorization-map-isolation" data-box="80,2960,1120,324"><rect x="80" y="2960" width="1120" height="324" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="112" y="3014" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">执行环境的信任前提</text><g class="source-block" id="source-53" data-source-block="53" data-kind="paragraph" data-source-line="200"><text x="112" y="3078" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">这些接口约束正常调用路径。同进程代码可能直接读取内存，所以进程内 Go 扩展只用于明</text><text x="112" y="3122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">确受信的代码，接口检查无法提供内存隔离。不受信扩展需要独立执行环境、受控入口，以</text><text x="112" y="3166" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">及文件、网络和进程权限等隔离证据；仍拥有全部宿主权限的独立进程不足以证明强隔离。</text></g><g class="source-block" id="source-54" data-source-block="54" data-kind="paragraph" data-source-line="202"><text x="112" y="3230" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">代码发布和配置改进分别遵守管理权限，自进化也不能扩大授权或降低这些限制。</text></g></g><g class="panel" id="09-identity-authorization-map-scope" data-box="1296,744,1120,1432"><rect x="1296" y="744" width="1120" height="1432" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="1328" y="798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">安排工作与实际使用，分别检查</text><g class="source-block" id="source-07" data-source-block="07" data-kind="paragraph" data-source-line="29"><text x="1328" y="862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">允许读取《会议记录》，并不自动允许把原文发送给任意模型。系统需要同时核对使用者、</text><text x="1328" y="906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">资源、动作、用途、处理位置、接收方和期限。原任务假定已有完成各步骤所需的许可；日</text><text x="1328" y="950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">志、评测和后续复用仍按各自用途判断。</text></g><g class="source-block" id="source-08" data-source-block="08" data-kind="table" data-source-line="31"><rect x="1328" y="988" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="988" x2="1624" y2="1064" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1030" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">任务中的使用</text><text x="1640" y="1030" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">实际处理位置检查什么</text><rect x="1328" y="1064" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1064" x2="1624" y2="1184" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1106" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">读取《会议记录》和《</text><text x="1344" y="1150" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">需求说明》</text><text x="1640" y="1106" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">是否允许读取这些资源及修订，内容能否在当前处理位置使用、</text><text x="1640" y="1150" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">跨端传递。</text><rect x="1328" y="1184" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1184" x2="1624" y2="1304" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1226" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">使用摘要分组偏好</text><text x="1640" y="1226" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">是否仍允许读取并用于本次摘要；长期保存、其他用途和同步分</text><text x="1640" y="1270" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">别需要适用权限。</text><rect x="1328" y="1304" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1304" x2="1624" y2="1424" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1346" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">查找能力、调用模型</text><text x="1640" y="1346" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">目录只返回可发现的能力；发送模型输入前核对内容、用途和实</text><text x="1640" y="1390" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">际模型处理位置。</text><rect x="1328" y="1424" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1424" x2="1624" y2="1544" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1466" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">保存摘要、读回核验</text><text x="1640" y="1466" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑分别检查目标文件的写入和读取范围、当前授权及运行资</text><text x="1640" y="1510" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">格；API 和 GUI 遵守相同限制。</text><rect x="1328" y="1544" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1544" x2="1624" y2="1664" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1586" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">向手机交付文件位置与</text><text x="1344" y="1630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">来源</text><text x="1640" y="1586" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">发布端核对接收方、用途及可披露内容；界面报告“已显示”不</text><text x="1640" y="1630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">产生新权限。</text><rect x="1328" y="1664" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="1624" y1="1664" x2="1624" y2="1784" stroke="#cedae5" stroke-width="2"/><text x="1344" y="1706" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">记录日志、评测或后续</text><text x="1344" y="1750" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">复用</text><text x="1640" y="1706" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">只使用相应用途下获准的最小事实；诊断需要不能成为上传受限</text><text x="1640" y="1750" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">正文或密钥的理由。</text></g><g class="source-block" id="source-09" data-source-block="09" data-kind="paragraph" data-source-line="40"><text x="1328" y="1838" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">内核在接纳任务、委派、接纳决策和调度时检查权限，决定是否安排工作。实际处理模块在</text><text x="1328" y="1882" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">读取、写入、发送或启动动作前复核，确认此刻仍可使用资源。恢复、重连和策略变化后要</text><text x="1328" y="1926" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">重新核验；缺少 API 权限也不能改用 GUI 绕过。</text></g><g class="source-block" id="source-10" data-source-block="10" data-kind="paragraph" data-source-line="42"><text x="1328" y="1990" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">资源策略规定允许什么、禁止什么，以及谁有权补充或修改授权。授权模块据此判断请求：</text><text x="1328" y="2034" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">已有许可覆盖时直接使用，无需每次询问用户；缺少许可时，只有策略允许补充且存在有权</text><text x="1328" y="2078" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">回应者，才进入授权等待；硬性禁止则明确拒绝。许可可以限于一项操作，也可以在限定范</text><text x="1328" y="2122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">围内持续使用，后者称为持续授权，仍受期限、额度和撤销约束。</text></g></g><g class="panel" id="09-identity-authorization-map-evaluation" data-box="1296,2216,1120,412"><rect x="1296" y="2216" width="1120" height="412" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="1328" y="2270" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">怎样得出允许、拒绝或需要输入</text><g class="source-block" id="source-58" data-source-block="58" data-kind="paragraph" data-source-line="221"><text x="1328" y="2334" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权判定接口 Authorizer.Evaluate 返回允许、拒绝或需要输入，附带适用限制、策</text><text x="1328" y="2378" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">略／撤销修订和有效区间。参考实现采用 Go 内嵌判定、SQLite 持久化。处理端必须落实</text><text x="1328" y="2422" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">必要限制，无法落实时不得继续执行。</text></g><g class="source-block" id="source-59" data-source-block="59" data-kind="paragraph" data-source-line="223"><text x="1328" y="2486" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">界面路径用于解释请求，判定范围来自受信登记，使用精确资源引用、枚举集合或已登记的</text><text x="1328" y="2530" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">资源树范围。动作、用途、位置、期限、额度和委派深度分别比较；遇到未知条件、无法证</text><text x="1328" y="2574" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">明的范围关系或超出求值预算时，不产生允许结果。</text></g></g><g class="panel" id="09-identity-authorization-map-delegation" data-box="1296,2668,1120,412"><rect x="1296" y="2668" width="1120" height="412" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="1328" y="2722" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">委派只能保持或收缩权限</text><g class="source-block" id="source-32" data-source-block="32" data-kind="paragraph" data-source-line="131"><text x="1328" y="2786" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">将工作交给另一 Agent 时，只能在原授权范围内保持或收缩资源、动作、用途、位置、期</text><text x="1328" y="2830" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">限、委派深度及额度。允许写入一个文件，不能委派成管理整个目录；接收方也不能换用自</text><text x="1328" y="2874" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">己更宽的用户权限。全部上级授权的限制继续有效，分给不同接收方的额度不能重叠。</text></g><g class="source-block" id="source-33" data-source-block="33" data-kind="paragraph" data-source-line="133"><text x="1328" y="2938" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权额度和任务运行预算分别约束工作，两者都要满足。增加其中一项不会扩大另一项，缩</text><text x="1328" y="2982" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">减预算也不能抹去已经消费或尚未结算的额度。授权对象与消费记录见附录 01，管理及组</text><text x="1328" y="3026" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">件接口见附录 02。</text></g></g><g class="panel" id="09-identity-authorization-map-purpose" data-box="1296,3120,1120,608"><rect x="1296" y="3120" width="1120" height="608" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="1328" y="3174" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">用途限制贯穿每一次使用</text><g class="source-block" id="source-45" data-source-block="45" data-kind="paragraph" data-source-line="178"><text x="1328" y="3238" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">资料可以获准用于本次摘要，同时不允许长期保存或评测。用途限制覆盖记忆、模型输入、</text><text x="1328" y="3282" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">界面、日志和其他结果出口，每次使用仍须检查。策略及签发权限按资源范围配置，可在端</text><text x="1328" y="3326" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">侧或云侧；云端管理身份本身不赋予读取端侧私有原文或替端侧放宽策略的权限。</text></g><g class="source-block" id="source-46" data-source-block="46" data-kind="paragraph" data-source-line="180"><text x="1328" y="3390" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用户要求查看、纠正、删除或限制用途时，授权模块判断谁有权发起，由记忆、内容存储、</text><text x="1328" y="3434" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">界面和执行模块落实。策略收紧会阻止新的不合规使用，触发上下文失效和副本处理；已发</text><text x="1328" y="3478" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">生的事实按允许的最小范围保留。记忆失效和删除范围见上下文、记忆与证据，呈现副本与原操作恢复</text><text x="1328" y="3522" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">见应用与交互。</text></g><g class="source-block" id="source-47" data-source-block="47" data-kind="paragraph" data-source-line="182"><text x="1328" y="3586" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">修改策略时，管理入口检查主体权限、资源范围及预期修订，按原操作去重，核对不明提</text><text x="1328" y="3630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">交；查询也不能泄露隐藏资源。能力说明、网页、模型输出和 Skill 文本不能直接修改策</text><text x="1328" y="3674" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">略。</text></g></g><g class="panel" id="09-identity-authorization-map-application" data-box="2512,744,1120,584"><rect x="2512" y="744" width="1120" height="584" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="2544" y="798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">归档分支：固定新的单次申请</text><g class="source-block" id="source-11" data-source-block="11" data-kind="paragraph" data-source-line="49"><text x="2544" y="862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">摘要已经形成，原保存尚未准入，用户正式要求改存到电脑的“归档”目录。新目标是 归档/</text><text x="2544" y="906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">项目进展摘要.md，目录存在、保存能力适用，读回核验已有权限。本分支只缺少一次写入</text><text x="2544" y="950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">许可，资源策略允许该用户授予，有权签发方当前可用。</text></g><g class="source-block" id="source-12" data-source-block="12" data-kind="paragraph" data-source-line="51"><text x="2544" y="1014" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">任务先按应用与交互的目标更新规则接纳新要求，使已不适用的旧提案退出。改存使用新的保</text><text x="2544" y="1058" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">存操作，原保存的含义保持不变。授权模块据此固定申请：</text></g><g class="source-block" id="source-13" data-source-block="13" data-kind="quote" data-source-line="53"><text x="2568" y="1122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">允许本任务的指定代理，在这台电脑上，将当前这版摘要写入“归档/项目进展摘要.md”，</text><text x="2568" y="1166" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">限一次。签发时确定受资源策略约束的有限到期时间。</text><line x1="2548" y1="1096" x2="2548" y2="1184" stroke="#2e5aa8" stroke-width="2"/></g><g class="source-block" id="source-14" data-source-block="14" data-kind="paragraph" data-source-line="55"><text x="2544" y="1230" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">原先允许写入“输出”目录的授权无法派生出这份许可，需要有权签发者重新授予。执行权和</text><text x="2544" y="1274" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">签发权分别判断。更换文件、内容或用途都须重新判定，这次写入许可也不扩大读取范围。</text></g></g><g class="panel" id="09-identity-authorization-map-issuance" data-box="2512,1368,1120,1272"><rect x="2512" y="1368" width="1120" height="1272" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="2" /><rect x="2512" y="1368" width="8" height="1272" rx="0" fill="#2e5aa8" stroke="none" stroke-width="2" /><text x="2544" y="1422" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">授权存储：批准怎样变成许可</text><g class="source-block" id="source-15" data-source-block="15" data-kind="paragraph" data-source-line="60"><text x="2544" y="1486" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权模块先将申请保存为授权等待项，再交给界面显示。等待项把后续回应绑定到申请内容</text><text x="2544" y="1530" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">和版本，由授权模块负责；界面负责呈现和可靠转交。用户批准后，签发方复核回应者是否</text><text x="2544" y="1574" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">有权授予。</text></g><g class="source-block" id="source-16" data-source-block="16" data-kind="paragraph" data-source-line="62"><text x="2544" y="1638" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">批准产生的授权记录（Grant）写明谁可以在什么范围和期限内执行。授权模块在同一事务</text><text x="2544" y="1682" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">中核对申请并保存签发结果，同时将等待项标记为已消费，表示这次申请已处理、不能再次</text><text x="2544" y="1726" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用于签发。许可额度的使用由实际处理端另行登记。确认提交成功后，授权模块才交付可验</text><text x="2544" y="1770" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">证的许可材料，持久保存的通知待办（Outbox）负责继续交付。</text></g><g class="source-block" id="source-20" data-source-block="20" data-kind="paragraph" data-source-line="73"><text x="2544" y="1834" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">归档分支中的摘要记为 D，新保存为 S2，申请和回应分别为 I_auth、U_auth，新许可</text><text x="2544" y="1878" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">为 G2。</text></g><g class="source-block" id="source-21" data-source-block="21" data-kind="figure" data-source-line="75"><rect x="2544" y="1916" width="1056" height="104" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="2568" y="1956" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">授权模块</text><text x="2760" y="1954" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">等待项 I_auth 绑定 S2、申请范围和请求版本。</text><path class="connector" data-route="[(2616, 2028), (2616, 2056)]" d="M 2616,2028 L 2616,2056" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="2544" y="2056" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="2568" y="2096" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">界面／用户</text><text x="2760" y="2094" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">界面呈现并可靠转交；回应 U_auth 指向 I_auth，签发方核对主体权限及</text><text x="2760" y="2132" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">版本。</text><path class="connector" data-route="[(2616, 2172), (2616, 2200)]" d="M 2616,2172 L 2616,2200" fill="none" stroke="#51677b" stroke-width="3" marker-end="url(#09-identity-authorization-map-arrow)"/><rect x="2544" y="2200" width="1056" height="108" rx="8" fill="#f8fafc" stroke="#cedae5" stroke-width="2" /><text x="2568" y="2240" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="600" fill="#2e5aa8" text-anchor="start" xml:space="preserve">签发 → 使用</text><text x="2760" y="2238" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权存储提交 G2 后才交付；电脑核验并提交许可消费与 S2 启动准备，随后</text><text x="2760" y="2276" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">在事务外调用保存工具。</text><text x="2544" y="2368" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">硬性禁止或无有权回应者时拒绝这次申请，不能反复询问绕过限制。</text><text x="2544" y="2428" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">新保存 S2 固定目标文件和摘要 D。策略允许且有权用户可以回应时，授权模块保存申请 I_aut</text><text x="2544" y="2468" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">h；硬性禁止或没有有权回应者时拒绝。用户批准 U_auth 到达后，签发方核对主体权限，在同一</text><text x="2544" y="2508" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">事务中核对并消费等待项，保存回应、新许可 G2、额度预留、回执及通知。确认提交后才交付材</text><text x="2544" y="2548" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">料。电脑验证许可及当前资格、控制和预算，在执行存储内将许可使用记录与保存启动登记一起提</text><text x="2544" y="2588" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#51677b" text-anchor="start" xml:space="preserve">交，再在事务外调用保存工具。迟到、拒绝、冲突和提交未知见本区下方。</text></g></g><g class="panel" id="09-identity-authorization-map-uncertainty" data-box="2512,2680,1120,1332"><rect x="2512" y="2680" width="1120" height="1332" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="2544" y="2734" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">回应、签发或交接不确定时</text><g class="source-block" id="source-28" data-source-block="28" data-kind="paragraph" data-source-line="112"><text x="2544" y="2798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">签名内容固定到本次申请和预期策略。签好材料后，仍须确认提交成功；申请变化或提交冲</text><text x="2544" y="2842" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">突都可能使这份材料失去交付资格。</text></g><g class="source-block" id="source-29" data-source-block="29" data-kind="table" data-source-line="114"><rect x="2544" y="2880" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="2880" x2="2840" y2="2956" stroke="#cedae5" stroke-width="2"/><text x="2560" y="2922" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">遇到的情况</text><text x="2856" y="2922" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">处理方式</text><rect x="2544" y="2956" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="2956" x2="2840" y2="3032" stroke="#cedae5" stroke-width="2"/><text x="2560" y="2998" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">用户拒绝申请</text><text x="2856" y="2998" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">关闭相应等待项。</text><rect x="2544" y="3032" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3032" x2="2840" y2="3152" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3074" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">申请已变化，旧回应才</text><text x="2560" y="3118" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">到达</text><text x="2856" y="3074" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">旧回应失效，不能用于签发新范围的许可。</text><rect x="2544" y="3152" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3152" x2="2840" y2="3272" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3194" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">同一回应重试，或管理</text><text x="2560" y="3238" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">回包丢失</text><text x="2856" y="3194" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">沿原操作核对原回执。</text><rect x="2544" y="3272" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3272" x2="2840" y2="3392" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3314" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">材料已签好，但提交发</text><text x="2560" y="3358" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">生版本冲突</text><text x="2856" y="3314" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">不发送这份旧材料。</text><rect x="2544" y="3392" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3392" x2="2840" y2="3468" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3434" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">提交结果不明</text><text x="2856" y="3434" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">先核对原提交，不重新签发或启动。</text><rect x="2544" y="3468" width="1056" height="76" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3468" x2="2840" y2="3544" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3510" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">签发私钥不可用</text><text x="2856" y="3510" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">等待恢复，不退回未签名许可。</text><rect x="2544" y="3544" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="3544" x2="2840" y2="3664" stroke="#cedae5" stroke-width="2"/><text x="2560" y="3586" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">批准与任务暂停、取消</text><text x="2560" y="3630" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">交错</text><text x="2856" y="3586" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">分别保留事实；许可签发不解除任务控制。</text></g><g class="source-block" id="source-30" data-source-block="30" data-kind="paragraph" data-source-line="124"><text x="2544" y="3718" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">材料交付或消费结果不明时，签发方保留原预留。电脑失联不足以证明额度未用，不能因此</text><text x="2544" y="3762" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">换节点再分配一次。只有证明旧端不能再使用，且历史消费已经核对，才能回收额度；传输</text><text x="2544" y="3806" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">重发和查询原操作都不增加可用次数。</text></g><g class="source-block" id="source-31" data-source-block="31" data-kind="paragraph" data-source-line="126"><text x="2544" y="3870" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">入口把已验证的出示关系绑定到原操作。本地恢复依据这份受信记录核对当前资格，不要求</text><text x="2544" y="3914" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">原连接仍存在；更新材料不能改变保存的业务含义或期限。签名格式、受信密钥映射及证书</text><text x="2544" y="3958" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">绑定见附录 02。</text></g></g><g class="panel" id="09-identity-authorization-map-materials" data-box="2512,4052,1120,768"><rect x="2512" y="4052" width="1120" height="768" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="2544" y="4106" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">代理出示、换证与期限维护</text><g class="source-block" id="source-61" data-source-block="61" data-kind="table" data-source-line="227"><rect x="2544" y="4144" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="4144" x2="2840" y2="4220" stroke="#cedae5" stroke-width="2"/><text x="2560" y="4186" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">材料维护</text><text x="2856" y="4186" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">必须保留的关系与限制</text><rect x="2544" y="4220" width="1056" height="164" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="4220" x2="2840" y2="4384" stroke="#cedae5" stroke-width="2"/><text x="2560" y="4262" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">网络透传与代理出示</text><text x="2856" y="4262" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">普通透传保留端到端认证和原操作。确需另一节点代理出示时，</text><text x="2856" y="4306" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">有权签发方生成绑定新出示者及接收方的收缩材料，保留原发起</text><text x="2856" y="4350" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">关系和同一次保存的业务含义；默认不支持任意代理链。</text><rect x="2544" y="4384" width="1056" height="164" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="4384" x2="2840" y2="4548" stroke="#cedae5" stroke-width="2"/><text x="2560" y="4426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">证书、签发密钥与信任</text><text x="2560" y="4470" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">根轮换</text><text x="2856" y="4426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">节点换证后重绑依赖旧证书的材料。签发密钥只允许有限重叠验</text><text x="2856" y="4470" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">证期，旧材料仍受原期限和撤销约束；信任根经受信管理路径更</text><text x="2856" y="4514" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">新。</text><rect x="2544" y="4548" width="1056" height="164" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="2840" y1="4548" x2="2840" y2="4712" stroke="#cedae5" stroke-width="2"/><text x="2560" y="4590" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">期限配置</text><text x="2856" y="4590" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">许可、证书、会话、离线窗口、时钟偏差和轮换重叠期都由获准</text><text x="2856" y="4634" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">配置给出有限值，校验相互关系；缺少必要期限时不启用对应功</text><text x="2856" y="4678" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">能。</text></g><g class="source-block" id="source-62" data-source-block="62" data-kind="paragraph" data-source-line="233"><text x="2544" y="4766" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">具体配置见附录 02。</text></g></g><g class="panel" id="09-identity-authorization-map-consumption" data-box="3728,744,1120,1888"><rect x="3728" y="744" width="1120" height="1888" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="2" /><rect x="3728" y="744" width="8" height="1888" rx="0" fill="#2e5aa8" stroke="none" stroke-width="2" /><text x="3760" y="798" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="34" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">执行存储：验证、登记、再启动</text><g class="source-block" id="source-17" data-source-block="17" data-kind="paragraph" data-source-line="67"><text x="3760" y="862" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑收到带签名的材料后，先确认签发方受信、接收方是本端，且当前出示材料的节点有权</text><text x="3760" y="906" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">代表原主体，防止其他节点复制后冒用。随后核对目标文件、保存内容、用途和期限，以及</text><text x="3760" y="950" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">当前撤销状态和全部上级授权的限制。合法签名证明来源和完整性，许可此刻能否使用仍需</text><text x="3760" y="994" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">复核。</text></g><g class="source-block" id="source-18" data-source-block="18" data-kind="paragraph" data-source-line="69"><text x="3760" y="1058" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">签名不为内容保密，材料只携带必要且获准披露的范围与引用，私有正文不因签发而离端。</text></g><g class="source-block" id="source-19" data-source-block="19" data-kind="paragraph" data-source-line="71"><text x="3760" y="1122" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">这是一份单次许可。签发方在交付前预留一次额度，绑定电脑和指定保存操作。电脑将许可</text><text x="3760" y="1166" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">使用记录与保存启动准备放在同一执行存储事务中保存，核对当前授权、任务和执行者资</text><text x="3760" y="1210" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">格、控制及预算。提交确认后，才在事务外调用保存工具。使用记录说明许可已用于原操</text><text x="3760" y="1254" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">作，文件是否写入成功还要核对实际结果。</text></g><g class="source-block" id="source-22" data-source-block="22" data-kind="paragraph" data-source-line="77"><text x="3760" y="1318" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权、任务和界面各自保存状态，通过持久交接取得结果，没有跨三者的共同事务。</text></g><g class="source-block" id="source-23" data-source-block="23" data-kind="paragraph" data-source-line="84"><text x="3760" y="1382" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">两个执行者同时收到请求时，可能都会判定“一次许可有效”。授权判定本身不记录消费，实</text><text x="3760" y="1426" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">际处理端必须登记许可用于哪个操作。否则，重复请求就可能再次使用这份许可。</text></g><g class="source-block" id="source-24" data-source-block="24" data-kind="paragraph" data-source-line="86"><text x="3760" y="1490" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">签发端在事务内核对等待项及版本，避免核对后申请又被修改；执行端把许可消费与启动准</text><text x="3760" y="1534" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">备绑定，供重复请求和恢复者查找。两端分别提交：</text></g><g class="source-block" id="source-25" data-source-block="25" data-kind="table" data-source-line="88"><rect x="3760" y="1572" width="1056" height="76" rx="0" fill="#f4f7fa" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="1572" x2="4056" y2="1648" stroke="#cedae5" stroke-width="2"/><text x="3776" y="1614" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">提交位置</text><text x="4072" y="1614" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="600" fill="#24384b" text-anchor="start" xml:space="preserve">同一事务中的核对与记录</text><rect x="3760" y="1648" width="1056" height="120" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="1648" x2="4056" y2="1768" stroke="#cedae5" stroke-width="2"/><text x="3776" y="1690" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">授权存储（Authori</text><text x="3776" y="1734" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">zationStore）</text><text x="4072" y="1690" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">核对等待项及版本，记录回应，消费等待项，保存授权记录、必</text><text x="4072" y="1734" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">要的额度预留、管理回执和待发送通知。</text><rect x="3760" y="1768" width="1056" height="164" rx="0" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><line x1="4056" y1="1768" x2="4056" y2="1932" stroke="#cedae5" stroke-width="2"/><text x="3776" y="1810" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">电脑执行存储</text><text x="4072" y="1810" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">复核当前授权、已知撤销、有效期、任务／执行者资格、控制和</text><text x="4072" y="1854" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">预算；校验许可绑定本端、原操作及固定语义；保存许可消费、</text><text x="4072" y="1898" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">启动准备和恢复工作。</text></g><g class="source-block" id="source-26" data-source-block="26" data-kind="paragraph" data-source-line="93"><text x="3760" y="1986" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">伪代码只说明执行端的启动顺序，省略完整认证字段和恢复算法。查询原操作也须先检查权</text><text x="3760" y="2030" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="26" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">限；已有启动记录时恢复原操作，不再消费一次许可。</text></g><g class="source-block" id="source-27" data-source-block="27" data-kind="code" data-source-line="95"><rect x="3760" y="2068" width="1056" height="520" rx="8" fill="#f4f7fa" stroke="none" stroke-width="2" /><text x="3776" y="2104" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">准备执行这次保存：</text><text x="3776" y="2144" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">  验证当前身份及查询原操作的权限</text><text x="3776" y="2184" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">  若已有启动登记：</text><text x="3776" y="2224" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    核对原操作，不重复消费或盲目启动</text><text x="3776" y="2264" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    转入原操作恢复，结束本次启动流程</text><text x="3776" y="2304" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">  否则，在执行存储事务中：</text><text x="3776" y="2344" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    复核当前授权、已知撤销及有效期</text><text x="3776" y="2384" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    核对任务／执行者资格、控制和预算</text><text x="3776" y="2424" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    校验许可绑定本端、原操作及固定语义</text><text x="3776" y="2464" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">    原子保存许可消费、启动准备与恢复工作</text><text x="3776" y="2504" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">  提交不明时先核对原提交</text><text x="3776" y="2544" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="24" font-weight="400" fill="#24384b" text-anchor="start" xml:space="preserve">  确认提交后，在事务外调用保存工具</text></g></g><g class="panel" id="09-identity-authorization-map-other-consumers" data-box="3728,2672,1120,304"><rect x="3728" y="2672" width="1120" height="304" rx="8" fill="#ffffff" stroke="#cedae5" stroke-width="2" /><text x="3760" y="2726" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27
