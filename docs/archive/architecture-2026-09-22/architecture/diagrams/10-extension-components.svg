<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="664" viewBox="0 0 1120 664" role="img" aria-labelledby="10-extension-components-title 10-extension-components-desc" style="font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
<title id="10-extension-components-title">激活实现与执行业务分别留什么记录</title><desc id="10-extension-components-desc">扩展管理协调运行器准备候选，将激活修订保存到扩展存储并交给目录等投影；任务与执行模块只使用已应用且获准的绑定，保存自己的原操作与恢复事实。</desc>
<defs>
        <marker id="10-extension-components-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#53667e"/></marker>
        <marker id="10-extension-components-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="10-extension-components-arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#245c9c"/></marker>
        <marker id="10-extension-components-arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#53667e" stroke-width="1.5"/></marker>
        </defs><rect width="1120" height="664" fill="#fff"/>
<text x="40" y="42" font-size="28" fill="#233247" text-anchor="start" font-weight="600">激活实现与执行业务分别留什么记录</text><text x="40" y="76" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">组件关系：候选准备就绪后提交激活，投影应用后才允许选择绑定。</text><line x1="40" y1="612" x2="1080" y2="612" stroke="#dae3ed"/><text x="40" y="640" font-size="18" fill="#53667e" text-anchor="start" font-weight="400">实线为管理调用、修订交接或绑定使用，虚线为准备结果；业务操作仍由所属模块保存与恢复。</text><path d="M440,180 L280,180" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#10-extension-components-arrow)"/><path d="M280,232 L440,232" fill="none" stroke="#53667e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#10-extension-components-arrow)"/><path d="M720,192 L880,192" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#10-extension-components-arrow)"/><path d="M580,256 L580,440" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#10-extension-components-arrow)"/><path d="M980,256 L980,440" fill="none" stroke="#53667e" stroke-width="1.7" marker-end="url(#10-extension-components-arrow)"/><g data-node="ExtensionRuntime" data-bounds="40,144,240,112"><rect x="40" y="144" width="240" height="112" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="160.0" y="194.5" font-size="20" fill="#233247" text-anchor="middle" font-weight="600">ExtensionRuntime</text><text x="160.0" y="221.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">准备、启动、检查、停止</text></g><g data-node="ExtensionManager" data-bounds="440,144,280,112"><rect x="440" y="144" width="280" height="112" rx="6" fill="#f0f6fc" stroke="#245c9c" stroke-width="1.5"/><text x="580.0" y="195.5" font-size="22" fill="#245c9c" text-anchor="middle" font-weight="600">ExtensionManager</text><text x="580.0" y="222.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">管理原操作与激活修订</text></g><g data-node="目录等投影" data-bounds="880,144,200,112"><rect x="880" y="144" width="200" height="112" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="980.0" y="195.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">目录等投影</text><text x="980.0" y="222.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">同一激活修订</text></g><g data-node="ExtensionStore" data-bounds="440,440,280,112"><path d="M440,453 Q440,440 580.0,440 Q720,440 720,453 V539 Q720,552 580.0,552 Q440,552 440,539 Z" fill="#f5f8fb" stroke="#b8c8da" stroke-width="1.5"/><path d="M440,453 Q580.0,474 720,453" fill="none" stroke="#b8c8da" stroke-width="1.2"/><text x="580.0" y="497.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">ExtensionStore</text><text x="580.0" y="524.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">锁定、验证、激活与回执</text></g><g data-node="任务与执行" data-bounds="880,440,200,112"><rect x="880" y="440" width="200" height="112" rx="6" fill="#ffffff" stroke="#b8c8da" stroke-width="1.5"/><text x="980.0" y="491.5" font-size="22" fill="#233247" text-anchor="middle" font-weight="600">任务与执行</text><text x="980.0" y="518.5" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">固定原工作版本</text></g><text x="40" y="466" font-size="19" fill="#53667e" text-anchor="start" font-weight="400">实例就绪、激活已提交、</text><text x="40" y="500" font-size="19" fill="#53667e" text-anchor="start" font-weight="400">投影已应用分别确认。</text><g data-label="true" data-bounds="314.0,142,92,29"><rect x="314.0" y="142" width="92" height="29" rx="3" fill="#fff"/><text x="360" y="164" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">准备实例</text></g><g data-label="true" data-bounds="314.0,194,92,29"><rect x="314.0" y="194" width="92" height="29" rx="3" fill="#fff"/><text x="360" y="216" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">就绪结果</text></g><g data-label="true" data-bounds="754.0,154,92,29"><rect x="754.0" y="154" width="92" height="29" rx="3" fill="#fff"/><text x="800" y="176" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">激活修订</text></g><g data-label="true" data-bounds="616.0,330,56,29"><rect x="616.0" y="330" width="56" height="29" rx="3" fill="#fff"/><text x="644" y="352" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">提交</text></g><g data-label="true" data-bounds="1003.0,322,74,29"><rect x="1003.0" y="322" width="74" height="29" rx="3" fill="#fff"/><text x="1040" y="344" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">已应用</text></g><g data-label="true" data-bounds="1012.0,350,56,29"><rect x="1012.0" y="350" width="56" height="29" rx="3" fill="#fff"/><text x="1040" y="372" font-size="18" fill="#53667e" text-anchor="middle" font-weight="400">绑定</text></g></svg>