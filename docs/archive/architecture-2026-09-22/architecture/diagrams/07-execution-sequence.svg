<?xml version="1.0" encoding="UTF-8"?>
<svg id="07-execution-sequence" viewBox="0 0 960 1280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-execution-sequence-title 07-execution-sequence-desc">
<title id="07-execution-sequence-title">异步操作怎样取得可确认的结果</title>
<desc id="07-execution-sequence-desc">内核派发原操作，执行端原子保存接纳记录与工作后返回 ACCEPTED。启动前检查当前条件，持久保存恢复时可能已经发出的准备记录，再在事务外调用 Driver 与目标系统。正常收到外部作业引用 后先保存关联与查询工作，再通过 Inspect 查询原作业。执行端取得目标操作完成的证据，将结果和报告 Outbox 原子保存后报告内核。内核核对报告及当前条件，再推进依赖已满足的工作。启动回执丢失时，解释回执丢失后能否按原操作核对。图中的方框表示本地记录步骤，不包含外部调用。</desc>
