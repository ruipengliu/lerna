<path class="connector" data-from="reconcile" data-to="settled" data-kind="call" data-route="800,248 800,352" d="M 800,248 L 800,352" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#07-resource-takeover-arrow)"/>
