<path class="connector" data-from="resume" data-to="observe" data-kind="call" data-route="360,644 280,644" d="M 360,644 L 280,644" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#07-resource-takeover-arrow)"/>
