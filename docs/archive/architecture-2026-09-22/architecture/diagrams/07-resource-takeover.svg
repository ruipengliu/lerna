<?xml version="1.0" encoding="UTF-8"?>
<svg id="07-resource-takeover" viewBox="0 0 960 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-resource-takeover-title 07-resource-takeover-desc">
<title id="07-resource-takeover-title">用户接管之后，自动化怎样停住与恢复</title>
<desc id="07-resource-takeover-desc">执行协调方持久接纳获准的接管意图与控制版本，阻止范围内各自动化来源的新变更。已登记的在途动作继续请求停止并核对；相关动作未停止或未完成处置时，只能报告接管仍在落实。能力不足时明确限制，不能宣称已独占控制。接管落实并保持后，用户可以改变受控资源；后续获准 RESUME 仍不清除任务暂停或取消，必须重新观察当前页面、核对旧动作并作出新判断，不能沿旧坐标继续点击。此图只覆盖 Harness 能控制的路径，不承诺锁住第三方写入。</desc>
<defs><marker id="07-resource-takeover-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="07-resource-takeover-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="960" height="776" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="40" y="44" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">用户接管之后，自动化怎样停住与恢复</text><text x="40" y="76" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">以 GUI 控制范围为例：获准接管已被受理，仍需处置在途动作</text><path class="connector" data-from="takeover" data-to="block" data-kind="call" data-route="280,196 360,196" d="M 280,196 L 360,196" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#07-resource-takeover-arrow)"/>
