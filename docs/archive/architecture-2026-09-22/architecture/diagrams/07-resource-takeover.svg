<path class="connector" data-from="pending" data-to="block" data-kind="return" data-route="480,352 480,248" d="M 480,352 L 480,248" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#07-resource-takeover-arrow)"/>
<path class="connector" data-from="settled" data-to="applied" data-kind="call" data-route="800,480 800,592" d="M 800,480 L 800,592" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#07-resource-takeover-arrow)"/>
