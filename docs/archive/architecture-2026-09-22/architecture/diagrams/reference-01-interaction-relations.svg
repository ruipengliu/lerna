<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" role="img" aria-labelledby="reference-01-interaction-relations-title reference-01-interaction-relations-desc">
<title id="reference-01-interaction-relations-title">等待项、显示界面与输入路由</title>
<desc id="reference-01-interaction-relations-desc">Surface 保存显示状态，可呈现多个等待项；一个等待项也可由多个 Surface 呈现。ActionRoute 固定从某界面提交的操作、业务目标与输入语义，可选关联一个等待项。路由已保存时，目标业务可以尚未接纳；跨界面重试复用原路由，不重绑原界面引用。操作由登记处理方接纳，UI 自有偏好可由 SurfaceStore 处理。独立表单可以没有等待项。</desc>
<rect x="0" y="0" width="960" height="696" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="40" y="46" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">等待项、显示界面与输入路由</text><text x="40" y="80" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">同一等待项可以在多端呈现；正式输入沿同一个 operation_id 转交业务模块</text><path class="connector" data-from="surface" data-to="interaction" data-route="280,176 680,176" d="M 280,176 L 680,176" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
<path class="connector" data-from="surface" data-to="route" data-route="160,260 160,452" d="M 160,260 L 160,452" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
