<g class="node" data-key="operation" data-box="680,452,240,148"><rect x="680" y="452" width="240" height="148" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="696" y="482" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="18" font-weight="600" fill="#2d3142" text-anchor="start">业务操作 Operation</text><line x1="680" y1="496" x2="920" y2="496" stroke="#cbd5e1"/><text x="696" y="522" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">同一 operation_id</text><text x="696" y="544" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">固定业务意图</text><text x="696" y="566" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start">接纳与结果另行核对</text></g><line x1="40" y1="636" x2="920" y2="636" stroke="#cbd5e1"/><text x="40" y="666" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Noto Sans SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif" font-size="13" font-weight="400" fill="#4f5d75" text-anchor="start">SurfaceStore 保存显示与路由；所属处理方保存等待项及消费结果。路由存在不等于业务已接纳。</text>
</svg>
