<p>当前任务的目标、约束与运行事实，已取得的来源证据，以及获准且适用的记忆进入本轮组装。组装器按用途、适用性、新鲜度和预算组织输入，保留约束与来源。必要输入不可用或无法容纳时明确报告；满足条件时形成上下文快照，发送前仍要复核来源与模型容量。记忆按类型及来源参与决策；偏好不补充事实，记忆不能改写权威运行事实。</p><p><a href="../main/02-subsystems/02-context-and-memory.md">返回上下文、记忆与证据</a></p>
