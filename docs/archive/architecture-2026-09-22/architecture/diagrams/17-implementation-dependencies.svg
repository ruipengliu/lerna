<svg id="17-implementation-dependencies" viewBox="0 0 960 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="17-implementation-dependencies-title 17-implementation-dependencies-desc">
<title id="17-implementation-dependencies-title">运行底座与评测准备，按依赖展开</title>
<desc id="17-implementation-dependencies-desc">跨节点、扩展与替换需要可运行的三系统及基础交互，模型质量基线同时需要该运行对象和独立数据真值，而运行底座、评测计划与判定器都依赖版本化契约、SDK 和可调用夹具；评测准备可以提前进行，本图只展示主要前置关系，不表示阶段已通过或实现已经存在。</desc>
