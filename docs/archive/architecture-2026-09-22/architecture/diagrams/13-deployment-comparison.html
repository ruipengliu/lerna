<p>开发机运行 Go 内核与三系统、SQLite 和有状态模拟手机与电脑；生产方案中手机经受信 Gateway 提交请求，归属目录定位用户 A 的 Cell A 与分片 A1，云侧工作池持有任务 T，电脑独立保存 S、作业 J、读回 R 和文件 D。图是配置对照，合并呈现池内实例及主要调用路径，不表示在途数据库迁移或已经通过容量验收。</p><p><a href="../main/04-engineering/02-deployment-and-storage.md">返回部署、存储与规模扩展</a></p>
