<?xml version="1.0" encoding="UTF-8"?>
<svg id="13-storage-layers" viewBox="0 0 960 992" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="13-storage-layers-title 13-storage-layers-desc">
<title id="13-storage-layers-title">权威事实、正文与投影按用途分开保存</title>
<desc id="13-storage-layers-desc">云侧各 Store 分别在自己的局部事务内保存当前状态、未决工作、预算、有效回执与交接水位；电脑保存 S、J、R 的执行记录和文件 D。历史按保留条件归档，获准正文通过受控引用访问；Kafka 分发变更，索引和缓存结合权威快照重建，不能替代业务事实、授权或余额。</desc>
<defs><marker id="13-storage-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="13-storage-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="13-storage-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="13-storage-layers-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
