<svg id="14-durable-failover" viewBox="0 0 960 1424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="14-durable-failover-title 14-durable-failover-desc">
<title id="14-durable-failover-title">当前权威与耐久确认齐备，才开放派发</title>
<desc id="14-durable-failover-desc">原准入变更 C 在旧主本地可见，但同步确认等待被取消；扫描器只取得候选，不派发 S。旧主故障后，HA 在取得仲裁与旧主隔离证据后提升合格同步副本。应用重连到新权威，核对原 C 并建立耐久确认，再条件领取原工作并取得耐久成功回执。当前资格、控制、权限、依赖、期限和预算仍满足时才允许派发原 S，电脑执行端继续独立检查。图归并 Store 内部确认事务与复制交接；任一条件不足时保持等待，其他结果见正文。</desc>
<defs><marker id="14-durable-failover-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="14-durable-failover-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="14-durable-failover-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="14-durable-failover-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
