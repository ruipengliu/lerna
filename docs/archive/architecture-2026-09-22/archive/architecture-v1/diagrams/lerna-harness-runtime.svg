<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-title runtime-desc"><title id="runtime-title">任务运行：从提案到可核对结果</title><desc id="runtime-desc">任务快照经上下文与大脑产生提案，内核准入并原子持久化，Worker 执行后核对事实再更新任务。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="runtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="runtime-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="runtime-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M360 128 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="380" y="88" width="80" height="24" fill="#f5f5f5"/><text x="420" y="104" text-anchor="middle" class="edge-label">组织信息</text><path d="M800 128 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="820" y="88" width="80" height="24" fill="#f5f5f5"/><text x="860" y="104" text-anchor="middle" class="edge-label">受控输入</text><path d="M1080 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="1104" y="232" width="80" height="24" fill="#f5f5f5"/><text x="1144" y="248" text-anchor="middle" class="edge-label">提交提案</text><path d="M920 352 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="820" y="312" width="80" height="24" fill="#f5f5f5"/><text x="860" y="328" text-anchor="middle" class="edge-label">整批准入</text><path d="M480 352 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="380" y="312" width="80" height="24" fill="#f5f5f5"/><text x="420" y="328" text-anchor="middle" class="edge-label">持久工作</text><path d="M200 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="224" y="456" width="80" height="24" fill="#f5f5f5"/><text x="264" y="472" text-anchor="middle" class="edge-label">调度执行</text><path d="M360 576 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="366" y="536" width="108" height="24" fill="#f5f5f5"/><text x="420" y="552" text-anchor="middle" class="edge-label">结果 / 句柄</text><path d="M800 576 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/><rect x="820" y="536" width="80" height="24" fill="#f5f5f5"/><text x="860" y="552" text-anchor="middle" class="edge-label">确认事实</text><g class="node" data-kind="store"><rect x="40" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="64" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="56" y="88" class="tag">TASK SNAPSHOT</text><text x="56" y="116" class="node-name">任务快照</text><text x="56" y="144" class="node-body">目标、约束、状态版本</text><text x="56" y="168" class="node-body">原有操作、控制意图、剩余预算</text></g><g class="node" data-kind="backend"><rect x="480" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="88" class="tag">CONTEXT ASSEMBLY</text><text x="496" y="116" class="node-name">上下文组装</text><text x="496" y="144" class="node-body">进展、证据、相关记忆</text><text x="496" y="168" class="node-body">来源修订与数据处理位置复核</text></g><g class="node" data-kind="backend"><rect x="920" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="88" class="tag">Brain.Decide</text><text x="936" y="116" class="node-name">大脑与模型</text><text x="936" y="144" class="node-body">完整的有限提案 / 等待 / 结果</text><text x="936" y="168" class="node-body">输出格式修复有界；用量可追踪</text></g><g class="node" data-kind="focal"><rect x="920" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="288" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="312" class="tag">ADMISSION</text><text x="936" y="340" class="node-name">决策准入</text><text x="936" y="368" class="node-body">能力与参数、版本、权限、预算</text><text x="936" y="392" class="node-body">过期提案拒绝；重新读取再决策</text></g><g class="node" data-kind="store"><rect x="480" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="288" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="496" y="312" class="tag">RunStore.Commit</text><text x="496" y="340" class="node-name">任务级原子提交</text><text x="496" y="368" class="node-body">新状态 + 执行记录 + 持久工作</text><text x="496" y="392" class="node-body">预期版本、拥有者世代、变更回执</text></g><g class="node" data-kind="backend"><rect x="40" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="312" class="tag">CLAIM / RENEW</text><text x="56" y="340" class="node-name">调度与 Worker</text><text x="56" y="368" class="node-body">领取、续租、完成确认</text><text x="56" y="392" class="node-body">旧领取代次的推进被拒绝</text></g><g class="node" data-kind="backend"><rect x="40" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="536" class="tag">EXECUTION</text><text x="56" y="564" class="node-name">受控能力执行</text><text x="56" y="592" class="node-body">原操作身份；执行端再次准入</text><text x="56" y="616" class="node-body">动作可能已发生而回执丢失</text></g><g class="node" data-kind="focal"><rect x="480" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="512" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="496" y="536" class="tag">RECONCILIATION</text><text x="496" y="564" class="node-name">效果核对与事实归并</text><text x="496" y="592" class="node-body">观察目标状态；核对原操作</text><text x="496" y="616" class="node-body">未知效果不得直接重新执行</text></g><g class="node" data-kind="backend"><rect x="920" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="536" class="tag">TASK PROGRESSION</text><text x="936" y="564" class="node-name">内核更新与结果交付</text><text x="936" y="592" class="node-body">继续决策 / 等待 / 终态</text><text x="936" y="616" class="node-body">未决效果保留；发布前检查依据</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text></svg>
