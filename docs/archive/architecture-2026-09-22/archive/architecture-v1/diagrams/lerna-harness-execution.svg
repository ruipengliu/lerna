<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="execution-title execution-desc"><title id="execution-title">执行架构：发现、准入与效果确认分开</title><desc id="execution-desc">大脑通过受控目录发现能力，内核接纳有限行动，执行模块绑定凭证并经驱动调用目标，核对证据后将事实交回内核。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="execution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="execution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="execution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M360 128 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#execution-arrow)"/><rect x="380" y="88" width="80" height="24" fill="#f5f5f5"/><text x="420" y="104" text-anchor="middle" class="edge-label">候选定义</text><path d="M800 128 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#execution-arrow)"/><rect x="820" y="88" width="80" height="24" fill="#f5f5f5"/><text x="860" y="104" text-anchor="middle" class="edge-label">有限行动</text><path d="M1080 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#execution-arrow)"/><rect x="1104" y="232" width="80" height="24" fill="#f5f5f5"/><text x="1144" y="248" text-anchor="middle" class="edge-label">调度请求</text><path d="M920 352 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#execution-arrow)"/><rect x="820" y="312" width="80" height="24" fill="#f5f5f5"/><text x="860" y="328" text-anchor="middle" class="edge-label">许可范围</text><path d="M480 352 H360" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#execution-arrow-link)"/><rect x="380" y="312" width="80" height="24" fill="#f5f5f5"/><text x="420" y="328" text-anchor="middle" class="edge-label">目标调用</text><path d="M200 416 V512" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#execution-arrow-link)"/><rect x="228" y="456" width="80" height="24" fill="#f5f5f5"/><text x="268" y="472" text-anchor="middle" class="edge-label">目标状态</text><path d="M360 576 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#execution-arrow)"/><rect x="380" y="536" width="80" height="24" fill="#f5f5f5"/><text x="420" y="552" text-anchor="middle" class="edge-label">效果依据</text><path d="M800 576 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#execution-arrow)"/><rect x="820" y="536" width="80" height="24" fill="#f5f5f5"/><text x="860" y="552" text-anchor="middle" class="edge-label">核对结果</text><g class="node" data-kind="backend"><rect x="40" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="88" class="tag">List / Search / Describe</text><text x="56" y="116" class="node-name">能力目录</text><text x="56" y="144" class="node-body">超过 1000 个独立业务 API 为目标</text><text x="56" y="168" class="node-body">权限过滤；候选检索；按需 Schema</text></g><g class="node" data-kind="backend"><rect x="480" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="88" class="tag">DECISION PROPOSAL</text><text x="496" y="116" class="node-name">Brain 行动提案</text><text x="496" y="144" class="node-body">能力版本、目标资源、参数与依赖</text><text x="496" y="168" class="node-body">不得使用未准入的私有工具循环</text></g><g class="node" data-kind="focal"><rect x="920" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="64" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="88" class="tag">ADMISSION</text><text x="936" y="116" class="node-name">内核行动准入</text><text x="936" y="144" class="node-body">任务版本、预算、数据位置与权限</text><text x="936" y="168" class="node-body">保存操作意图；绑定能力与实现版本</text></g><g class="node" data-kind="focal"><rect x="920" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="288" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="312" class="tag">EXECUTION GATE</text><text x="936" y="340" class="node-name">执行接纳与资源控制</text><text x="936" y="368" class="node-body">去重记录、当前授权与控制版本</text><text x="936" y="392" class="node-body">单次授权消费；接管阻止冲突动作</text></g><g class="node" data-kind="backend"><rect x="480" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="312" class="tag">CREDENTIAL / DRIVER</text><text x="496" y="340" class="node-name">凭证绑定与受信驱动</text><text x="496" y="368" class="node-body">凭证引用绑定服务、账号与用途</text><text x="496" y="392" class="node-body">真实凭证仅供获准执行路径使用</text></g><g class="node" data-kind="external"><rect x="40" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="288" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="312" class="tag">TARGET SYSTEM</text><text x="56" y="340" class="node-name">目标 API 或模拟设备</text><text x="56" y="368" class="node-body">API 优先；GUI 观察与操作闭环</text><text x="56" y="392" class="node-body">异步句柄、业务状态与故障注入</text></g><g class="node" data-kind="backend"><rect x="40" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="536" class="tag">OBSERVE / RECONCILE</text><text x="56" y="564" class="node-name">核对目标效果</text><text x="56" y="592" class="node-body">查询原操作或观察业务状态</text><text x="56" y="616" class="node-body">结果未知时先核对，禁止盲目重做</text></g><g class="node" data-kind="store"><rect x="480" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="512" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="496" y="536" class="tag">CONTENT / ARTIFACT</text><text x="496" y="564" class="node-name">受控证据与产物</text><text x="496" y="592" class="node-body">来源、时间、类型与可用性</text><text x="496" y="616" class="node-body">按授权读取引用，正文按需取得</text></g><g class="node" data-kind="backend"><rect x="920" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="536" class="tag">OPERATION FACTS</text><text x="936" y="564" class="node-name">执行事实返回内核</text><text x="936" y="592" class="node-body">已接纳 / 已执行 / 效果已确认</text><text x="936" y="616" class="node-body">异步完成、取消竞态与冲突保留</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text><line x1="904" y1="692" x2="928" y2="692" stroke="#4f5d75" stroke-width="2" stroke-dasharray="4,4"/><text x="940" y="696" class="legend">虚线：反馈 / 恢复</text></svg>
