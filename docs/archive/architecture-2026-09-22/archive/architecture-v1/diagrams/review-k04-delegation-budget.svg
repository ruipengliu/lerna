<title id="review-k04-delegation-budget-title">K04 · 授权收缩与预算安全分配</title>
<desc id="review-k04-delegation-budget-desc">父端在可证明的授权收缩下预留预算，子端唯一接纳并独立消费；未知交付和消耗不释放额度。</desc>
