    participant S as 客户端 SDK
    participant G as 网关
    participant C as 对应核心与持久工作
    S-&gt;&gt;S: 步骤 1 · 持久点 1&lt;br/&gt;分配命令标识，持久保存不可变信封
    Note over S: 只能报告设备已保存
    S-&gt;&gt;G: 步骤 2 · 投递原命令
    G-&gt;&gt;C: 转交命令与可信身份上下文
    Note over S,C: 写调用返回不产生持久确认
    C-&gt;&gt;C: 步骤 3 · 校验身份、格式与保存权利
    alt 同步命令
        C-&gt;&gt;C: 步骤 3 与 5 · 持久点 2 和持久点 4 同一事务&lt;br/&gt;命令记录、事实变更、决定、待办与后续交接
        C—&gt;&gt;G: 决定回执
        G—&gt;&gt;S: 转交决定回执
        S-&gt;&gt;S: 步骤 4 · 持久点 3 保存核心回执
    else 异步命令
        C-&gt;&gt;C: 步骤 3 · 持久点 2&lt;br/&gt;受理记录与待办原子保存
        C—&gt;&gt;G: 受理回执
        G—&gt;&gt;S: 转交受理回执
        par 客户端保存
            S-&gt;&gt;S: 步骤 4 · 持久点 3 保存核心回执
        and 核心按当前事实裁决
            C-&gt;&gt;C: 步骤 5 · 持久点 4&lt;br/&gt;事实变更、命令决定与后续交接原子保存
        end
    end
    S-&gt;&gt;G: 步骤 6 · 查询原命令或订阅事实视图
    G-&gt;&gt;C: 向事实负责方查询
    C—&gt;&gt;S: 经网关返回原决定或事实视图
