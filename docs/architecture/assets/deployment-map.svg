<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-map-title deployment-map-desc" id="deployment-map-root">
<title id="deployment-map-title">任务在云端，本机效果在端侧</title>
<desc id="deployment-map-desc">默认部署把任务裁决放在云端，把本机执行管理与出口放在设备上，网关搬运命令和回执，责任按原标识跨域交接。</desc>
<defs>
<marker id="deployment-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
</marker>
<marker id="deployment-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
</marker>
<marker id="deployment-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
</marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="56" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">任务在云端，本机效果在端侧</text>
<text x="48" y="88" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">按位置分区的架构图 · 进程可接替，任务负责方与执行端点保持固定</text>
