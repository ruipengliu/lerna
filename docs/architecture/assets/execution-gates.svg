<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="execution-gates-title execution-gates-desc" id="execution-gates-root">
<title id="execution-gates-title">四道门禁，各自回答一个问题</title>
<desc id="execution-gates-desc">动作经过准入、执行管理接纳、开始核验和发送后记录效果，结果未知的安全重发回到开始门禁，任务成功另经完成门禁。</desc>
<defs>
<marker id="execution-gates-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
</marker>
<marker id="execution-gates-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
</marker>
<marker id="execution-gates-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
</marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="56" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">四道门禁，各自回答一个问题</text>
<text x="48" y="88" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">仅画通过后的主线 · 重试是条件性回路；拒绝、等待与非成功关闭见正文</text>
<path data-connector="true" d="M 224,236 L 288,236" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#execution-gates-arrow)"/>
