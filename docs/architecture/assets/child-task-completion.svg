<title id="child-task-completion-title">父子任务的完成衔接</title>
<desc id="child-task-completion-desc">父子任务的完成衔接，保留原消息、条件与持久化顺序。</desc>
<defs>
      <style>
      #child-task-completion-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #child-task-completion-root .diagram-container { width:100%;overflow-x:auto }
      #child-task-completion-root .diagram-container { overflow-x:visible }</style><marker id="child-task-completion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="child-task-completion-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="child-task-completion-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="1280" height="1052" rx="0" fill="#f5f5f5" /><text x="40" y="56" font-family="&#x27;Instrument Serif&#x27;, &#x27;Noto Serif SC&#x27;, &#x27;Songti SC&#x27;, serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start" >父子任务的完成衔接</text><text x="40" y="88" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start" >按原消息顺序接续；本图显示本阶段涉及的参与者</text>
