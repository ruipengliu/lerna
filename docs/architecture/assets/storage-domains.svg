<rect class="node-surface" x="880" y="160" width="288" height="96" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
<rect x="892" y="172" width="52" height="16" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="0.8"/>
<text x="918.0" y="183" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="middle">核心</text>
<text x="896" y="208" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">云端执行管理域</text>
<text x="896" y="232" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">可共库；保留独立事务与持久工作</text>
</g>
<g data-node="local-ledger" data-kind="store">
<rect x="880" y="288" width="288" height="96" rx="6" fill="#f5f5f5"/>
