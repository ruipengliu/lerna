<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evolution-title evolution-desc"><title id="evolution-title">扩展与自进化：版本化接入，依据评测生效</title><desc id="evolution-desc">插件、Skill 和 Agent 登记固定版本并验证，按权限激活供新工作使用，运行证据支持隔离评测及受控改进与回滚。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="evolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="evolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="evolution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M360 128 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="380" y="88" width="80" height="24" fill="#f5f5f5"/><text x="420" y="104" text-anchor="middle" class="edge-label">导入登记</text><path d="M800 128 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="820" y="88" width="80" height="24" fill="#f5f5f5"/><text x="860" y="104" text-anchor="middle" class="edge-label">通过验证</text><path d="M1080 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="1104" y="232" width="96" height="24" fill="#f5f5f5"/><text x="1152" y="248" text-anchor="middle" class="edge-label">逐节点生效</text><path d="M920 352 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#evolution-arrow)"/><rect x="820" y="312" width="80" height="24" fill="#f5f5f5"/><text x="860" y="328" text-anchor="middle" class="edge-label">受控记录</text><path d="M200 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="224" y="456" width="80" height="24" fill="#f5f5f5"/><text x="264" y="472" text-anchor="middle" class="edge-label">固定条件</text><path d="M560 416 V456 Q560 464 552 464 H288 Q280 464 280 472 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="380" y="432" width="80" height="24" fill="#f5f5f5"/><text x="420" y="448" text-anchor="middle" class="edge-label">运行证据</text><path d="M360 576 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="380" y="536" width="80" height="24" fill="#f5f5f5"/><text x="420" y="552" text-anchor="middle" class="edge-label">差距依据</text><path d="M800 576 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/><rect x="812" y="536" width="96" height="24" fill="#f5f5f5"/><text x="860" y="552" text-anchor="middle" class="edge-label">评测后审批</text><g class="node" data-kind="input"><rect x="40" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="64" width="320" height="128" rx="8" fill="#4f5d75" fill-opacity="0.10" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="88" class="tag">EXTENSION INPUT</text><text x="56" y="116" class="node-name">插件、Skill 与 Agent</text><text x="56" y="144" class="node-body">实现 / 可复用流程 / 自主任务主体</text><text x="56" y="168" class="node-body">MCP、A2A、Agent Skills 按需适配</text></g><g class="node" data-kind="backend"><rect x="480" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="88" class="tag">REGISTRY / MANIFEST</text><text x="496" y="116" class="node-name">登记、锁定与验证</text><text x="496" y="144" class="node-body">来源、版本、摘要、依赖、Schema</text><text x="496" y="168" class="node-body">权限请求、处理位置和恢复兼容</text></g><g class="node" data-kind="focal"><rect x="920" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="64" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="88" class="tag">ACTIVATION / RUNNER</text><text x="936" y="116" class="node-name">授权激活与运行器</text><text x="936" y="144" class="node-body">受信 Go；gRPC；受限 Wasm</text><text x="936" y="168" class="node-body">运行限制不满足时拒绝加载</text></g><g class="node" data-kind="backend"><rect x="920" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="312" class="tag">RUNTIME VERSION</text><text x="936" y="340" class="node-name">新工作使用固定版本</text><text x="936" y="368" class="node-body">在途工作保留旧能力及内容版本</text><text x="936" y="392" class="node-body">停止新接纳、收尾、停用与隔离</text></g><g class="node" data-kind="store"><rect x="480" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="288" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="496" y="312" class="tag">OBSERVATION</text><text x="496" y="340" class="node-name">运行事实与观测</text><text x="496" y="368" class="node-body">task_ref / operation_id / version</text><text x="496" y="392" class="node-body">错误、耗时、用量和最小必要引用</text></g><g class="node" data-kind="backend"><rect x="40" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="312" class="tag">EVALUATION PLAN</text><text x="56" y="340" class="node-name">不可变评测计划</text><text x="56" y="368" class="node-body">样本、目录、环境、预算与基线</text><text x="56" y="392" class="node-body">契约、恢复、模型效果分项评估</text></g><g class="node" data-kind="backend"><rect x="40" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="536" class="tag">EVALUATION / EVALUATOR</text><text x="56" y="564" class="node-name">隔离评测与比较</text><text x="56" y="592" class="node-body">真实效果、质量、成本与副作用</text><text x="56" y="616" class="node-body">证据不足或不可比较明确报告</text></g><g class="node" data-kind="backend"><rect x="480" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="536" class="tag">IMPROVEMENT CANDIDATE</text><text x="496" y="564" class="node-name">受控改进候选</text><text x="496" y="592" class="node-body">依据问题与评测形成新版本</text><text x="496" y="616" class="node-body">不能自行提权或降低评测门槛</text></g><g class="node" data-kind="focal"><rect x="920" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="512" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="536" class="tag">EVOLUTION / RELEASE</text><text x="936" y="564" class="node-name">发布、监测与回滚</text><text x="936" y="592" class="node-body">配置经评测逐步启用</text><text x="936" y="616" class="node-body">代码须维护者确认；回滚后续选择</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text><line x1="904" y1="692" x2="928" y2="692" stroke="#4f5d75" stroke-width="2" stroke-dasharray="4,4"/><text x="940" y="696" class="legend">虚线：反馈 / 恢复</text></svg>
