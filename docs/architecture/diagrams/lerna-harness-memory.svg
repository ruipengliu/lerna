<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc"><title id="memory-title">记忆与上下文：来源约束贯穿整个生命周期</title><desc id="memory-desc">获准来源经提取形成正式记忆修订与可重建索引，查询得到受控候选，组装成带来源版本的任务上下文后供大脑使用。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="memory-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="memory-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="memory-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M360 128 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="380" y="88" width="80" height="24" fill="#f5f5f5"/><text x="420" y="104" text-anchor="middle" class="edge-label">授权提取</text><path d="M800 128 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="820" y="88" width="80" height="24" fill="#f5f5f5"/><text x="860" y="104" text-anchor="middle" class="edge-label">授权保存</text><path d="M1080 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="1104" y="232" width="80" height="24" fill="#f5f5f5"/><text x="1144" y="248" text-anchor="middle" class="edge-label">提交修订</text><path d="M360 352 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="380" y="312" width="80" height="24" fill="#f5f5f5"/><text x="420" y="328" text-anchor="middle" class="edge-label">有界查询</text><path d="M920 352 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#memory-arrow)"/><rect x="820" y="312" width="80" height="24" fill="#f5f5f5"/><text x="860" y="328" text-anchor="middle" class="edge-label">受控候选</text><path d="M640 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="664" y="456" width="96" height="24" fill="#f5f5f5"/><text x="712" y="472" text-anchor="middle" class="edge-label">组装上下文</text><path d="M800 576 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/><rect x="820" y="536" width="80" height="24" fill="#f5f5f5"/><text x="860" y="552" text-anchor="middle" class="edge-label">来源复核</text><g class="node" data-kind="input"><rect x="40" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="64" width="320" height="128" rx="8" fill="#4f5d75" fill-opacity="0.10" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="88" class="tag">SOURCE / EVIDENCE</text><text x="56" y="116" class="node-name">获准来源与证据</text><text x="56" y="144" class="node-body">原文、工具结果、用户明确输入</text><text x="56" y="168" class="node-body">获取时间、来源引用和数据策略</text></g><g class="node" data-kind="backend"><rect x="480" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="88" class="tag">EXTRACTION</text><text x="496" y="116" class="node-name">端侧或获准位置提取</text><text x="496" y="144" class="node-body">事实 / 偏好 / 推断 / 经验</text><text x="496" y="168" class="node-body">提取不自动授予保存或外发权限</text></g><g class="node" data-kind="focal"><rect x="920" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="64" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="936" y="88" class="tag">MEMORY AUTHORITY</text><text x="936" y="116" class="node-name">集合修改权威</text><text x="936" y="144" class="node-body">稳定记录身份；正式修订与冲突</text><text x="936" y="168" class="node-body">Put / Correct / Delete</text></g><g class="node" data-kind="input"><rect x="40" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="288" width="320" height="128" rx="8" fill="#4f5d75" fill-opacity="0.10" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="312" class="tag">QUERY</text><text x="56" y="340" class="node-name">任务检索请求</text><text x="56" y="368" class="node-body">主体、目标、用途、接收方</text><text x="56" y="392" class="node-body">范围、新鲜度与有界内容预算</text></g><g class="node" data-kind="backend"><rect x="480" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="312" class="tag">Query / Get</text><text x="496" y="340" class="node-name">受控检索与联合查询</text><text x="496" y="368" class="node-body">按位置与权限路由；返回候选</text><text x="496" y="392" class="node-body">失联或覆盖不足须明确表达</text></g><g class="node" data-kind="store"><rect x="920" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="288" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="936" y="312" class="tag">MEMORY STORE</text><text x="936" y="340" class="node-name">记忆记录与派生索引</text><text x="936" y="368" class="node-body">来源、版本、置信依据、适用范围</text><text x="936" y="392" class="node-body">索引与摘要可失效和重建</text></g><g class="node" data-kind="focal"><rect x="480" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="512" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="496" y="536" class="tag">TASK CONTEXT</text><text x="496" y="564" class="node-name">任务上下文</text><text x="496" y="592" class="node-body">目标、进展、证据与相关记忆</text><text x="496" y="616" class="node-body">来源修订；选入、排除和裁剪原因</text></g><g class="node" data-kind="backend"><rect x="920" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="536" class="tag">BRAIN / OUTPUT</text><text x="936" y="564" class="node-name">大脑使用与结果准入</text><text x="936" y="592" class="node-body">模型前后、答案或行动准入时复核</text><text x="936" y="616" class="node-body">来源失效阻止继续使用或发布</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text><line x1="904" y1="692" x2="928" y2="692" stroke="#4f5d75" stroke-width="2" stroke-dasharray="4,4"/><text x="940" y="696" class="legend">虚线：反馈 / 恢复</text></svg>
