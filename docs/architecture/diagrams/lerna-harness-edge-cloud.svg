<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edge-cloud-title edge-cloud-desc"><title id="edge-cloud-title">端云协作：部署位置与任务权威分离</title><desc id="edge-cloud-desc">一个示例中云侧拥有父任务，端侧拥有受委派子任务，两端以认证 WebSocket 交互并分别保留执行与记忆责任。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="edge-cloud-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="edge-cloud-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="edge-cloud-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><rect x="40" y="40" width="432" height="608" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#bfc0c0" stroke-dasharray="4,4"/><text x="56" y="64" class="zone-label">云侧节点 · 示例部署</text><rect x="808" y="40" width="432" height="608" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#bfc0c0" stroke-dasharray="4,4"/><text x="824" y="64" class="zone-label">端侧节点 · 示例部署</text><path d="M448 144 H832" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#edge-cloud-arrow-link)"/><rect x="566" y="104" width="148" height="24" fill="#f5f5f5"/><text x="640" y="120" text-anchor="middle" class="edge-label">WebSocket：委派</text><path d="M832 192 H448" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#edge-cloud-arrow)"/><rect x="554" y="152" width="172" height="24" fill="#f5f5f5"/><text x="640" y="168" text-anchor="middle" class="edge-label">获准结果 / 控制事实</text><path d="M256 224 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#edge-cloud-arrow)"/><rect x="280" y="252" width="80" height="24" fill="#f5f5f5"/><text x="320" y="268" text-anchor="middle" class="edge-label">受控执行</text><path d="M1024 224 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#edge-cloud-arrow)"/><rect x="1048" y="252" width="80" height="24" fill="#f5f5f5"/><text x="1088" y="268" text-anchor="middle" class="edge-label">受控执行</text><path d="M448 568 H832" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#edge-cloud-arrow-link)"/><rect x="554" y="528" width="172" height="24" fill="#f5f5f5"/><text x="640" y="544" text-anchor="middle" class="edge-label">授权查询 / 同步请求</text><path d="M832 616 H448" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#edge-cloud-arrow)"/><rect x="554" y="576" width="172" height="24" fill="#f5f5f5"/><text x="640" y="592" text-anchor="middle" class="edge-label">获准投影 / 修订结果</text><g class="node" data-kind="focal"><rect x="64" y="96" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="64" y="96" width="384" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="80" y="120" class="tag">CLOUD TASK OWNER</text><text x="80" y="148" class="node-name">父任务拥有者</text><text x="80" y="176" class="node-body">内核 + Brain；聚合子任务结果</text><text x="80" y="200" class="node-body">可调用远端能力，也可委派自主工作</text></g><g class="node" data-kind="backend"><rect x="832" y="96" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="832" y="96" width="384" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="848" y="120" class="tag">EDGE TASK OWNER</text><text x="848" y="148" class="node-name">受委派子任务拥有者</text><text x="848" y="176" class="node-body">独立任务状态与有限决策循环</text><text x="848" y="200" class="node-body">接收收缩后的目标、权限和预算</text></g><g class="node" data-kind="backend"><rect x="64" y="304" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="64" y="304" width="384" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="80" y="328" class="tag">LOCAL INTERFACE / gRPC</text><text x="80" y="356" class="node-name">云侧执行能力</text><text x="80" y="384" class="node-body">工具、搜索、内容获取、业务 API</text><text x="80" y="408" class="node-body">操作事实持久化；独立效果核对</text></g><g class="node" data-kind="backend"><rect x="832" y="304" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="832" y="304" width="384" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="848" y="328" class="tag">LOCAL INTERFACE / gRPC</text><text x="848" y="356" class="node-name">端侧执行能力</text><text x="848" y="384" class="node-body">设备驱动、端侧工具、私有处理</text><text x="848" y="408" class="node-body">用户接管同时约束 API 与 GUI</text></g><g class="node" data-kind="store"><rect x="64" y="512" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="64" y="512" width="384" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="80" y="536" class="tag">MEMORY COLLECTION</text><text x="80" y="564" class="node-name">云侧记忆与受控内容</text><text x="80" y="592" class="node-body">仅保存获准的内容与字段投影</text><text x="80" y="616" class="node-body">集合修改权威按策略配置</text></g><g class="node" data-kind="store"><rect x="832" y="512" width="384" height="128" rx="8" fill="#f5f5f5"/><rect x="832" y="512" width="384" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="848" y="536" class="tag">ON-DEVICE DATA</text><text x="848" y="564" class="node-name">端侧记忆与原始资料</text><text x="848" y="592" class="node-body">本地检索、提取与获准推理</text><text x="848" y="616" class="node-body">敏感原文及派生内容按策略留端</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text><line x1="904" y1="692" x2="928" y2="692" stroke="#4f5d75" stroke-width="2" stroke-dasharray="4,4"/><text x="940" y="696" class="legend">虚线：反馈 / 恢复</text></svg>
