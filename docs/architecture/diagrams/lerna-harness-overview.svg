<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">系统总览：内核连接三大逻辑系统</title><desc id="overview-desc">内核接纳任务并协调大脑、记忆和执行，授权、存储、扩展和观测分别提供公共保障。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
text{font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;fill:#2d3142}
.tag{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#4f5d75}
.node-name{font-size:20px;font-weight:600}
.node-body{font-size:16px;fill:#4f5d75}
.edge-label,.legend{font-size:16px;fill:#4f5d75}
.zone-label{font-size:16px;font-weight:500;fill:#4f5d75}
</style><marker id="overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M360 128 H392 Q400 128 400 136 V232 Q400 240 408 240 H512 Q520 240 520 248 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="408" y="208" width="80" height="24" fill="#f5f5f5"/><text x="448" y="224" text-anchor="middle" class="edge-label">提交任务</text><path d="M600 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="536" y="232" width="48" height="24" fill="#f5f5f5"/><text x="560" y="248" text-anchor="middle" class="edge-label">提案</text><path d="M680 288 V192" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#overview-arrow)"/><rect x="692" y="232" width="64" height="24" fill="#f5f5f5"/><text x="724" y="248" text-anchor="middle" class="edge-label">上下文</text><path d="M480 328 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="396" y="288" width="48" height="24" fill="#f5f5f5"/><text x="420" y="304" text-anchor="middle" class="edge-label">检索</text><path d="M360 384 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#overview-arrow)"/><rect x="372" y="344" width="96" height="24" fill="#f5f5f5"/><text x="420" y="360" text-anchor="middle" class="edge-label">受控上下文</text><path d="M800 328 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="836" y="288" width="48" height="24" fill="#f5f5f5"/><text x="860" y="304" text-anchor="middle" class="edge-label">行动</text><path d="M920 384 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#overview-arrow)"/><rect x="820" y="344" width="80" height="24" fill="#f5f5f5"/><text x="860" y="360" text-anchor="middle" class="edge-label">执行事实</text><path d="M1080 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="1100" y="232" width="96" height="24" fill="#f5f5f5"/><text x="1148" y="248" text-anchor="middle" class="edge-label">启动前复核</text><path d="M640 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="668" y="456" width="80" height="24" fill="#f5f5f5"/><text x="708" y="472" text-anchor="middle" class="edge-label">原子提交</text><path d="M280 512 V472 Q280 464 288 464 H512 Q520 464 520 456 V416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="360" y="432" width="80" height="24" fill="#f5f5f5"/><text x="400" y="448" text-anchor="middle" class="edge-label">激活配置</text><path d="M1080 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/><rect x="1100" y="456" width="80" height="24" fill="#f5f5f5"/><text x="1140" y="472" text-anchor="middle" class="edge-label">效果证据</text><g class="node" data-kind="input"><rect x="40" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="64" width="320" height="128" rx="8" fill="#4f5d75" fill-opacity="0.10" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="88" class="tag">ENTRY / UI</text><text x="56" y="116" class="node-name">任务入口与用户交互</text><text x="56" y="144" class="node-body">目标、补充事实、控制请求</text><text x="56" y="168" class="node-body">等待项、结果呈现与恢复</text></g><g class="node" data-kind="backend"><rect x="480" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="496" y="88" class="tag">Brain.Decide / Model.Generate</text><text x="496" y="116" class="node-name">大脑 Brain</text><text x="496" y="144" class="node-body">理解与规划；有限决策提案</text><text x="496" y="168" class="node-body">模型供应商与决策策略独立替换</text></g><g class="node" data-kind="backend"><rect x="920" y="64" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="64" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="88" class="tag">AUTHORIZATION</text><text x="936" y="116" class="node-name">身份、授权与凭证</text><text x="936" y="144" class="node-body">主体 / 资源 / 用途 / 位置 / 期限</text><text x="936" y="168" class="node-body">处理端复核；委派权限只收缩</text></g><g class="node" data-kind="backend"><rect x="40" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="312" class="tag">MEMORY / CONTEXT</text><text x="56" y="340" class="node-name">记忆与上下文</text><text x="56" y="368" class="node-body">事实、偏好、推断、经验</text><text x="56" y="392" class="node-body">来源修订、受控检索与上下文预算</text></g><g class="node" data-kind="focal"><rect x="480" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="288" width="320" height="128" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="496" y="312" class="tag">TASK OWNER / CORE</text><text x="496" y="340" class="node-name">Harness 内核</text><text x="496" y="368" class="node-body">唯一推进任务权威状态</text><text x="496" y="392" class="node-body">准入、调度、预算、取消与恢复</text></g><g class="node" data-kind="backend"><rect x="920" y="288" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="288" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="312" class="tag">CAPABILITY / DRIVER</text><text x="936" y="340" class="node-name">执行 Execution</text><text x="936" y="368" class="node-body">API 优先；GUI 适用兜底</text><text x="936" y="392" class="node-body">执行、观察、核对、取消与接管</text></g><g class="node" data-kind="backend"><rect x="40" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="40" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="56" y="536" class="tag">PLUGIN / SKILL / AGENT</text><text x="56" y="564" class="node-name">扩展登记与版本激活</text><text x="56" y="592" class="node-body">可替换实现、内容包与任务协作</text><text x="56" y="616" class="node-body">依赖锁定；按节点激活；旧工作保留</text></g><g class="node" data-kind="store"><rect x="480" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="480" y="512" width="320" height="128" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1.2"/><text x="496" y="536" class="tag">RunStore / WORK STORE</text><text x="496" y="564" class="node-name">运行存储与持久工作</text><text x="496" y="592" class="node-body">状态 + 记录 + 待处理工作</text><text x="496" y="616" class="node-body">同一任务原子提交；SQLite 参考</text></g><g class="node" data-kind="backend"><rect x="920" y="512" width="320" height="128" rx="8" fill="#f5f5f5"/><rect x="920" y="512" width="320" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="936" y="536" class="tag">OBSERVATION / EVALUATION</text><text x="936" y="564" class="node-name">运行观测与能力评测</text><text x="936" y="592" class="node-body">跨模块事实关联；质量、耗时、成本</text><text x="936" y="616" class="node-body">改进候选、隔离评测、发布与回滚</text></g><line x1="40" y1="664" x2="1240" y2="664" stroke="#bfc0c0"/><line x1="40" y1="692" x2="64" y2="692" stroke="#eb6c36" stroke-width="2"/><text x="76" y="696" class="legend">重点责任</text><line x1="264" y1="692" x2="288" y2="692" stroke="#2d3142" stroke-width="2"/><text x="300" y="696" class="legend">模块 / 处理职责</text><line x1="552" y1="692" x2="576" y2="692" stroke="#4f5d75" stroke-width="2"/><text x="588" y="696" class="legend">实线：请求或数据流</text><line x1="904" y1="692" x2="928" y2="692" stroke="#4f5d75" stroke-width="2" stroke-dasharray="4,4"/><text x="940" y="696" class="legend">虚线：反馈 / 恢复</text></svg>
