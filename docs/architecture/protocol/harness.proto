syntax = "proto3";
package harness.rpc.v1;
// Unpublished architecture-2026-10 binding. JSON semantics live in the same profile.
service HarnessService {
  rpc Call(CallRequest) returns (CallResponse);
  rpc EndpointChannel(stream ChannelFrame) returns (stream ChannelFrame);
}
message CallRequest {
  string logical_service_id = 1;
  oneof request {
    bytes command_json = 2;
    bytes query_json = 3;
    bytes receipt_lookup_json = 4;
    bytes content_transfer_json = 5;
  }
}
message CallResponse {
  oneof result {
    bytes receipt_json = 1;
    bytes query_result_json = 2;
    bytes error_json = 3;
    bytes content_transfer_json = 4;
  }
}
message ChannelFrame {
  string binding_id = 1;
  uint64 binding_revision = 2;
  bytes frame_json = 3;
}
