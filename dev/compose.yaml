name: lerna-dev

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${LERNA_PG_ADMIN_PASSWORD:?Run make setup first}
      LERNA_PG_APP_PASSWORD: ${LERNA_PG_APP_PASSWORD:?Run make setup first}
    ports:
      - "127.0.0.1:${LERNA_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-lerna.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 20s

volumes:
  postgres-data:
