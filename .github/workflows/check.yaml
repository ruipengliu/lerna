name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@12.8.1
      - run: make bootstrap
      - run: make check
  durable-admission:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: lerna_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: lerna_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lerna_test -d lerna_integration"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Provide the immutable PostgreSQL restore client
        run: |
          mkdir -p "$RUNNER_TEMP/lerna-psql-bin" "$RUNNER_TEMP/lerna-integration-tmp"
          ln -s "$GITHUB_WORKSPACE/scripts/ci-psql.sh" "$RUNNER_TEMP/lerna-psql-bin/psql"
          echo "$RUNNER_TEMP/lerna-psql-bin" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/lerna-integration-tmp" >> "$GITHUB_ENV"
          echo "LERNA_TEST_OWNED_SCOPE_REGISTRY=$RUNNER_TEMP/lerna-decision-owned-scopes" >> "$GITHUB_ENV"
          TMPDIR="$RUNNER_TEMP/lerna-integration-tmp" scripts/ci-psql.sh --version
      - name: Verify the immutable restore client lifecycle
        run: go test -race -count=1 -tags=integration,containerpsql -timeout=120s ./conformance/recovery -run '^TestContainerPsql'
        env:
          LERNA_TEST_POSTGRES_DSN: postgres://lerna_test:fixture-only-password@127.0.0.1:5432/lerna_integration?sslmode=disable
      - run: make test-integration
        env:
          LERNA_TEST_POSTGRES_DSN: postgres://lerna_test:fixture-only-password@127.0.0.1:5432/lerna_integration?sslmode=disable
      - run: make test-integration-race
        env:
          LERNA_TEST_POSTGRES_DSN: postgres://lerna_test:fixture-only-password@127.0.0.1:5432/lerna_integration?sslmode=disable
